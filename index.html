<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0F6E56">
<link rel="apple-touch-icon" href="icons/milon-icon-180.png">

 <title>Milon — Social App</title>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #F6F3EC;
    --card: #FFFFFF;
    --ink: #262420;
    --ink-soft: #6B6860;
    --line: #E4E0D5;
    --teal: #0F6E56;
    --teal-deep: #085041;
    --coral: #D85A30;
    --coral-soft: #FAECE7;
  }
  body {
    font-family: -apple-system, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
  }
  .app { max-width: 480px; margin: 0 auto; min-height: 100vh; background: var(--bg); position: relative; }

  /* ---------- LOGIN SCREEN ---------- */
  .login-screen {
    min-height: 100vh; display: flex; flex-direction: column;
    justify-content: center; padding: 32px 28px;
  }
  .brand { font-size: 34px; font-weight: 700; color: var(--teal-deep); letter-spacing: -0.5px; margin-bottom: 6px; }
  .tagline { color: var(--ink-soft); font-size: 15px; margin-bottom: 36px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 13px; color: var(--ink-soft); margin-bottom: 6px; }
  .field input {
    width: 100%; padding: 13px 14px; border: 1px solid var(--line); border-radius: 10px;
    font-size: 15px; background: var(--card); color: var(--ink);
  }
  .field input:focus { outline: none; border-color: var(--teal); }
  .btn-primary {
    width: 100%; padding: 14px; border: none; border-radius: 10px;
    background: var(--teal-deep); color: #fff; font-size: 15px; font-weight: 600;
    cursor: pointer; margin-top: 6px;
  }
  .btn-primary:disabled { background: var(--line); color: var(--ink-soft); }
  .link-btn {
    width: 100%; background: none; border: none; color: var(--teal-deep);
    font-size: 13px; margin-top: 14px; cursor: pointer; text-align: center;
  }
  .divider { display: flex; align-items: center; gap: 12px; margin: 20px 0; color: var(--ink-soft); font-size: 13px; }
  .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .btn-social {
    width: 100%; padding: 12px; border: 1px solid var(--line); border-radius: 10px;
    background: var(--card); font-size: 14px; font-weight: 600; color: var(--ink);
    display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer;
  }
  .error-msg { color: var(--coral); font-size: 13px; margin-top: 10px; text-align: center; min-height: 16px; }
  .loading-screen {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    color: var(--ink-soft); font-size: 15px;
  }

  /* ---------- MAIN APP ---------- */
  .topbar {
    position: sticky; top: 0; z-index: 5; background: var(--bg);
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 18px; border-bottom: 1px solid var(--line);
  }
  .topbar .brand-sm { font-size: 20px; font-weight: 700; color: var(--teal-deep); }
  .topbar-right { display: flex; align-items: center; gap: 10px; }
  .logout-btn { border: none; background: none; color: var(--ink-soft); font-size: 12px; cursor: pointer; }
  .avatar {
    width: 34px; height: 34px; border-radius: 50%; background: var(--coral-soft);
    color: var(--coral); display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 13px; flex-shrink: 0;
  }

  .composer { background: var(--card); margin: 14px; border-radius: 14px; border: 1px solid var(--line); padding: 14px; }
  .composer-top { display: flex; gap: 10px; }
  .composer textarea {
    flex: 1; border: none; resize: none; font-size: 15px; font-family: inherit;
    min-height: 44px; background: transparent; color: var(--ink);
  }
  .composer textarea:focus { outline: none; }
  .preview-wrap { position: relative; margin-top: 10px; }
  .preview-wrap img { width: 100%; border-radius: 10px; max-height: 260px; object-fit: cover; }
  .remove-media {
    position: absolute; top: 8px; right: 8px; background: rgba(0,0,0,0.55); color: #fff;
    border: none; border-radius: 50%; width: 26px; height: 26px; cursor: pointer; font-size: 14px;
  }
  .composer-actions { display: flex; align-items: center; justify-content: space-between; margin-top: 12px; }
  .icon-btn {
    border: none; background: var(--coral-soft); color: var(--coral); width: 36px; height: 36px;
    border-radius: 9px; cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center;
  }
  .post-btn {
    border: none; background: var(--teal-deep); color: #fff; padding: 9px 20px;
    border-radius: 9px; font-weight: 600; font-size: 14px; cursor: pointer;
  }
  .post-btn:disabled { background: var(--line); color: var(--ink-soft); cursor: not-allowed; }

  .feed { padding: 0 14px 90px; }
  .post {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    margin-bottom: 14px; overflow: hidden;
  }
  .post-head { display: flex; align-items: center; gap: 10px; padding: 12px 14px; }
  .post-head .name { font-weight: 600; font-size: 14px; }
  .post-head .time { font-size: 12px; color: var(--ink-soft); display: flex; align-items: center; gap: 6px; }
  .post-head-info { flex: 1; }
  .owner-menu-btn {
    border: none; background: none; color: var(--ink-soft); font-size: 20px;
    padding: 4px 10px; cursor: pointer; line-height: 1;
  }
  .privacy-tag { font-size: 11px; color: var(--ink-soft); }
  .post-text { padding: 0 14px 10px; font-size: 15px; line-height: 1.6; white-space: pre-wrap; }
  .post-media img { width: 100%; display: block; max-height: 420px; object-fit: cover; }
  .post-stats { display: flex; justify-content: space-between; padding: 8px 14px; font-size: 12px; color: var(--ink-soft); }
  .post-actions { display: flex; border-top: 1px solid var(--line); }
  .action-btn {
    flex: 1; border: none; background: none; padding: 11px 0; font-size: 13px; font-weight: 600;
    color: var(--ink-soft); cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px;
  }
  .action-btn.liked { color: var(--coral); }

  .comments-box { border-top: 1px solid var(--line); padding: 10px 14px; }
  .comment-line { font-size: 13px; margin-bottom: 6px; line-height: 1.5; }
  .comment-line b { font-weight: 600; }
  .comment-input-row { display: flex; gap: 8px; margin-top: 8px; }
  .comment-input-row input {
    flex: 1; border: 1px solid var(--line); border-radius: 20px; padding: 8px 14px; font-size: 13px;
    background: var(--bg);
  }
  .comment-input-row button {
    border: none; background: var(--teal-deep); color: #fff; border-radius: 20px;
    padding: 8px 16px; font-size: 13px; font-weight: 600; cursor: pointer;
  }

  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: var(--ink); color: #fff; padding: 10px 20px; border-radius: 20px;
    font-size: 13px; opacity: 0; pointer-events: none; transition: opacity 0.25s;
    max-width: 90%; text-align: center; z-index: 20;
  }
  .toast.show { opacity: 1; }
  .empty-state { text-align: center; padding: 60px 20px; color: var(--ink-soft); }
  .empty-state .big { font-size: 36px; margin-bottom: 10px; }

  /* ---------- BOTTOM SHEETS (share + owner menu) ---------- */
  .sheet-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 999;
  }
  .sheet-overlay.open { display: block; }
  .bottom-sheet {
    position: fixed; left: 0; right: 0; bottom: 0; margin: 0 auto; max-width: 480px;
    background: var(--card); border-radius: 18px 18px 0 0; padding: 16px;
    transform: translateY(100%); transition: transform 0.25s ease-out;
    z-index: 1000; max-height: 75vh; overflow-y: auto;
  }
  .bottom-sheet.open { transform: translateY(0); }
  .sheet-handle { width: 40px; height: 4px; background: var(--line); border-radius: 2px; margin: 0 auto 14px; }
  .sheet-title { font-size: 13px; color: var(--ink-soft); margin-bottom: 10px; padding: 0 4px; }
  .sheet-row { display: flex; gap: 18px; overflow-x: auto; padding: 4px 4px 16px; }
  .sheet-item {
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    min-width: 62px; background: none; border: none; font-size: 12px; color: var(--ink); cursor: pointer;
  }
  .sheet-icon {
    width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center;
    justify-content: center; color: #fff; font-size: 20px;
  }
  .menu-list-item {
    display: flex; align-items: center; gap: 14px; padding: 14px 4px;
    border-bottom: 1px solid var(--line); background: none; border-left: none;
    border-right: none; border-top: none; width: 100%; text-align: left;
    font-size: 15px; color: var(--ink); cursor: pointer;
  }
  .menu-list-item:last-child { border-bottom: none; }
  .menu-list-item.danger { color: var(--coral); }
  .privacy-options { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .privacy-option {
    border: 1px solid var(--line); background: var(--bg); border-radius: 20px;
    padding: 7px 14px; font-size: 13px; color: var(--ink); cursor: pointer;
  }
  .privacy-option.selected { background: var(--teal-deep); color: #fff; border-color: var(--teal-deep); }
</style>
</head>
<body>
<div id="root" class="app"></div>

<script>
/* ================= Firebase config ================= */
const firebaseConfig = {
  apiKey: "AIzaSyDTRdBE8OniAAbmN7iQgo9ejqGqehAer5U",
  authDomain: "tik-tok-vai.firebaseapp.com",
  projectId: "tik-tok-vai",
  storageBucket: "tik-tok-vai.firebasestorage.app",
  messagingSenderId: "182459233826",
  appId: "1:182459233826:web:9cfb0c7d24d51307b37c7b",
  measurementId: "G-0GXPRM00VH"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

/* ================= App state ================= */
const root = document.getElementById("root");

let state = {
  authReady: false,
  user: null,
  mode: "login",       // login | signup
  authError: "",
  posts: [],
  composerText: "",
  composerMedia: null,
  toastMsg: "",
  openComments: {}
};

// Tracks which post the share/owner sheet is currently acting on
let activePostId = null;

function setState(patch) {
  state = { ...state, ...patch };
  render();
}

function initials(name) {
  if (!name) return "?";
  return name.trim().split(" ").map(w => w[0]).slice(0, 2).join("").toUpperCase();
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str || "";
  return div.innerHTML;
}

function showToast(msg) {
  state.toastMsg = msg;
  render();
  requestAnimationFrame(() => {
    const t = document.getElementById("toast");
    if (t) t.classList.add("show");
  });
  setTimeout(() => {
    const t = document.getElementById("toast");
    if (t) t.classList.remove("show");
  }, 2200);
}

/* ================= Auth listener ================= */
auth.onAuthStateChanged((firebaseUser) => {
  if (firebaseUser) {
    state.user = {
      uid: firebaseUser.uid,
      name: firebaseUser.displayName || (firebaseUser.email ? firebaseUser.email.split("@")[0] : "User"),
      email: firebaseUser.email
    };
    state.authReady = true;
    listenToPosts();
  } else {
    state.user = null;
    state.authReady = true;
    state.posts = [];
    render();
  }
  render();
});

/* ================= Real-time posts from Firestore ================= */
let unsubscribePosts = null;
function listenToPosts() {
  if (unsubscribePosts) unsubscribePosts();
  unsubscribePosts = db.collection("posts")
    .orderBy("createdAt", "desc")
    .limit(50)
    .onSnapshot((snapshot) => {
      state.posts = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
      render();
    }, (err) => {
      console.error(err);
      showToast("Couldn't load posts");
    });
}

/* ================= Render ================= */
function render() {
  if (!state.authReady) {
    root.innerHTML = `<div class="loading-screen">Loading...</div>`;
    return;
  }
  if (!state.user) {
    renderLogin();
  } else {
    renderApp();
  }
}

function renderLogin() {
  const isSignup = state.mode === "signup";
  root.innerHTML = `
    <div class="login-screen">
      <div class="brand">Milon</div>
      <div class="tagline">Stay connected with friends and family</div>

      ${isSignup ? `
      <div class="field">
        <label>Name</label>
        <input id="nameInput" type="text" placeholder="Your name" />
      </div>` : ""}

      <div class="field">
        <label>Email</label>
        <input id="emailInput" type="email" placeholder="you@example.com" />
      </div>
      <div class="field">
        <label>Password</label>
        <input id="passInput" type="password" placeholder="At least 6 characters" />
      </div>

      <button class="btn-primary" id="submitAuthBtn">${isSignup ? "Create account" : "Log in"}</button>
      <div class="error-msg" id="authErrorMsg">${escapeHtml(state.authError)}</div>

      <button class="link-btn" id="toggleModeBtn">${isSignup ? "Already have an account? Log in" : "New here? Create an account"}</button>

      <div class="divider">or</div>
      <button class="btn-social" id="googleBtn"><span style="width:18px;height:18px;border-radius:50%;background:#EA4335;display:inline-block;"></span> Continue with Google</button>
    </div>
  `;

  document.getElementById("submitAuthBtn").onclick = handleAuthSubmit;
  document.getElementById("toggleModeBtn").onclick = () => setState({ mode: isSignup ? "login" : "signup", authError: "" });
  document.getElementById("googleBtn").onclick = handleGoogleLogin;
}

function handleAuthSubmit() {
  const email = document.getElementById("emailInput").value.trim();
  const pass = document.getElementById("passInput").value;
  const isSignup = state.mode === "signup";
  const name = isSignup ? document.getElementById("nameInput").value.trim() : null;

  if (!email || !pass || (isSignup && !name)) {
    setState({ authError: "Please fill in all fields" });
    return;
  }
  if (pass.length < 6) {
    setState({ authError: "Password must be at least 6 characters" });
    return;
  }

  const btn = document.getElementById("submitAuthBtn");
  btn.disabled = true;
  btn.textContent = "Please wait...";

  const action = isSignup
    ? auth.createUserWithEmailAndPassword(email, pass).then((cred) => cred.user.updateProfile({ displayName: name }))
    : auth.signInWithEmailAndPassword(email, pass);

  action
    .then(() => setState({ authError: "" }))
    .catch((err) => setState({ authError: translateAuthError(err.code) }));
}

function handleGoogleLogin() {
  const provider = new firebase.auth.GoogleAuthProvider();
  auth.signInWithPopup(provider).catch((err) => {
    setState({ authError: translateAuthError(err.code) });
  });
}

function translateAuthError(code) {
  const map = {
    "auth/email-already-in-use": "An account with this email already exists",
    "auth/invalid-email": "Please enter a valid email",
    "auth/user-not-found": "No account found with this email",
    "auth/wrong-password": "Incorrect password",
    "auth/invalid-credential": "Incorrect email or password",
    "auth/popup-closed-by-user": "Login cancelled"
  };
  return map[code] || "Something went wrong, please try again";
}

function handleLogout() {
  auth.signOut();
}

function renderApp() {
  // Privacy filter: public is visible to everyone; private/friends are visible only to the author
  // (there is no friends-list system yet, so "friends" currently behaves like "private")
  const visiblePosts = state.posts.filter(p => {
    if (!p.privacy || p.privacy === "public") return true;
    return p.authorUid === state.user.uid;
  });

  const feedHtml = visiblePosts.length
    ? visiblePosts.map(renderPost).join("")
    : `<div class="empty-state"><div class="big">📭</div>No posts yet.<br>Create the first one above.</div>`;

  root.innerHTML = `
    <div class="topbar">
      <div class="brand-sm">Milon</div>
      <div class="topbar-right">
        <button class="logout-btn" id="logoutBtn">Log out</button>
        <div class="avatar">${initials(state.user.name)}</div>
      </div>
    </div>

    <div class="composer">
      <div class="composer-top">
        <div class="avatar">${initials(state.user.name)}</div>
        <textarea id="composerInput" placeholder="What's on your mind, ${escapeHtml(state.user.name.split(" ")[0])}?">${escapeHtml(state.composerText)}</textarea>
      </div>
      ${state.composerMedia ? `
        <div class="preview-wrap">
          <img src="${state.composerMedia}" />
          <button class="remove-media" id="removeMediaBtn">✕</button>
        </div>` : ""}
      <div class="composer-actions">
        <label class="icon-btn" title="Add photo">
          🖼️
          <input type="file" accept="image/*" id="imageInput" style="display:none" />
        </label>
        <button class="post-btn" id="submitPostBtn" ${(!state.composerText.trim() && !state.composerMedia) ? "disabled" : ""}>Post</button>
      </div>
    </div>

    <div class="feed">${feedHtml}</div>

    <div class="toast" id="toast">${escapeHtml(state.toastMsg)}</div>

    <!-- ================= Share sheet ================= -->
    <div class="sheet-overlay" id="shareOverlay"></div>
    <div class="bottom-sheet" id="shareSheet">
      <div class="sheet-handle"></div>
      <div class="sheet-title">Share</div>
      <div class="sheet-row">
        <button class="sheet-item" id="copyLinkBtn">
          <span class="sheet-icon" style="background:#3b82f6">🔗</span> Copy link
        </button>
        <button class="sheet-item" id="shareWhatsapp">
          <span class="sheet-icon" style="background:#25D366">📱</span> WhatsApp
        </button>
        <button class="sheet-item" id="shareMessenger">
          <span class="sheet-icon" style="background:#0084FF">✉️</span> Messenger
        </button>
        <button class="sheet-item" id="shareFacebook">
          <span class="sheet-icon" style="background:#1877F2">f</span> Facebook
        </button>
        <button class="sheet-item" id="shareTelegram">
          <span class="sheet-icon" style="background:#0088cc">➤</span> Telegram
        </button>
        <button class="sheet-item" id="shareSms">
          <span class="sheet-icon" style="background:#6b7280">💬</span> SMS
        </button>
        <button class="sheet-item" id="shareMore">
          <span class="sheet-icon" style="background:#111">⋯</span> More
        </button>
      </div>
    </div>

    <!-- ================= Owner post menu ================= -->
    <div class="sheet-overlay" id="ownerOverlay"></div>
    <div class="bottom-sheet" id="ownerSheet">
      <div class="sheet-handle"></div>
      <button class="menu-list-item" id="editPostBtn">✏️ Edit post</button>
      <div class="menu-list-item" style="display:block; cursor:default;">
        🔒 Who can see this
        <div class="privacy-options" id="privacyOptions">
          <button class="privacy-option" data-level="public">Public</button>
          <button class="privacy-option" data-level="friends">Friends</button>
          <button class="privacy-option" data-level="private">Only me</button>
        </div>
      </div>
      <button class="menu-list-item danger" id="deletePostBtn">🗑️ Delete</button>
    </div>
  `;

  document.getElementById("logoutBtn").onclick = handleLogout;

  document.getElementById("composerInput").oninput = (e) => {
    state.composerText = e.target.value;
    document.getElementById("submitPostBtn").disabled = !state.composerText.trim() && !state.composerMedia;
  };

  document.getElementById("imageInput").onchange = handleImageSelect;

  const removeBtn = document.getElementById("removeMediaBtn");
  if (removeBtn) removeBtn.onclick = () => setState({ composerMedia: null });

  document.getElementById("submitPostBtn").onclick = submitPost;

  visiblePosts.forEach(p => {
    const likeBtn = document.getElementById(`like-${p.id}`);
    const commentBtn = document.getElementById(`comment-${p.id}`);
    const shareBtn = document.getElementById(`share-${p.id}`);
    const ownerBtn = document.getElementById(`owner-${p.id}`);
    if (likeBtn) likeBtn.onclick = () => toggleLike(p);
    if (commentBtn) commentBtn.onclick = () => setState({ openComments: { ...state.openComments, [p.id]: !state.openComments[p.id] } });
    if (shareBtn) shareBtn.onclick = () => openShareSheet(p.id);
    if (ownerBtn) ownerBtn.onclick = () => openOwnerMenu(p.id);

    const commentSubmit = document.getElementById(`commentSubmit-${p.id}`);
    if (commentSubmit) commentSubmit.onclick = () => submitComment(p.id);
    const commentInput = document.getElementById(`commentInput-${p.id}`);
    if (commentInput) commentInput.onkeydown = (e) => { if (e.key === "Enter") submitComment(p.id); };
  });

  wireSheetHandlers();
}

/* ================= Share sheet: handlers ================= */
function wireSheetHandlers() {
  document.getElementById("shareOverlay").onclick = closeSheets;
  document.getElementById("ownerOverlay").onclick = closeSheets;

  document.getElementById("copyLinkBtn").onclick = doCopyLink;
  document.getElementById("shareWhatsapp").onclick = () => doShareTo("whatsapp");
  document.getElementById("shareMessenger").onclick = () => doShareTo("messenger");
  document.getElementById("shareFacebook").onclick = () => doShareTo("facebook");
  document.getElementById("shareTelegram").onclick = () => doShareTo("telegram");
  document.getElementById("shareSms").onclick = () => doShareTo("sms");
  document.getElementById("shareMore").onclick = doNativeShare;

  document.getElementById("editPostBtn").onclick = doEditPost;
  document.getElementById("deletePostBtn").onclick = doDeletePost;
  document.querySelectorAll(".privacy-option").forEach(btn => {
    btn.onclick = () => setPrivacy(btn.dataset.level);
  });
}

function openShareSheet(postId) {
  activePostId = postId;
  document.getElementById("shareOverlay").classList.add("open");
  document.getElementById("shareSheet").classList.add("open");
}

function openOwnerMenu(postId) {
  activePostId = postId;
  const post = state.posts.find(p => p.id === postId);
  document.getElementById("ownerOverlay").classList.add("open");
  document.getElementById("ownerSheet").classList.add("open");
  const currentLevel = (post && post.privacy) || "public";
  document.querySelectorAll(".privacy-option").forEach(btn => {
    btn.classList.toggle("selected", btn.dataset.level === currentLevel);
  });
}

function closeSheets() {
  document.querySelectorAll(".sheet-overlay, .bottom-sheet").forEach(el => el.classList.remove("open"));
  activePostId = null;
}

function getPostLink(postId) {
  return `${window.location.origin}${window.location.pathname}?post=${postId}`;
}

function doCopyLink() {
  const link = getPostLink(activePostId);
  navigator.clipboard.writeText(link).then(() => {
    showToast("Link copied!");
    closeSheets();
  }).catch(() => {
    showToast("Couldn't copy the link");
  });
}

function doShareTo(platform) {
  const link = encodeURIComponent(getPostLink(activePostId));
  const text = encodeURIComponent("Check out this post on Milon!");
  const urls = {
    whatsapp: `https://wa.me/?text=${text}%20${link}`,
    messenger: `fb-messenger://share/?link=${link}`,
    facebook: `https://www.facebook.com/sharer/sharer.php?u=${link}`,
    telegram: `https://t.me/share/url?url=${link}&text=${text}`,
    sms: `sms:?body=${text}%20${link}`,
  };
  window.open(urls[platform], "_blank");
  closeSheets();
}

function doNativeShare() {
  if (navigator.share) {
    navigator.share({
      title: "Milon",
      text: "Check out this post on Milon!",
      url: getPostLink(activePostId),
    }).catch(() => {});
  } else {
    doCopyLink();
    return;
  }
  closeSheets();
}

/* ================= Own post: Edit / Delete / Privacy ================= */
function doEditPost() {
  const post = state.posts.find(p => p.id === activePostId);
  if (!post) return;
  const newText = prompt("Edit post:", post.text || "");
  if (newText !== null && newText.trim() !== "") {
    db.collection("posts").doc(post.id).update({ text: newText.trim() })
      .then(() => showToast("Post updated"))
      .catch((err) => { console.error(err); showToast("Couldn't update the post"); });
  }
  closeSheets();
}

function doDeletePost() {
  if (!activePostId) return;
  if (!confirm("Delete this post? This can't be undone.")) return;
  db.collection("posts").doc(activePostId).delete()
    .then(() => showToast("Post deleted"))
    .catch((err) => { console.error(err); showToast("Couldn't delete the post"); });
  closeSheets();
}

function setPrivacy(level) {
  if (!activePostId) return;
  db.collection("posts").doc(activePostId).update({ privacy: level })
    .then(() => showToast("Privacy updated"))
    .catch((err) => { console.error(err); showToast("Couldn't update privacy"); });
  closeSheets();
}

/* Take a photo, compress it, and convert it to base64 */
function handleImageSelect(e) {
  const file = e.target.files[0];
  if (!file) return;

  const img = new Image();
  const reader = new FileReader();
  reader.onload = (ev) => {
    img.onload = () => {
      const maxDim = 900;
      let { width, height } = img;
      if (width > maxDim || height > maxDim) {
        if (width > height) { height = Math.round(height * maxDim / width); width = maxDim; }
        else { width = Math.round(width * maxDim / height); height = maxDim; }
      }
      const canvas = document.createElement("canvas");
      canvas.width = width;
      canvas.height = height;
      canvas.getContext("2d").drawImage(img, 0, 0, width, height);
      const compressed = canvas.toDataURL("image/jpeg", 0.7);
      setState({ composerMedia: compressed });
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

function submitPost() {
  if (!state.composerText.trim() && !state.composerMedia) return;

  const postBtn = document.getElementById("submitPostBtn");
  postBtn.disabled = true;
  postBtn.textContent = "Posting...";

  db.collection("posts").add({
    authorUid: state.user.uid,
    authorName: state.user.name,
    text: state.composerText.trim(),
    media: state.composerMedia,
    privacy: "public",
    likes: [],
    comments: [],
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  }).then(() => {
    setState({ composerText: "", composerMedia: null });
  }).catch((err) => {
    console.error(err);
    showToast("Couldn't create the post");
    render();
  });
}

function toggleLike(post) {
  const uid = state.user.uid;
  const liked = (post.likes || []).includes(uid);
  const ref = db.collection("posts").doc(post.id);
  ref.update({
    likes: liked
      ? firebase.firestore.FieldValue.arrayRemove(uid)
      : firebase.firestore.FieldValue.arrayUnion(uid)
  }).catch((err) => console.error(err));
}

function submitComment(postId) {
  const input = document.getElementById(`commentInput-${postId}`);
  const text = input.value.trim();
  if (!text) return;

  const ref = db.collection("posts").doc(postId);
  ref.update({
    comments: firebase.firestore.FieldValue.arrayUnion({
      name: state.user.name,
      text: text
    })
  }).catch((err) => console.error(err));

  input.value = "";
}

function timeAgo(ts) {
  if (!ts || !ts.toDate) return "just now";
  const diffMs = Date.now() - ts.toDate().getTime();
  const mins = Math.floor(diffMs / 60000);
  if (mins < 1) return "just now";
  if (mins < 60) return `${mins}m ago`;
  const hrs = Math.floor(mins / 60);
  if (hrs < 24) return `${hrs}h ago`;
  return `${Math.floor(hrs / 24)}d ago`;
}

function privacyLabel(level) {
  if (level === "private") return "· Only me";
  if (level === "friends") return "· Friends";
  return "";
}

function renderPost(p) {
  const likes = p.likes || [];
  const comments = p.comments || [];
  const liked = state.user && likes.includes(state.user.uid);
  const showComments = !!state.openComments[p.id];
  const isOwner = state.user && p.authorUid === state.user.uid;

  const mediaHtml = p.media ? `<div class="post-media"><img src="${p.media}" /></div>` : "";

  const commentsHtml = showComments ? `
    <div class="comments-box">
      ${comments.map(c => `<div class="comment-line"><b>${escapeHtml(c.name)}:</b> ${escapeHtml(c.text)}</div>`).join("")}
      <div class="comment-input-row">
        <input id="commentInput-${p.id}" type="text" placeholder="Write a comment..." />
        <button id="commentSubmit-${p.id}">Send</button>
      </div>
    </div>
  ` : "";

  return `
    <div class="post">
      <div class="post-head">
        <div class="avatar">${initials(p.authorName)}</div>
        <div class="post-head-info">
          <div class="name">${escapeHtml(p.authorName)}</div>
          <div class="time">${timeAgo(p.createdAt)} <span class="privacy-tag">${privacyLabel(p.privacy)}</span></div>
        </div>
        ${isOwner ? `<button class="owner-menu-btn" id="owner-${p.id}">⋮</button>` : ""}
      </div>
      ${p.text ? `<div class="post-text">${escapeHtml(p.text)}</div>` : ""}
      ${mediaHtml}
      <div class="post-stats">
        <span>${likes.length} likes</span>
        <span>${comments.length} comments</span>
      </div>
      <div class="post-actions">
        <button class="action-btn ${liked ? "liked" : ""}" id="like-${p.id}">${liked ? "❤️" : "🤍"} Like</button>
        <button class="action-btn" id="comment-${p.id}">💬 Comment</button>
        <button class="action-btn" id="share-${p.id}">↗️ Share</button>
      </div>
      ${commentsHtml}
    </div>
  `;
}

render();
</script><script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js");
    });
  }
</script>
