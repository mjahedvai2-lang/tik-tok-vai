const MAX_PINNED_POSTS = 3;

/* TikTok's own profile grid has no visible "⋯" on a thumbnail — a long-press on your own
   video/photo is what opens the quick-actions sheet (Pin/Privacy/Delete/Edit). This mirrors
   that: hold ~450ms to open the owner menu, and suppress the tap-to-open that would otherwise
   fire right after. */
function attachGridLongPress(el, postId, onFire) {
  let timer = null;
  const clear = () => { if (timer) { clearTimeout(timer); timer = null; } };
  const start = () => {
    clear();
    timer = setTimeout(() => {
      timer = null;
      if (onFire) onFire();
      if (navigator.vibrate) navigator.vibrate(15);
      openGridOwnerMenu(postId);
    }, 450);
  };
  el.addEventListener("touchstart", start, { passive: true });
  el.addEventListener("touchend", clear);
  el.addEventListener("touchmove", clear);
  el.addEventListener("touchcancel", clear);
  el.addEventListener("mousedown", start);
  el.addEventListener("mouseup", clear);
  el.addEventListener("mouseleave", clear);
}

function togglePinPost(postId) {
  const myUid = state.user.uid;
  const pinnedPosts = (state.myUserDoc && state.myUserDoc.pinnedPosts) || [];
  const isPinned = pinnedPosts.includes(postId);
  if (!isPinned && pinnedPosts.length >= MAX_PINNED_POSTS) {
    showToast(t("onlyPinUpTo").replace("{n}", MAX_PINNED_POSTS));

  const newPinnedPosts = isPinned
    ? pinnedPosts.filter(id => id !== postId)

  db.collection("users").doc(myUid).update({
    pinnedPosts: newPinnedPosts
  }).then(() => {

  }).catch((err) => { console.error(err); showToast(t("couldntUpdatePin")); });

/* ---------------- Following / Followers list screen ---------------- */
function openFollowList(targetUid, kind) {
  // allUsers is kept live by listenToAllUsers() (started at login) — real-time already.
  setState({ view: "followList", followListUid: targetUid, followListKind: kind, followListSearch: "" });
}

/* Computes the three tab lists (Following / Followers / Friends) for whichever profile
   this screen is open on. "Friends" = mutual: people that profile follows AND who follow
   that profile back. */
function computeFollowListData() {
  const targetUid = state.followListUid;
  const isOwn = targetUid === state.user.uid;
  const profile = isOwn ? state.profile : (state.profileUserDoc && state.profileUserDoc.uid === targetUid ? state.profileUserDoc : (state.allUsers.find(u => u.uid === targetUid) || {}));
  const followingIds = profile.following || [];
  const followerIds = profile.followers || [];
  const friendIds = followingIds.filter(id => followerIds.includes(id));
  const idsForKind = { following: followingIds, followers: followerIds, friends: friendIds };
  const kind = idsForKind[state.followListKind] ? state.followListKind : "following";

  const q = (state.followListSearch || "").trim().toLowerCase();
  let list = state.allUsers.filter(u => (idsForKind[kind] || []).includes(u.uid));
  if (q) {
    list = list.filter(u => (u.name || "").toLowerCase().includes(q) || (u.handle || "").toLowerCase().includes(q));
  }
  return { profile, kind, list, isSearching: !!q, counts: { following: followingIds.length, followers: followerIds.length, friends: friendIds.length } };
}

/* Row renderer used only on this Following/Followers/Friends screen. Unlike the Friends
   tab's renderUserRow, there's no pin icon or Message button here — tapping the avatar or
   name opens the profile (where Message lives instead), and on your own list a "⋯" menu
   offers Remove.
   Button has 4 states from the two directions of the relationship:
     I follow them + they follow me   -> "Friends"     (gray)
     I follow them + they don't       -> "Following"   (gray)
     I don't follow + they follow me  -> "Follow back" (red)
     neither follows the other        -> "Follow"      (red) */
function renderFollowListUserRow(u, myUid, isOwn) {
  const amFollowing = (u.followers || []).includes(myUid);
  const theyFollowMe = (u.following || []).includes(myUid);
  const isRequested = !amFollowing && (u.followRequests || []).includes(myUid);
  const label = amFollowing ? (theyFollowMe ? t("friendsLabel") : t("followingLabel")) : (isRequested ? t("requestedLabel") : (theyFollowMe ? t("followBackLabel") : t("followLabel")));
  const cls = amFollowing ? "following" : (isRequested ? "requested" : "");
  const online = isUserOnline(u.uid);
  return `
    <div class="user-row">
      <div class="avatar" id="useravatar-${u.uid}">${u.avatar ? `<img src="${u.avatar}" />` : initials(u.name || t("userLabel"))}${online ? `<span class="presence-dot"></span>` : ""}</div>
      <div class="user-row-info" id="userinfo-${u.uid}">
        <div class="u-name">${escapeHtml(u.name || t("userLabel"))}</div>
        <div class="u-handle">@${escapeHtml(u.handle || slugifyHandle(u.name || "user"))}</div>
      </div>
      <div class="user-row-actions">
        <button class="pill-btn ${cls}" id="followbtn-${u.uid}">${label}</button>
        ${isOwn ? `<button class="kebab-btn" id="kebabbtn-${u.uid}" title="More">⋯</button>` : ""}
      </div>
    </div>
  `;
}

function wireFollowListRowHandlers(list) {
  list.forEach(u => {
    const rowAvatar = document.getElementById(`useravatar-${u.uid}`);

function renderFollowListOnly() {

/* "Remove" from the ⋯ menu on your own Following/Followers/Friends screen. On the
   Followers tab this removes them as your follower without touching who you follow; on
   the Following/Friends tabs it unfollows them — same effect as tapping "Following". */
function openRemoveConnMenu(uid) {
  activeFollowListRemoveUid = uid;
  const overlay = document.getElementById("removeConnOverlay");
  const sheet = document.getElementById("removeConnSheet");
  if (overlay) overlay.classList.add("open");
  if (sheet) sheet.classList.add("open");
}

function doRemoveConnection() {
  const uid = activeFollowListRemoveUid;
  const kind = state.followListKind;
  closeSheets();
  if (!uid) return;
  const myUid = state.user.uid;
  const targetRef = db.collection("users").doc(uid);
  const myRef = db.collection("users").doc(myUid);
  const batch = db.batch();
  if (kind === "followers") {
    batch.update(myRef, { followers: firebase.firestore.FieldValue.arrayRemove(uid) });
    batch.update(targetRef, { following: firebase.firestore.FieldValue.arrayRemove(myUid) });
  } else {
    batch.update(myRef, { following: firebase.firestore.FieldValue.arrayRemove(uid) });
    batch.update(targetRef, { followers: firebase.firestore.FieldValue.arrayRemove(myUid) });
  }
  batch.commit().then(() => {
    const updated = state.allUsers.map(u => {
      if (u.uid !== uid) return u;
      const followers = new Set(u.followers || []);
      const following = new Set(u.following || []);
      if (kind === "followers") following.delete(myUid); else followers.delete(myUid);
      return { ...u, followers: Array.from(followers), following: Array.from(following) };
    });
    setState({ allUsers: updated });
    showToast(kind === "followers" ? "Removed" : "Unfollowed");
  }).catch((err) => {
    console.error(err);
    showToast(t("couldntRemoveCheckConnection"));
  });
}

function handleChangePassword() {
  const { pwCurrent, pwNew, pwConfirm } = state;
  if (!pwCurrent || !pwNew || !pwConfirm) { setState({ pwError: t("fillAllThreeFields") }); return; }
  if (pwNew.length < 6) { setState({ pwError: t("newPasswordMinChars") }); return; }
  if (pwNew !== pwConfirm) { setState({ pwError: t("newPasswordsDontMatch") }); return; }

  setState({ pwError: "", pwSaving: true });
  const user = auth.currentUser;
  const credential = firebase.auth.EmailAuthProvider.credential(user.email, pwCurrent);
  user.reauthenticateWithCredential(credential)
    .then(() => user.updatePassword(pwNew))
    .then(() => {
      setState({ pwSaving: false, pwCurrent: "", pwNew: "", pwConfirm: "", view: "settingsSecurity" });
      showToast(t("passwordUpdatedToast"));
    })
    .catch((err) => {
      console.error(err);
      setState({ pwSaving: false, pwError: translateAuthError(err.code) });
    });
}

/* ---------------- Real account deletion (TikTok-style) ----------------
   Deleting your account used to only remove your users/{uid} doc and sign-in —
   your posts, comments, and messages stayed in the database forever, orphaned.
   This now actually erases everything tied to your account before the account
   itself goes: your own posts (+ their comments + any video files in Storage —
   photos/chat media are stored as data URLs inside the documents themselves, so
   deleting the doc deletes the media too), your comments on other people's posts,
   your DM threads and their messages, your own notifications, notifications you
   generated for other people, and every reference to your uid in anyone else's
   followers/following/blocked/follow-request/pinned lists. */
function deleteBatchOfDocs(docRefs) {
  // Firestore batches cap at 500 writes — chunk defensively so large accounts still work.
  const chunks = [];
  for (let i = 0; i < docRefs.length; i += 450) chunks.push(docRefs.slice(i, i + 450));
  return chunks.reduce((p, chunk) => p.then(() => {
    const batch = db.batch();
    chunk.forEach((ref) => batch.delete(ref));
    return batch.commit();
  }), Promise.resolve());
}
function deleteStorageFileByUrl(url) {
  try { return storage.refFromURL(url).delete().catch(() => {}); }
  catch (e) { return Promise.resolve(); }
}
function deleteOwnPosts(uid) {
  return db.collection("posts").where("authorUid", "==", uid).get().then((snap) => {
    return Promise.all(snap.docs.map((doc) => {
      const data = doc.data();
      return doc.ref.collection("comments").get()
        .then((c) => deleteBatchOfDocs(c.docs.map((d) => d.ref)))
        .then(() => (data.mediaType === "video" && data.media) ? deleteStorageFileByUrl(data.media) : null)
        .then(() => doc.ref.delete());
    }));
  });
}
function deleteOwnCommentsOnOthersPosts(uid) {
  // Needs a Firestore collection-group index on comments.uid — Firebase auto-suggests
  // creating it (with a direct link) the first time this query runs if it's missing.
  return db.collectionGroup("comments").where("uid", "==", uid).get()
    .then((snap) => deleteBatchOfDocs(snap.docs.map((d) => d.ref)))
    .catch((err) => console.error("comment cleanup skipped (Firestore index may be needed):", err));
}
function deleteOwnThreads(uid) {
  return db.collection("threads").where("participants", "array-contains", uid).get().then((snap) => {
    return Promise.all(snap.docs.map((doc) => {
      return doc.ref.collection("messages").get()
        .then((m) => deleteBatchOfDocs(m.docs.map((d) => d.ref)))
        .then(() => doc.ref.delete());
    }));
  });
}
function deleteOwnNotifications(uid) {
  return db.collection("users").doc(uid).collection("notifications").get()
    .then((snap) => deleteBatchOfDocs(snap.docs.map((d) => d.ref)))
    .catch((err) => console.error(err));
}
function deleteNotificationsGeneratedByUser(uid) {
  // Needs a Firestore collection-group index on notifications.fromUid — same as above.
  return db.collectionGroup("notifications").where("fromUid", "==", uid).get()
    .then((snap) => deleteBatchOfDocs(snap.docs.map((d) => d.ref)))
    .catch((err) => console.error("notification cleanup skipped (Firestore index may be needed):", err));
}
function scrubUidFromOtherUsers(uid) {
  const fields = ["followers", "following", "blockedUsers", "blockedBy", "followRequests", "pinnedFriends"];
  return Promise.all(fields.map((field) => {
    return db.collection("users").where(field, "array-contains", uid).get().then((snap) => {
      const chunks = [];
      for (let i = 0; i < snap.docs.length; i += 450) chunks.push(snap.docs.slice(i, i + 450));
      return chunks.reduce((p, chunk) => p.then(() => {
        const batch = db.batch();
        chunk.forEach((doc) => batch.update(doc.ref, { [field]: firebase.firestore.FieldValue.arrayRemove(uid) }));
        return batch.commit();
      }), Promise.resolve());
    }).catch((err) => console.error(err));
  }));
}
// Removes every trace of this uid left behind on OTHER people's posts — likes, saves,
// reposts, and view history — so deleting an account doesn't leave dangling references
// (inflated-looking counts, a "ghost" entry in someone's Liked videos) anywhere in the app.
function scrubUidFromPostsField(uid, field) {
  return db.collection("posts").where(field, "array-contains", uid).get().then((snap) => {
    const chunks = [];
    for (let i = 0; i < snap.docs.length; i += 450) chunks.push(snap.docs.slice(i, i + 450));
    return chunks.reduce((p, chunk) => p.then(() => {
      const batch = db.batch();
      chunk.forEach((doc) => batch.update(doc.ref, { [field]: firebase.firestore.FieldValue.arrayRemove(uid) }));
      return batch.commit();
    }), Promise.resolve());
  }).catch((err) => console.error(err));
}
// Same idea for likes left on OTHER people's comments (a subcollection, so this needs the
// same collection-group index Firestore auto-suggests for the comment-cleanup query above).
function scrubUidFromCommentLikes(uid) {
  return db.collectionGroup("comments").where("likes", "array-contains", uid).get().then((snap) => {
    const chunks = [];
    for (let i = 0; i < snap.docs.length; i += 450) chunks.push(snap.docs.slice(i, i + 450));
    return chunks.reduce((p, chunk) => p.then(() => {
      const batch = db.batch();
      chunk.forEach((doc) => batch.update(doc.ref, { likes: firebase.firestore.FieldValue.arrayRemove(uid) }));
      return batch.commit();
    }), Promise.resolve());
  }).catch((err) => console.error("comment-likes cleanup skipped (Firestore index may be needed):", err));
}
function wipeAllUserData(uid) {
  return Promise.all([
    deleteOwnPosts(uid),
    deleteOwnCommentsOnOthersPosts(uid),
    deleteOwnThreads(uid),
    deleteOwnNotifications(uid),
    deleteNotificationsGeneratedByUser(uid),
    scrubUidFromOtherUsers(uid),
    scrubUidFromPostsField(uid, "likes"),
    scrubUidFromPostsField(uid, "savedBy"),
    scrubUidFromPostsField(uid, "reposts"),
    scrubUidFromPostsField(uid, "viewedBy"),

  ]);
}

function handleDeleteAccount() {
  if (!state.delPassword) { setState({ delError: t("enterPasswordToConfirm") }); return; }
  if (!confirm(t("deleteAccountConfirmDialog"))) return;

  setState({ delError: "", delSaving: true });
  const user = auth.currentUser;
  const uid = user.uid;
  const credential = firebase.auth.EmailAuthProvider.credential(user.email, state.delPassword);
  user.reauthenticateWithCredential(credential)
    .then(() => wipeAllUserData(uid))
    .then(() => db.collection("users").doc(uid).delete())
    .then(() => user.delete())
    .then(() => {
      showToast(t("accountDeletedToast"));
      // auth.onAuthStateChanged() handles resetting local state once the sign-out fires.
    })
    .catch((err) => {
      console.error(err);
      setState({ delSaving: false, delError: translateAuthError(err.code) });
    });
}

/* ================= SETTINGS > Cache & Cellular > Free up space ================= */
/* Real, non-destructive cache clear: wipes only the Service Worker cache
   storage (sw.js's CACHE_NAME bucket + any others), leaving you logged in —
   unlike the account-wide "Clear data" button below, which also signs you out.
   Shows a real usage estimate from the browser's Storage API where available. */
function renderSettingsFreeUpSpaceScreen() {
  root.innerHTML = `
    ${settingsTopbar(t("freeUpSpaceTitle"))}
    <div style="padding:20px 18px 6px;">
      <div style="background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;text-align:center;">
        <div style="font-size:13px;color:var(--ink-soft);margin-bottom:6px;">${t("cacheUsedOnDeviceLabel")}</div>
        <div style="font-size:22px;font-weight:800;" id="cacheUsageLabel">${t("calculatingEllipsis")}</div>
      </div>
    </div>
    <div style="padding:0 14px;">
      <button class="btn-primary" id="freeUpSpaceBtn">${t("clearCacheBtn")}</button>
    </div>
    <div class="settings-hint">${t("freeUpSpaceHint")}</div>
  `;
  wireSettingsBack("settings");
  if (navigator.storage && navigator.storage.estimate) {
    navigator.storage.estimate().then((est) => {
      const mb = ((est.usage || 0) / (1024 * 1024)).toFixed(1);
      const label = document.getElementById("cacheUsageLabel");
      if (label) label.textContent = `${mb} MB`;
    }).catch(() => {
      const label = document.getElementById("cacheUsageLabel");
      if (label) label.textContent = t("unknownLabel2");
    });
  } else {
    const label = document.getElementById("cacheUsageLabel");
    if (label) label.textContent = t("unknownLabel2");
  }
  document.getElementById("freeUpSpaceBtn").onclick = () => {
    if (!confirm(t("clearCacheConfirmDialog"))) return;
    const clearCaches = window.caches ? caches.keys().then(keys => Promise.all(keys.map(k => caches.delete(k)))) : Promise.resolve();
    clearCaches.then(() => {
      showToast(t("cacheClearedToast"));
      const label = document.getElementById("cacheUsageLabel");
      if (label) label.textContent = "0.0 MB";
    }).catch((err) => {
      console.error(err);
      showToast(t("couldntClearCache"));
    });
  };
}

/* Merge-writes a single field into users/{uid}.settings so other fields
   (theme, fontSize, reduceMotion, autoplayVideos) aren't clobbered. Every
   Content/Theme/Accessibility toggle above goes through this one function. */
function updateMySettings(patch) {
  db.collection("users").doc(state.user.uid).set({ settings: patch }, { merge: true })
    .catch((err) => {
      console.error(err);
      showToast(t("couldntSaveSetting"));
    });
}

function saveEditedProfile() {
  const name = state.editName.trim();
  if (!name) { showToast(t("nameCantBeEmpty")); return; }
  const handle = slugifyHandle(state.editHandle.trim() || name);
  const bio = state.editBio.trim().slice(0, 150);
  const youtubeLink = state.editYoutube.trim();
  const facebookLink = state.editFacebook.trim();

  const btn = document.getElementById("saveProfileBtn");
  if (btn) { btn.disabled = true; btn.textContent = t("savingLabel"); }

  db.collection("users").doc(state.user.uid).update({ name, handle, bio, youtubeLink, facebookLink })
    .then(() => {
      state.profile = { ...state.profile, name, handle, bio, youtubeLink, facebookLink };
      setState({ view: "profile" });
      showToast(t("profileUpdated"));
    })
    .catch((err) => {
      console.error(err);
      showToast(t("couldntUpdateProfile"));
      if (btn) { btn.disabled = false; btn.textContent = t("save"); }
    });
}

function toggleRepost(post) {
  const uid = state.user.uid;
  const reposted = (post.reposts || []).includes(uid);
  db.collection("posts").doc(post.id).update({
    reposts: reposted
      ? firebase.firestore.FieldValue.arrayRemove(uid)
      : firebase.firestore.FieldValue.arrayUnion(uid)
  }).then(() => {
    showToast(reposted ? t("repostRemoved") : t("repostedLabel"));
  }).catch((err) => console.error(err));
}

function toggleSave(post) {
  const uid = state.user.uid;
  const saved = (post.savedBy || []).includes(uid);
  db.collection("posts").doc(post.id).update({
    savedBy: saved
      ? firebase.firestore.FieldValue.arrayRemove(uid)
      : firebase.firestore.FieldValue.arrayUnion(uid)
  }).then(() => {
    showToast(saved ? "Removed from saved" : "Saved");
  }).catch((err) => console.error(err));
}

function handleAvatarSelect(e) {
  const file = e.target.files[0];
  if (!file) return;
  if (!isAllowedImageFile(file)) { showToast(t("fileTypeNotSupported")); e.target.value = ""; return; }
  compressImageToDataUrl(file, { maxDim: 300, quality: 0.75, square: true }, (compressed) => {
    db.collection("users").doc(state.user.uid).update({ avatar: compressed })
      .then(() => {
        state.profile = { ...state.profile, avatar: compressed };
        render();
      })
      .catch((err) => { console.error(err); showToast(t("couldntUpdatePhoto")); });
  });
}

/* Send a post directly into a chat thread with a friend, as a shared-post message */
function doSendPostToFriend(uid) {
  if (!uid || !activePostId) return;
  const post = state.posts.find(p => p.id === activePostId);
  if (!post) return;
  const myUid = state.user.uid;
  const threadId = threadIdFor(myUid, uid);
  const threadRef = db.collection("threads").doc(threadId);
  threadRef.set({
    participants: [myUid, uid],
    lastMessage: "Shared a post",
    lastMessageAt: firebase.firestore.FieldValue.serverTimestamp(),
    [`unread.${uid}`]: firebase.firestore.FieldValue.increment(1)
  }, { merge: true }).then(() => {
    return threadRef.collection("messages").add({
      senderUid: myUid,
      text: `Shared a post: "${(post.text || "").slice(0, 60)}"`,
      image: post.media && post.mediaType !== "video" ? post.media : null,
      sharedPostId: post.id,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
  }).then(() => {
    showToast(t("sentToast"));
    closeSheets();
  }).catch((err) => { console.error(err); showToast(t("couldntSend")); });
}

function doRepostFromSheet() {
  const post = state.posts.find(p => p.id === activePostId);
  if (post) {
    const author = findCachedUser(post.authorUid);
    if (author && author.allowReuse === false && post.authorUid !== state.user.uid) {
      showToast(t("creatorDisallowsRepost"));
      closeSheets();
      return;
    }
    toggleRepost(post);
  }
  closeSheets();
}

/* Report a post; once a post collects 5+ distinct reports it is auto-hidden from public feeds
   (still visible to its own author, who sees it flagged) — a simple, real, working moderation layer. */
function doReportFromSheet() {
  if (!activePostId) return;
  const myUid = state.user.uid;
  const ref = db.collection("posts").doc(activePostId);
  db.runTransaction((tx) => {
    return tx.get(ref).then((doc) => {
      if (!doc.exists) return;
      const data = doc.data();
      const reports = data.reports || [];
      if (reports.includes(myUid)) return;
      const newReports = [...reports, myUid];
      tx.update(ref, { reports: newReports, hidden: newReports.length >= 5 ? true : (data.hidden || false) });
    });
  }).then(() => {
    showToast(t("thanksPostReported"));
    closeSheets();
  }).catch((err) => { console.error(err); showToast(t("couldntSubmitReport")); });
}

/* Real, detailed analytics for one of the user's own posts — shown as a proper bottom sheet
   (not just a toast), and reused by both the share-sheet's Analytics button and the
   full-screen view's "More insights" shortcut. */
function doShowAnalytics() {
  const postId = activePostId;
  closeSheets();
  if (postId) openAnalyticsSheet(postId);
}

function openAnalyticsSheet(postId) {
  const post = state.posts.find(p => p.id === postId);
  if (!post) return;
  document.getElementById("qrOverlay")?.remove();
  document.getElementById("qrSheetEl")?.remove();
  document.getElementById("analyticsOverlay")?.remove();
  document.getElementById("analyticsSheetEl")?.remove();

  const likes = (post.likes || []).length;
  const comments = post.commentCount || 0;
  const reposts = (post.reposts || []).length;
  const saves = (post.savedBy || []).length;
  const views = post.views || 0;
  const viewersOn = !(state.myUserDoc && state.myUserDoc.viewersEnabled === false);
  const viewerCount = (post.viewedBy || []).length;

  const overlay = document.createElement("div");
  overlay.className = "sheet-overlay open";
  overlay.id = "analyticsOverlay";

  const sheetEl = document.createElement("div");
  sheetEl.className = "bottom-sheet open";
  sheetEl.id = "analyticsSheetEl";
  sheetEl.innerHTML = `
    <div class="sheet-handle"></div>
    <div class="sheet-title">Post insights</div>
    <div class="analytics-row"><span>▶ Views</span><b>${views.toLocaleString()}</b></div>
    <div class="analytics-row"><span>❤️ Likes</span><b>${likes.toLocaleString()}</b></div>
    <div class="analytics-row"><span>💬 Comments</span><b>${comments.toLocaleString()}</b></div>
    <div class="analytics-row"><span>↻ Reposts</span><b>${reposts.toLocaleString()}</b></div>
    <div class="analytics-row"><span>🔖 Saves</span><b>${saves.toLocaleString()}</b></div>
    ${viewersOn
      ? `<button class="analytics-row" id="analyticsViewersBtn" style="width:100%;background:none;border:none;cursor:pointer;text-align:left;"><span>👣 Viewers</span><b>${viewerCount.toLocaleString()} ›</b></button>`
      : `<div class="settings-hint" style="margin:8px 14px 0;">Turn on Viewers in Settings &gt; Privacy to see who watched your videos.</div>`}
  `;

  const closeAnalytics = () => { overlay.remove(); sheetEl.remove(); };
  overlay.onclick = closeAnalytics;
  const viewersBtn = sheetEl.querySelector("#analyticsViewersBtn");
  if (viewersBtn) viewersBtn.onclick = () => { closeAnalytics(); openViewersListSheet(post); };

  document.body.appendChild(overlay);
  document.body.appendChild(sheetEl);
}

/* Lists the accounts that watched this video — only ever populated with people who had
   Viewers turned on themselves when they watched, and re-filtered live here in case any
   of them have since turned it back off. */
function openViewersListSheet(post) {
  document.getElementById("viewersOverlay")?.remove();
  document.getElementById("viewersSheetEl")?.remove();

  const viewers = (post.viewedBy || [])
    .map(uid => findCachedUser(uid))
    .filter(u => u && u.viewersEnabled !== false);

  const overlay = document.createElement("div");
  overlay.className = "sheet-overlay open";
  overlay.id = "viewersOverlay";

  const sheetEl = document.createElement("div");
  sheetEl.className = "bottom-sheet open";
  sheetEl.id = "viewersSheetEl";
  sheetEl.innerHTML = `
    <div class="sheet-handle"></div>
    <div class="sheet-title">Viewers</div>
    <div class="user-list" style="max-height:50vh; overflow-y:auto;">
      ${viewers.length ? viewers.map(u => `
        <div class="user-row" id="viewerrow-${u.uid}">
          <div class="avatar">${u.avatar ? `<img src="${u.avatar}" />` : initials(u.name || "User")}</div>
          <div class="user-row-info"><div class="u-name">${escapeHtml(u.name || "User")}</div><div class="u-handle">@${escapeHtml(u.handle || slugifyHandle(u.name || "user"))}</div></div>
        </div>
      `).join("") : `<div class="empty-nav-tab"><div class="big">👣</div><div class="line1">No viewers yet</div><div class="line2">Only accounts with Viewers turned on will show up here.</div></div>`}
    </div>
  `;
  const close = () => { overlay.remove(); sheetEl.remove(); };
  overlay.onclick = close;
  viewers.forEach(u => {
    const row = sheetEl.querySelector(`#viewerrow-${u.uid}`);
    if (row) row.onclick = () => { close(); openProfile(u.uid); };
  });

  document.body.appendChild(overlay);
  document.body.appendChild(sheetEl);
}

/* ---------------- Offline videos ----------------
   Genuinely offline: the actual media bytes are fetched once and stored on-device in
   IndexedDB (not just a link back to Firebase Storage), plus a small locally-generated
   thumbnail (data URL) stored in localStorage so the grid renders with zero network too.
   Playback opens the on-device copy via a blob: URL, so it works with airplane mode on. */
const OFFLINE_VIDEOS_KEY = "milon_offline_videos";
const OFFLINE_DB_NAME = "milon_offline_db";
const OFFLINE_DB_STORE = "media";
let offlineObjectUrl = null; // tracks the currently-open blob: URL so we can revoke it

function openOfflineDb() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(OFFLINE_DB_NAME, 1);
    req.onupgradeneeded = () => { req.result.createObjectStore(OFFLINE_DB_STORE); };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
function idbPutBlob(id, blob) {
  return openOfflineDb().then(db => new Promise((resolve, reject) => {
    const tx = db.transaction(OFFLINE_DB_STORE, "readwrite");
    tx.objectStore(OFFLINE_DB_STORE).put(blob, id);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  }));
}
function idbGetBlob(id) {
  return openOfflineDb().then(db => new Promise((resolve, reject) => {
    const tx = db.transaction(OFFLINE_DB_STORE, "readonly");
    const req = tx.objectStore(OFFLINE_DB_STORE).get(id);
    req.onsuccess = () => resolve(req.result || null);
    req.onerror = () => reject(req.error);
  }));
}
function idbDeleteBlob(id) {
  return openOfflineDb().then(db => new Promise((resolve, reject) => {
    const tx = db.transaction(OFFLINE_DB_STORE, "readwrite");
    tx.objectStore(OFFLINE_DB_STORE).delete(id);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  }));
}
function getOfflineVideos() {
  try { return JSON.parse(localStorage.getItem(OFFLINE_VIDEOS_KEY) || "[]"); } catch (e) { return []; }
}
// Draws a small local thumbnail (data URL, ~240px wide) from a media blob so the
// grid never needs the network — for video it grabs a real video frame.
function makeLocalThumb(blob, mediaType) {
  return new Promise((resolve) => {
    const tmpUrl = URL.createObjectURL(blob);
    const finish = (dataUrl) => { URL.revokeObjectURL(tmpUrl); resolve(dataUrl || null); };
    if (mediaType === "video") {
      const vid = document.createElement("video");
      vid.muted = true; vid.playsInline = true; vid.src = tmpUrl;
      vid.onloadeddata = () => {
        try { vid.currentTime = Math.min(0.2, (vid.duration || 1) / 4); } catch (e) { grab(); }
      };
      const grab = () => {
        try {
          const w = 240, h = Math.round((vid.videoHeight / (vid.videoWidth || 1)) * 240) || 240;
          const canvas = document.createElement("canvas");
          canvas.width = w; canvas.height = h;
          canvas.getContext("2d").drawImage(vid, 0, 0, w, h);
          finish(canvas.toDataURL("image/jpeg", 0.7));
        } catch (e) { finish(null); }
      };
      vid.onseeked = grab;
      vid.onerror = () => finish(null);
      setTimeout(() => { if (!vid.currentTime) finish(null); }, 4000); // safety timeout
    } else {
      const img = new Image();
      img.onload = () => {
        const w = 240, h = Math.round((img.height / (img.width || 1)) * 240) || 240;
        const canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        canvas.getContext("2d").drawImage(img, 0, 0, w, h);
        finish(canvas.toDataURL("image/jpeg", 0.8));
      };
      img.onerror = () => finish(null);
      img.src = tmpUrl;
    }
  });
}
function saveVideoOffline(post) {
  if (!post || !post.media) { showToast(t("nothingToSave")); return; }
  const existing = getOfflineVideos().find(v => v.id === post.id);
  if (existing) { showToast(t("alreadySavedOffline")); closeSheets(); return; }
  showToast(t("savingForOffline"));
  fetch(post.media)
    .then((r) => { if (!r.ok) throw new Error("fetch failed"); return r.blob(); })
    .then((blob) => {
      const mediaType = post.mediaType || "image";
      return idbPutBlob(post.id, blob).then(() => makeLocalThumb(blob, mediaType)).then((thumb) => {
        const author = (state.allUsers || []).find(u => u.uid === post.authorUid);
        const list = getOfflineVideos().filter(v => v.id !== post.id);
        list.unshift({
          id: post.id,
          cover: thumb || post.cover || null,
          mediaType,
          caption: post.caption || "",
          authorName: (author && author.name) || "",
          savedAt: Date.now()
        });
        try {
          localStorage.setItem(OFFLINE_VIDEOS_KEY, JSON.stringify(list.slice(0, 100)));
        } catch (e) {
          // localStorage full of thumbnails — drop the oldest until it fits
          let trimmed = list;
          while (trimmed.length > 1) {
            trimmed = trimmed.slice(0, -1);
            try { localStorage.setItem(OFFLINE_VIDEOS_KEY, JSON.stringify(trimmed)); break; } catch (e2) { /* keep trimming */ }
          }
        }
        showToast(t("savedForOfflineViewing"));
        closeSheets();
      });
    })
    .catch((err) => {

function removeOfflineVideo(id, backView) {

function openOfflineVideoPlayer(v) {
  document.getElementById("offlinePlayerOverlay")?.remove();
  if (offlineObjectUrl) { URL.revokeObjectURL(offlineObjectUrl); offlineObjectUrl = null; }
  const overlay = document.createElement("div");
  overlay.id = "offlinePlayerOverlay";
  overlay.style.cssText = "position:fixed;inset:0;background:#000;z-index:600;display:flex;align-items:center;justify-content:center;";
  overlay.innerHTML = `
    <button id="offlinePlayerClose" style="position:absolute;top:16px;left:16px;background:rgba(0,0,0,0.5);color:#fff;border:none;border-radius:50%;width:36px;height:36px;font-size:18px;z-index:2;">✕</button>
    <div id="offlinePlayerBody" style="color:#fff;font-size:14px;">Loading your saved copy…</div>
  `;
  document.body.appendChild(overlay);
  document.getElementById("offlinePlayerClose").onclick = () => {
    if (offlineObjectUrl) { URL.revokeObjectURL(offlineObjectUrl); offlineObjectUrl = null; }
    overlay.remove();
  };
  idbGetBlob(v.id).then((blob) => {
    const body = document.getElementById("offlinePlayerBody");
    if (!body) return; // overlay closed while loading
    if (!blob) { body.textContent = "This saved copy is missing on this device — try saving it again."; return; }
    offlineObjectUrl = URL.createObjectURL(blob);
    body.outerHTML = v.mediaType === "video"
      ? `<video id="offlinePlayerBody" src="${offlineObjectUrl}" ${v.cover ? `poster="${v.cover}"` : ""} controls autoplay playsinline style="max-width:100%;max-height:100%;"></video>`
      : `<img id="offlinePlayerBody" src="${offlineObjectUrl}" style="max-width:100%;max-height:100%;object-fit:contain;" />`;
  }).catch((err) => {
    console.error(err);
    const body = document.getElementById("offlinePlayerBody");
    if (body) body.textContent = "Couldn't open this saved copy.";
  });
}

/* Real QR code, generated client-side from the post's actual link (no fake placeholder image). */
function ensureQrLib() {
  if (window.QRCode) return Promise.resolve();
  if (ensureQrLib._pending) return ensureQrLib._pending;
  ensureQrLib._pending = new Promise((resolve, reject) => {
    const s = document.createElement("script");
    s.src = "https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js";
    s.onload = resolve;
    s.onerror = () => { ensureQrLib._pending = null; showToast(t("couldntLoadQrGenerator")); reject(); };
    document.head.appendChild(s);
  });
  return ensureQrLib._pending;
}

/* Opens whatever ?post= or ?profile= is in the URL, once, right after the first real
   posts snapshot has loaded — so a shared/QR link actually jumps to that content instead
   of just opening the app fresh. */
let deepLinkHandled = false;
function handleDeepLink() {
  if (deepLinkHandled) return;
  deepLinkHandled = true;
  const params = new URLSearchParams(window.location.search);
  const profileUid = params.get("profile");
  const postId = params.get("post");
  if (profileUid) {
    if (state.user && profileUid !== state.user.uid) {
      const target = findCachedUser(profileUid);
      const amFollowing = target && (target.followers || []).includes(state.user.uid);
      if (target && target.showProfileOnShare === false && !amFollowing) {
        showToast(t("profileNotAvailableViaLinks"));
        return;
      }
    }
    openProfile(profileUid);
    return;
  }
  if (postId) {
    const existing = state.posts.find(p => p.id === postId);
    if (existing) { openPostViewer(postId); return; }
    db.collection("posts").doc(postId).get().then((doc) => {
      if (doc.exists) {
        state.posts = [...state.posts, { id: doc.id, ...doc.data() }];
        openPostViewer(postId);
      } else {
        showToast(t("postNoLongerAvailable"));
      }
    }).catch((err) => console.error("deep link post fetch error:", err));
  }
}

function doDeletePost() {
  if (!activePostId) return;
  if (!confirm(t("deletePostConfirm"))) return;
  db.collection("posts").doc(activePostId).delete()
    .then(() => showToast(t("postDeletedToast")))
    .catch((err) => { console.error(err); showToast(t("couldntDeleteThePost")); });
  closeSheets();
}

function setPrivacyForActivePost(level) {
  if (!activePostId) return;
  db.collection("posts").doc(activePostId).update({ privacy: level })
    .then(() => showToast(t("privacyUpdatedToast")))
    .catch((err) => { console.error(err); showToast(t("couldntUpdatePrivacyToast")); });
  closeSheets();
}

/* Take a photo, compress it, and convert it to base64 (Home composer's own image picker) */
function handleImageSelect(e) {
  const file = e.target.files[0];
  if (!file) return;
  if (!isAllowedImageFile(file)) { showToast(t("fileTypeNotSupported")); e.target.value = ""; return; }
  compressImageToDataUrl(file, { maxDim: 900, quality: 0.7 }, (compressed) => {
    setState({ composerMedia: compressed, composerMediaType: "image" });
  });
}

function extractHashtags(text) {
  return Array.from(new Set(Array.from((text || "").matchAll(/#(\w+)/g)).map(m => m[1].toLowerCase())));
}

/* Resolves the compose screen's "Allow downloads" toggle: whatever the user has explicitly
   set this session, falling back to their account-level Downloads default (Settings >
   Privacy > Downloads) the first time they open the composer. */
function composeAllowDownloadEffective() {
  if (state.composeAllowDownload !== null && state.composeAllowDownload !== undefined) return state.composeAllowDownload !== false;
  return !(state.myUserDoc && state.myUserDoc.allowDownloadsDefault === false);
}

function submitPost() {
  if (!state.composerText.trim() && !state.composerMedia) return;

  const postBtn = document.getElementById("composePostBtn");
  if (postBtn) { postBtn.disabled = true; postBtn.textContent = "Posting..."; }
  setState({ composeUploadPct: 5 });

  const finishPost = (mediaUrl, coverDataUrl) => {
    db.collection("posts").add({
      authorUid: state.user.uid,
      authorName: state.user.name,
      text: state.composerText.trim(),
      media: mediaUrl,
      mediaType: state.composerMediaType || (mediaUrl ? "image" : null),
      cover: coverDataUrl || null,
      hashtags: extractHashtags(state.composerText),
      soundName: (state.composerSoundName || "").trim() || null,
      privacy: state.composePrivacy || "public",
      allowComments: state.composeAllowComments !== false,
      allowDownload: composeAllowDownloadEffective(),
      likes: [],
      commentCount: 0,
      reports: [],
      views: 0,
      hidden: false,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    }).then(() => {
      try { localStorage.removeItem("milon_draft"); } catch (e) {}
      setState({
        composerText: "", composerMedia: null, composerMediaType: null, composerSoundName: "",
        composePrivacy: "public", composeAllowComments: true, composeAllowDownload: null,
        composeUploadPct: null, view: "feed"
      });
      showToast(t("postedToast"));
    }).catch((err) => {
      console.error(err);
      showToast(t("couldntCreateThePost"));
      setState({ composeUploadPct: null });
    });
  };

  const failPost = (err) => {
    console.error(err);
    showToast(t("couldntUploadCheckConnection"));
    setState({ composeUploadPct: null });
    if (postBtn) { postBtn.disabled = false; postBtn.textContent = "Post"; }
  };

  if (state.composerMediaType === "video" && state.composerMedia) {
    // 1) Grab a real first-frame thumbnail to use as the poster (so the feed shows an
    //    instant frame instead of a blank box while the video itself loads/decodes).
    // 2) Upload the actual video bytes to Firebase Storage (NOT Firestore — a Firestore
    //    document caps out at 1MB, which is why real videos were failing to post before).
    const vid = document.createElement("video");
    vid.muted = true;
    vid.src = state.composerMedia;
    vid.onloadeddata = () => {
      let coverDataUrl = null;
      try {
        const canvas = document.createElement("canvas");
        canvas.width = vid.videoWidth || 480;
        canvas.height = vid.videoHeight || 854;
        canvas.getContext("2d").drawImage(vid, 0, 0, canvas.width, canvas.height);
        coverDataUrl = canvas.toDataURL("image/jpeg", 0.7);
      } catch (e) { /* thumbnail is best-effort; upload continues either way */ }

      let blob;
      try {
        blob = dataUrlToBlob(state.composerMedia);
      } catch (e) {
        failPost(e);
        return;
      }
      uploadVideoBlob(blob, state.user.uid, (pct) => {
        // Reserve 0-90% of the bar for the actual upload, last 10% for the Firestore write.
        setState({ composeUploadPct: Math.max(5, Math.round(pct * 0.9)) });
      }).then((downloadUrl) => {
        setState({ composeUploadPct: 95 });
        finishPost(downloadUrl, coverDataUrl);
      }).catch(failPost);
    };
    vid.onerror = () => failPost(new Error("Could not read the video file"));
  } else {
    setState({ composeUploadPct: 60 });
    finishPost(state.composerMedia, null);
  }
}

function toggleLike(post) {
  const uid = state.user.uid;
  const liked = (post.likes || []).includes(uid);
  const ref = db.collection("posts").doc(post.id);
  ref.update({
    likes: liked
      ? firebase.firestore.FieldValue.arrayRemove(uid)
      : firebase.firestore.FieldValue.arrayUnion(uid)
  }).then(() => {
    if (!liked) logActivity(post.authorUid, "like", `${state.user.name} liked your post`, { postId: post.id, thumb: getPostThumb(post) });
  }).catch((err) => console.error(err));
}

/* Real comment/reply creation in the posts/{postId}/comments subcollection.
   Keeps post.commentCount accurate via a real increment (not a client guess),
   and detects @mentions against known users for the visual highlight + activity log. */
function submitCommentOrReply(postId, text, parentId) {
  if (!text || !text.trim() || !state.user) return;
  const trimmed = text.trim();
  const mentionNames = Array.from(trimmed.matchAll(/(?:^|\s)@(\w+)/g)).map(m => m[1].toLowerCase());
  const mentionUids = (state.allUsers || [])
    .filter(u => mentionNames.includes((u.name || "").toLowerCase().replace(/\s+/g, "")) || mentionNames.includes((u.handle || "").toLowerCase()))
    .map(u => u.uid);

  const commentDoc = {
    uid: state.user.uid,
    name: state.user.name,
    avatar: state.user.avatar || null,
    text: trimmed,
    parentId: parentId || null,
    likes: [],
    mentionUids,
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  };

  db.collection("posts").doc(postId).collection("comments").add(commentDoc)
    .then(() => {
      return db.collection("posts").doc(postId).update({
        commentCount: firebase.firestore.FieldValue.increment(1)
      });
    })
    .then(() => {
      const post = state.posts.find(p => p.id === postId);
      if (post && post.authorUid !== state.user.uid) {
        logActivity(post.authorUid, "comment", `${state.user.name} ${parentId ? "replied" : "commented"}: "${trimmed.slice(0, 60)}"`, { postId, thumb: getPostThumb(post) });
      }
      mentionUids.forEach(uid => {
        if (uid !== state.user.uid && canMention(uid, state.user.uid)) logActivity(uid, "mention", `${state.user.name} mentioned you in a comment`, { postId, thumb: getPostThumb(post) });
      });
      setState({ replyingTo: null });
    })
    .catch((err) => {
      console.error(err);
      showToast(t("couldntSendComment"));
    });
}

function toggleCommentLike(postId, commentId) {
  if (!state.user) return;
  const myUid = state.user.uid;
  const comment = state.fsComments.find(c => c.id === commentId);
  if (!comment) return;
  const liked = (comment.likes || []).includes(myUid);
  db.collection("posts").doc(postId).collection("comments").doc(commentId).update({
    likes: liked
      ? firebase.firestore.FieldValue.arrayRemove(myUid)
      : firebase.firestore.FieldValue.arrayUnion(myUid)
  }).catch((err) => console.error(err));
}

/* Deletes one of MY OWN comments (and, since it's a thread, any replies under it too),
   and keeps post.commentCount accurate by the exact number of docs actually removed. */
function deleteOwnComment(postId, commentId) {
  if (!state.user) return;
  const comment = state.fsComments.find(c => c.id === commentId);
  if (!comment || comment.uid !== state.user.uid) return;
  if (!confirm(t("deleteCommentConfirm"))) return;

  const colRef = db.collection("posts").doc(postId).collection("comments");
  const replies = state.fsComments.filter(c => c.parentId === commentId);
  const batch = db.batch();
  batch.delete(colRef.doc(commentId));
  replies.forEach(r => batch.delete(colRef.doc(r.id)));

  batch.commit().then(() => {
    return db.collection("posts").doc(postId).update({
      commentCount: firebase.firestore.FieldValue.increment(-(1 + replies.length))
    });
  }).catch((err) => {
    console.error(err);
    showToast(t("couldntDeleteComment"));
  });
}

/* Real report: written to a top-level reports collection an admin can review, same pattern
   as post reports, plus a visible confirmation so the person knows it went through. */
function reportComment(postId, commentId) {
  if (!state.user) return;
  const comment = state.fsComments.find(c => c.id === commentId);
  if (!comment) return;
  db.collection("commentReports").add({
    postId,
    commentId,
    commentText: comment.text,
    commentAuthorUid: comment.uid,
    reportedByUid: state.user.uid,
    reportedByName: state.user.name,
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  }).then(() => {
    showToast(t("commentReportedToast"));
  }).catch((err) => {
    console.error(err);
    showToast(t("couldntSubmitReport"));
  });
}

function timeAgo(ts) {
  if (!ts || !ts.toDate) return "just now";
  const diffMs = Date.now() - ts.toDate().getTime();
  const mins = Math.floor(diffMs / 60000);
  if (mins < 1) return "just now";
  if (mins < 60) return `${mins}m ago`;
  const hrs = Math.floor(mins / 60);
  if (hrs < 24) return `${hrs}h ago`;
  return `${Math.floor(hrs / 24)}d ago`;
}

/* Short, TikTok-style relative time with no "ago" — "1d", "2h", "5m", "now" */
function timeAgoShort(ts) {
  if (!ts || !ts.toDate) return "now";
  const diffMs = Date.now() - ts.toDate().getTime();
  const mins = Math.floor(diffMs / 60000);
  if (mins < 1) return "now";
  if (mins < 60) return `${mins}m`;
  const hrs = Math.floor(mins / 60);
  if (hrs < 24) return `${hrs}h`;
  return `${Math.floor(hrs / 24)}d`;
}

/* Real mutual-friends calculation for the "Friends with ..." line: a "friend" is anyone who
   both follows and is followed by a given account. Returns the user objects mutual to both
   me and otherUid, using the same live followers/following arrays used everywhere else. */
function mutualFriendsWith(otherUid) {
  const myUid = state.user.uid;
  const other = state.allUsers.find(u => u.uid === otherUid);
  if (!other) return [];
  const otherFollowers = new Set(other.followers || []);
  const otherFriendUids = new Set((other.following || []).filter(uid => otherFollowers.has(uid)));
  const myFriends = state.allUsers.filter(u => (u.followers || []).includes(myUid) && (u.following || []).includes(myUid));
  return myFriends.filter(u => otherFriendUids.has(u.uid));
}

/* "Send a 👋" — a real reaction message into (or starting) a real-time chat thread with that user,
   then takes you straight into the chat, same as TikTok's wave button. */
function sendWaveTo(uid) {
  const myUid = state.user.uid;
  const threadId = threadIdFor(myUid, uid);
  const threadRef = db.collection("threads").doc(threadId);
  const target = state.allUsers.find(u => u.uid === uid);
  threadRef.set({
    participants: [myUid, uid],
    participantInfo: {
      [myUid]: { name: state.user.name, avatar: (state.profile && state.profile.avatar) || null },
      [uid]: { name: (target && target.name) || "User", avatar: (target && target.avatar) || null }
    },
    lastMessage: "👋",
    lastMessageAt: firebase.firestore.FieldValue.serverTimestamp(),
    [`unread.${uid}`]: firebase.firestore.FieldValue.increment(1),
    [`unread.${myUid}`]: 0
  }, { merge: true }).then(() => {
    return threadRef.collection("messages").add({
      senderUid: myUid,
      reaction: "👋",
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
  }).then(() => {
    openChat(uid);
  }).catch((err) => {
    console.error(err);
    showToast(t("couldntSend"));
  });
}

function privacyLabel(level) {
  if (level === "private") return "· Only me";
  if (level === "friends") return "· Friends";
  return "";
}

function renderPost(p) {
  const likes = p.likes || [];
  const comments = p.comments || [];
  const reposts = p.reposts || [];
  const savedBy = p.savedBy || [];
  const liked = state.user && likes.includes(state.user.uid);
  const reposted = state.user && reposts.includes(state.user.uid);
  const saved = state.user && savedBy.includes(state.user.uid);
  const showComments = !!state.openComments[p.id];
  const isOwner = state.user && p.authorUid === state.user.uid;
  const isVideo = p.mediaType === "video" || (p.media && p.media.startsWith("data:video"));

  const mediaHtml = p.media ? `<div class="post-media">${isVideo ? `<video src="${p.media}" controls></video>` : `<img src="${p.media}" />`}</div>` : "";

  const commentsHtml = showComments ? `
    <div class="comments-box">
      ${comments.map(c => `<div class="comment-line"><b>${escapeHtml(c.name)}:</b> ${escapeHtml(c.text)}</div>`).join("")}
      <div class="comment-input-row">
        <input id="commentInput-${p.id}" type="text" placeholder="${t("writeAComment")}" />
        <button id="commentSubmit-${p.id}">${t("send")}</button>
      </div>
    </div>
  ` : "";

  return `
    <div class="post">
      <div class="post-head">
        <div class="avatar author-link" id="authoravatar-${p.id}">${initials(p.authorName)}</div>
        <div class="post-head-info author-link" id="authorlink-${p.id}">
          <div class="name">${escapeHtml(p.authorName)}</div>
          <div class="time">${timeAgo(p.createdAt)} <span class="privacy-tag">${privacyLabel(p.privacy)}</span></div>
        </div>
        ${isOwner ? `<button class="owner-menu-btn" id="owner-${p.id}">⋮</button>` : ""}
      </div>
      ${p.text ? `<div class="post-text">${escapeHtml(p.text)}</div>` : ""}
      ${mediaHtml}
      <div class="post-stats">
        <span>${likes.length} ${t("likesCount")}</span>
        <span>${comments.length} ${t("commentsCount")}</span>
      </div>
      <div class="post-actions">
        <button class="action-btn ${liked ? "liked" : ""}" id="like-${p.id}">${liked ? "❤️" : "🤍"} ${t("like")}</button>
        <button class="action-btn" id="comment-${p.id}">💬 ${t("comment")}</button>
        <button class="action-btn ${reposted ? "reposted" : ""}" id="repost-${p.id}">↻ ${t("repost")}</button>
        <button class="action-btn ${saved ? "saved" : ""}" id="save-${p.id}">${saved ? "🔖" : "📑"} ${t("save")}</button>
        <button class="action-btn" id="share-${p.id}">↗️ ${t("share")}</button>
      </div>
      ${commentsHtml}
    </div>
  `;
}

/* Keeps the chat input bar and any open bottom sheet (comments, share, etc.) floating
   just above the on-screen keyboard instead of getting hidden behind it — the classic
   mobile-web bug where a fixed "bottom:0" bar stays pinned to the full layout viewport
   while the visual viewport shrinks when the keyboard opens. */
function setupKeyboardOffset() {
  if (!window.visualViewport) return;
  const vv = window.visualViewport;
  const update = () => {
    const offset = Math.max(0, window.innerHeight - vv.height - vv.offsetTop);
    document.documentElement.style.setProperty("--kb-offset", offset + "px");
  };
  vv.addEventListener("resize", update);
  vv.addEventListener("scroll", update);
  update();
}
setupKeyboardOffset();

render();
</script><script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js", { updateViaCache: "none" });
    });
    // When a new version of the app takes over, reload once automatically
    // so everyone always ends up on the latest design/code — no manual
    // uninstall/reinstall needed.
    let milonSwRefreshed = false;
    navigator.serviceWorker.addEventListener("controllerchange", () => {
      if (milonSwRefreshed) return;
      milonSwRefreshed = true;
      window.location.reload();
    });
  }
</script>
