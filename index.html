  if (pinPostBtn) pinPostBtn.onclick = doPinPostFromSheet;
  const deletePostBtn = document.getElementById("deletePostBtn");
  if (deletePostBtn) deletePostBtn.onclick = doDeletePost;
  document.querySelectorAll("#privacyOptions .privacy-option").forEach(btn => {
    btn.onclick = () => setPrivacyForActivePost(btn.dataset.level);
  });
}

/* Send a post directly into a chat thread with a friend, as a shared-post message */
function doSendPostToFriend(uid) {
  if (!uid || !activePostId) return;
  const post = state.posts.find(p => p.id === activePostId);
  if (!post) return;
  const myUid = state.user.uid;
  const threadId = threadIdFor(myUid, uid);
  const threadRef = db.collection("threads").doc(threadId);
  threadRef.collection("messages").add({
    senderUid: myUid,
    text: `Shared a post: "${(post.text || "").slice(0, 60)}"`,
    image: post.media && post.mediaType !== "video" ? post.media : null,
    sharedPostId: post.id,
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  }).then(() => {
    return threadRef.set({
      participants: [myUid, uid],
      lastMessage: "Shared a post",
      lastMessageAt: firebase.firestore.FieldValue.serverTimestamp(),
      [`unread.${uid}`]: firebase.firestore.FieldValue.increment(1)
    }, { merge: true });
  }).then(() => {
    showToast("Sent!");
    closeSheets();
  }).catch((err) => { console.error(err); showToast("Couldn't send"); });
}

function doRepostFromSheet() {
  const post = state.posts.find(p => p.id === activePostId);
  if (post) toggleRepost(post);
  closeSheets();
}

/* Report a post; once a post collects 5+ distinct reports it is auto-hidden from public feeds
   (still visible to its own author, who sees it flagged) — a simple, real, working moderation layer. */
function doReportFromSheet() {
  if (!activePostId) return;
  const myUid = state.user.uid;
  const ref = db.collection("posts").doc(activePostId);
  db.runTransaction((tx) => {
    return tx.get(ref).then((doc) => {
      if (!doc.exists) return;
      const data = doc.data();
      const reports = data.reports || [];
      if (reports.includes(myUid)) return;
      const newReports = [...reports, myUid];
      tx.update(ref, { reports: newReports, hidden: newReports.length >= 5 ? true : (data.hidden || false) });
    });
  }).then(() => {
    showToast("Thanks — this post has been reported");
    closeSheets();
  }).catch((err) => { console.error(err); showToast("Couldn't submit report"); });
}

/* Simple, real (client-computed) analytics summary for one of the user's own posts */
function doShowAnalytics() {
  const post = state.posts.find(p => p.id === activePostId);
  if (!post) { closeSheets(); return; }
  const likes = (post.likes || []).length;
  const comments = (post.comments || []).length;
  const reposts = (post.reposts || []).length;
  const saves = (post.savedBy || []).length;
  showToast(`❤️ ${likes} · 💬 ${comments} · ↻ ${reposts} · 🔖 ${saves}`);
  closeSheets();
}

function doDownloadFromSheet() {
  const post = state.posts.find(p => p.id === activePostId);
  if (!post || !post.media) { showToast("Nothing to download"); return; }
  const a = document.createElement("a");
  a.href = post.media;
  a.download = `milon-post-${post.id}.${post.mediaType === "video" ? "webm" : "jpg"}`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  closeSheets();
}

/* Minimal working "Create group" — makes a group thread doc the user can message into (starts with just them; more members can be added by chatting the group's id to others in a future iteration) */
function doCreateGroupFromSheet() {
  const myUid = state.user.uid;
  db.collection("groups").add({
    ownerUid: myUid,
    members: [myUid],
    name: `${state.user.name}'s group`,
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  }).then(() => {
    showToast("Group created — find it soon under Inbox");
    closeSheets();
  }).catch((err) => { console.error(err); showToast("Couldn't create group"); });
}

function openShareSheet(postId) {
  activePostId = postId;
  render();
  requestAnimationFrame(() => {
    const ov = document.getElementById("shareOverlay");
    const sh = document.getElementById("shareSheet");
    if (ov) ov.classList.add("open");
    if (sh) sh.classList.add("open");
  });
}

function openOwnerMenu(postId) {
  activePostId = postId;
  const post = state.posts.find(p => p.id === postId);
  document.getElementById("ownerOverlay").classList.add("open");
  document.getElementById("ownerSheet").classList.add("open");
  const currentLevel = (post && post.privacy) || "public";
  document.querySelectorAll("#privacyOptions .privacy-option").forEach(btn => {
    btn.classList.toggle("selected", btn.dataset.level === currentLevel);
  });
}

function closeSheets() {
  document.querySelectorAll(".sheet-overlay, .bottom-sheet").forEach(el => el.classList.remove("open"));
  activePostId = null;
  activeFollowListRemoveUid = null;
}

function getPostLink(postId) {
  return `${window.location.origin}${window.location.pathname}?post=${postId}`;
}

function doCopyLink() {
  const link = getPostLink(activePostId);
  navigator.clipboard.writeText(link).then(() => {
    showToast("Link copied!");
    closeSheets();
  }).catch(() => {
    showToast("Couldn't copy the link");
  });
}

function doShareTo(platform) {
  const link = encodeURIComponent(getPostLink(activePostId));
  const text = encodeURIComponent("Check out this post on Milon!");
  const urls = {
    whatsapp: `https://wa.me/?text=${text}%20${link}`,
    messenger: `fb-messenger://share/?link=${link}`,
    facebook: `https://www.facebook.com/sharer/sharer.php?u=${link}`,
    telegram: `https://t.me/share/url?url=${link}&text=${text}`,
    sms: `sms:?body=${text}%20${link}`,
  };
  window.open(urls[platform], "_blank");
  closeSheets();
}

/* ================= Own post: Edit / Delete / Privacy / Pin ================= */
function doEditPost() {
  const post = state.posts.find(p => p.id === activePostId);
  if (!post) return;
  const newText = prompt("Edit post:", post.text || "");
  if (newText !== null && newText.trim() !== "") {
    db.collection("posts").doc(post.id).update({ text: newText.trim() })
      .then(() => showToast("Post updated"))
      .catch((err) => { console.error(err); showToast("Couldn't update the post"); });
  }
  closeSheets();
}

function doPinPostFromSheet() {
  if (activePostId) togglePinPost(activePostId);
  closeSheets();
}

function doDeletePost() {
  if (!activePostId) return;
  if (!confirm("Delete this post? This can't be undone.")) return;
  db.collection("posts").doc(activePostId).delete()
    .then(() => showToast("Post deleted"))
    .catch((err) => { console.error(err); showToast("Couldn't delete the post"); });
  closeSheets();
}

function setPrivacyForActivePost(level) {
  if (!activePostId) return;
  db.collection("posts").doc(activePostId).update({ privacy: level })
    .then(() => showToast("Privacy updated"))
    .catch((err) => { console.error(err); showToast("Couldn't update privacy"); });
  closeSheets();
}

/* Take a photo, compress it, and convert it to base64 (Home composer's own image picker) */
function handleImageSelect(e) {
  const file = e.target.files[0];
  if (!file) return;
  if (!isAllowedImageFile(file)) { showToast("That file type isn't supported"); e.target.value = ""; return; }
  compressImageToDataUrl(file, { maxDim: 900, quality: 0.7 }, (compressed) => {
    setState({ composerMedia: compressed, composerMediaType: "image" });
  });
}

function submitPost() {
  if (!state.composerText.trim() && !state.composerMedia) return;

  const postBtn = document.getElementById("composePostBtn");
  if (postBtn) { postBtn.disabled = true; postBtn.textContent = "Posting..."; }

  db.collection("posts").add({
    authorUid: state.user.uid,
    authorName: state.user.name,
    text: state.composerText.trim(),
    media: state.composerMedia,
    mediaType: state.composerMediaType || (state.composerMedia ? "image" : null),
    privacy: state.composePrivacy || "public",
    likes: [],
    comments: [],
    reports: [],
    hidden: false,
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  }).then(() => {
    setState({ composerText: "", composerMedia: null, composerMediaType: null, composePrivacy: "public", view: "feed" });
    showToast("Posted!");
  }).catch((err) => {
    console.error(err);
    showToast("Couldn't create the post");
    render();
  });
}

function toggleLike(post) {
  const uid = state.user.uid;
  const liked = (post.likes || []).includes(uid);
  const ref = db.collection("posts").doc(post.id);
  ref.update({
    likes: liked
      ? firebase.firestore.FieldValue.arrayRemove(uid)
      : firebase.firestore.FieldValue.arrayUnion(uid)
  }).then(() => {
    if (!liked) logActivity(post.authorUid, "like", `${state.user.name} liked your post`);
  }).catch((err) => console.error(err));
}

/* Shared comment-submission helper used by both the classic feed comment box and the
   full-screen feed's comments sheet — takes the raw text directly rather than reading
   from a specific input id, so it works no matter which UI called it. */
function submitCommentText(postId, text) {
  if (!text || !text.trim()) return;
  const ref = db.collection("posts").doc(postId);
  ref.update({
    comments: firebase.firestore.FieldValue.arrayUnion({
      name: state.user.name,
      text: text.trim()
    })
  }).then(() => {
    const post = state.posts.find(p => p.id === postId);
    if (post) logActivity(post.authorUid, "comment", `${state.user.name} commented: "${text.trim().slice(0, 60)}"`);
  }).catch((err) => {
    console.error(err);
    showToast("Couldn't send comment");
  });
}

function submitComment(postId) {
  const input = document.getElementById(`commentInput-${postId}`);
  if (!input) return;
  const text = input.value.trim();
  if (!text) return;
  submitCommentText(postId, text);
  input.value = "";
}

function timeAgo(ts) {
  if (!ts || !ts.toDate) return "just now";
  const diffMs = Date.now() - ts.toDate().getTime();
  const mins = Math.floor(diffMs / 60000);
  if (mins < 1) return "just now";
  if (mins < 60) return `${mins}m ago`;
  const hrs = Math.floor(mins / 60);
  if (hrs < 24) return `${hrs}h ago`;
  return `${Math.floor(hrs / 24)}d ago`;
}

function privacyLabel(level) {
  if (level === "private") return "· Only me";
  if (level === "friends") return "· Friends";
  return "";
}

function renderPost(p) {
  const likes = p.likes || [];
  const comments = p.comments || [];
  const reposts = p.reposts || [];
  const savedBy = p.savedBy || [];
  const liked = state.user && likes.includes(state.user.uid);
  const reposted = state.user && reposts.includes(state.user.uid);
  const saved = state.user && savedBy.includes(state.user.uid);
  const showComments = !!state.openComments[p.id];
  const isOwner = state.user && p.authorUid === state.user.uid;
  const isVideo = p.mediaType === "video" || (p.media && p.media.startsWith("data:video"));

  const mediaHtml = p.media ? `<div class="post-media">${isVideo ? `<video src="${p.media}" controls></video>` : `<img src="${p.media}" />`}</div>` : "";

  const commentsHtml = showComments ? `
    <div class="comments-box">
      ${comments.map(c => `<div class="comment-line"><b>${escapeHtml(c.name)}:</b> ${escapeHtml(c.text)}</div>`).join("")}
      <div class="comment-input-row">
        <input id="commentInput-${p.id}" type="text" placeholder="Write a comment..." />
        <button id="commentSubmit-${p.id}">Send</button>
      </div>
    </div>
  ` : "";

  return `
    <div class="post">
      <div class="post-head">
        <div class="avatar author-link" id="authoravatar-${p.id}">${initials(p.authorName)}</div>
        <div class="post-head-info author-link" id="authorlink-${p.id}">
          <div class="name">${escapeHtml(p.authorName)}</div>
          <div class="time">${timeAgo(p.createdAt)} <span class="privacy-tag">${privacyLabel(p.privacy)}</span></div>
        </div>
        ${isOwner ? `<button class="owner-menu-btn" id="owner-${p.id}">⋮</button>` : ""}
      </div>
      ${p.text ? `<div class="post-text">${escapeHtml(p.text)}</div>` : ""}
      ${mediaHtml}
      <div class="post-stats">
        <span>${likes.length} likes</span>
        <span>${comments.length} comments</span>
      </div>
      <div class="post-actions">
        <button class="action-btn ${liked ? "liked" : ""}" id="like-${p.id}">${liked ? "❤️" : "🤍"} Like</button>
        <button class="action-btn" id="comment-${p.id}">💬 Comment</button>
        <button class="action-btn ${reposted ? "reposted" : ""}" id="repost-${p.id}">↻ Repost</button>
        <button class="action-btn ${saved ? "saved" : ""}" id="save-${p.id}">${saved ? "🔖" : "📑"} Save</button>
        <button class="action-btn" id="share-${p.id}">↗️ Share</button>
      </div>
      ${commentsHtml}
    </div>
  `;
}

render();

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js", { updateViaCache: "none" });
    });
    // When a new version of the app takes over, reload once automatically
    // so everyone always ends up on the latest design/code — no manual
    // uninstall/reinstall needed.
    let milonSwRefreshed = false;
    navigator.serviceWorker.addEventListener("controllerchange", () => {
      if (milonSwRefreshed) return;
      milonSwRefreshed = true;
      window.location.reload();
    });
  }
</script>
