  const flashBtn = document.getElementById("camFlashBtn");
  if (flashBtn) flashBtn.onclick = () => { state.cameraFlashOn = !state.cameraFlashOn; render(); applyTorch(); };
  const timerBtn = document.getElementById("camTimerBtn");
  if (timerBtn) timerBtn.onclick = () => setState({ cameraTimerOn: !state.cameraTimerOn });

  document.querySelectorAll(".camera-filter-btn").forEach(btn => {
    btn.onclick = () => setState({ cameraFilter: btn.dataset.filter });
  });
  document.querySelectorAll(".camera-speed-btn").forEach(btn => {
    btn.onclick = () => setState({ cameraSpeed: btn.dataset.speed });
  });

  document.querySelectorAll(".camera-mode-btn").forEach(btn => {
    btn.onclick = () => {
      const mode = btn.dataset.mode;
      if (mode === "TEXT") {
        // Text-only post: close the camera and open the compose screen with no media
        stopCameraStream();
        setState({ view: "postCompose", composerMedia: null, composerMediaType: null, composerText: "", composerSoundName: "" });
        return;
      }
      setState({ cameraMode: mode });
    };
  });

  document.getElementById("camGalleryShortcut").onclick = () => document.getElementById("camGalleryInput").click();
  document.getElementById("camGalleryInput").onchange = handleCameraGallerySelect;

  document.getElementById("camRecordBtn").onclick = () => {
    if (state.cameraTimerOn && state.cameraCountdown === 0) {
      runCountdownThen(() => triggerCapture());
      return;
    }
    triggerCapture();
  };

  const videoEl = document.getElementById("liveCameraVideo");
  if (videoEl && state.cameraStream) { videoEl.srcObject = state.cameraStream; videoEl.play().catch(() => {}); }
}

function triggerCapture() {
  if (state.cameraMode === "PHOTO") {
    capturePhotoFromStream();
  } else {
    if (state.cameraRecording) stopVideoRecording();
    else startVideoRecording();
  }
}

/* 3-second on-screen countdown before capture, when the Timer toggle is on */
function runCountdownThen(callback) {
  state.cameraCountdown = 3;
  render();
  const iv = setInterval(() => {
    state.cameraCountdown -= 1;
    if (state.cameraCountdown <= 0) {
      clearInterval(iv);
      state.cameraCountdown = 0;
      render();
      callback();
    } else {
      render();
    }
  }, 1000);
}

function formatRecTime(sec) {
  const m = Math.floor(sec / 60);
  const s = sec % 60;
  return `${m}:${s < 10 ? "0" : ""}${s}`;
}

/* Applies the currently-selected filter to a canvas context via CSS filter string, so
   photos/videos are saved with the same look the user saw in the live preview. */
function cssFilterFor(key) {
  const map = {
    none: "none",
    bw: "grayscale(1)",
    warm: "saturate(1.4) sepia(0.25)",
    cool: "saturate(1.2) hue-rotate(180deg) brightness(1.05)",
    vivid: "saturate(1.8) contrast(1.15)",
    soft: "brightness(1.08) contrast(0.92) saturate(0.9)"
  };
  return map[key] || "none";
}

function capturePhotoFromStream() {
  const videoEl = document.getElementById("liveCameraVideo");
  if (!videoEl) return;
  const canvas = document.createElement("canvas");
  canvas.width = videoEl.videoWidth || 720;
  canvas.height = videoEl.videoHeight || 1280;
  const ctx = canvas.getContext("2d");
  ctx.filter = cssFilterFor(state.cameraFilter);
  if (state.cameraFacing === "user") {
    // The live preview is mirrored for a natural selfie view, but the saved photo
    // should NOT be mirrored (so text/details look correct to everyone else) —
    // flip the drawing context back before capturing.
    ctx.translate(canvas.width, 0);
    ctx.scale(-1, 1);
  }
  ctx.drawImage(videoEl, 0, 0, canvas.width, canvas.height);
  const dataUrl = canvas.toDataURL("image/jpeg", 0.85);
  stopCameraStream();
  setState({ cameraCapturedType: "photo", cameraCapturedUrl: dataUrl, cameraCapturedBlob: null });
}

function maxRecordMs() {
  if (state.cameraMode === "10m") return 10 * 60 * 1000;
  if (state.cameraMode === "60s") return 60 * 1000;
  return 15 * 1000; // 15s default
}

function startVideoRecording() {
  if (!state.cameraStream) return;
  recordedChunksRef = [];
  const options = {};
  // MediaRecorder audio track is included by default; the "Sound" control mutes/unmutes
  // this input track before recording starts (see cameraSoundOn toggle usage in useCapturedMedia's audio track).
  try {
    mediaRecorderRef = new MediaRecorder(state.cameraStream, options);
  } catch (e) {
    console.error(e);
    showToast(t("recordingNotSupported"));
    return;
  }
  mediaRecorderRef.ondataavailable = (e) => { if (e.data && e.data.size > 0) recordedChunksRef.push(e.data); };
  mediaRecorderRef.onstop = () => {
    const blob = new Blob(recordedChunksRef, { type: "video/webm" });
    const url = URL.createObjectURL(blob);
    stopCameraStream();
    setState({ cameraCapturedType: "video", cameraCapturedUrl: url, cameraCapturedBlob: blob, cameraRecording: false, cameraRecordSeconds: 0 });
  };
  mediaRecorderRef.start();
  state.cameraRecording = true;
  state.cameraRecordSeconds = 0;
  render();
  // "Speed" affects playback rate applied to the reviewed clip (0.5x/1x/2x/3x), and also
  // scales the recording time limit so a 2x/3x clip still fits the chosen duration mode.
  const speedFactor = parseFloat((state.cameraSpeed || "1x").replace("x", "")) || 1;
  const limitMs = maxRecordMs() * speedFactor;
  recordTimerRef = setInterval(() => {
    state.cameraRecordSeconds += 1;
    const timerEl = document.getElementById("recTimer");
    if (timerEl) timerEl.textContent = formatRecTime(state.cameraRecordSeconds);
    if (state.cameraRecordSeconds * 1000 >= limitMs) stopVideoRecording();
  }, 1000);
}

function stopVideoRecording() {
  if (mediaRecorderRef && mediaRecorderRef.state !== "inactive") mediaRecorderRef.stop();
  if (recordTimerRef) { clearInterval(recordTimerRef); recordTimerRef = null; }
}

/* Gallery shortcut inside the camera screen: pick an existing photo/video to post */
function handleCameraGallerySelect(e) {
  const file = e.target.files[0];
  if (!file) return;
  if (!isAllowedMediaFile(file)) {
    showToast(t("fileTypeNotSupported"));
    e.target.value = "";
    return;
  }
  const isVideo = file.type.startsWith("video/");
  stopCameraStream();
  if (isVideo) {
    fileToDataUrl(file, (dataUrl) => {
      setState({ cameraCapturedType: "video", cameraCapturedUrl: dataUrl, cameraCapturedBlob: null, cameraLastGalleryThumb: null });
    });
  } else {
    compressImageToDataUrl(file, { maxDim: 900, quality: 0.75 }, (dataUrl) => {
      setState({ cameraCapturedType: "photo", cameraCapturedUrl: dataUrl, cameraCapturedBlob: null, cameraLastGalleryThumb: dataUrl });
    });
  }
}

/* "Use this" on the review screen — send captured media into the caption/compose screen */
function useCapturedMedia() {
  const type = state.cameraCapturedType;
  const url = state.cameraCapturedUrl;

  if (type === "photo") {
    setState({ view: "postCompose", composerMedia: url, composerMediaType: "image", composerText: "", composerSoundName: "", cameraCapturedType: null, cameraCapturedUrl: null, cameraCapturedBlob: null });
    return;
  }

  if (type === "video") {
    if (state.cameraCapturedBlob) {
      const reader = new FileReader();
      reader.onload = () => {
        setState({ view: "postCompose", composerMedia: reader.result, composerMediaType: "video", composerText: "", composerSoundName: "", cameraCapturedType: null, cameraCapturedUrl: null, cameraCapturedBlob: null });
      };
      reader.readAsDataURL(state.cameraCapturedBlob);
    } else {
      setState({ view: "postCompose", composerMedia: url, composerMediaType: "video", composerText: "", composerSoundName: "", cameraCapturedType: null, cameraCapturedUrl: null, cameraCapturedBlob: null });
    }
  }
}

/* ---------------- Friends screen ---------------- */
function openFriendsScreen() {
  // TikTok's "Friends" bottom-nav tab opens straight into the swipeable video feed of your
  // friends' posts — the people list (search/follow/message) is one tap away via its own
  // "Friends" sub-tab, not the default landing view.
  setState({ view: "friends", friendsSubTab: "videos" });
  // allUsers is kept live by listenToAllUsers() (started at login), so no one-time
  // fetch is needed here anymore — the list is already real-time.
  listenToPresenceForAllUsers();
}

/* Real-time online/offline presence for everyone currently loaded into allUsers,
   so green "online" dots update live without a refresh. */
let unsubscribePresenceList = null;
let presenceMap = {};
function listenToPresenceForAllUsers() {
  if (unsubscribePresenceList) unsubscribePresenceList();
  unsubscribePresenceList = db.collection("presence").onSnapshot((snap) => {
    const map = {};
    snap.docs.forEach(d => { map[d.id] = d.data(); });
    presenceMap = map;
    render();
  }, (err) => console.error(err));
}
function isUserOnline(uid) {
  const p = presenceMap[uid];
  return !!(p && p.online);
}

/* Friends list: with no search text, shows ONLY mutual friends (you follow them AND they follow
   you back) — real "friends", not one-sided follows. Typing a search reveals everyone matching
   the query (with a Follow/Following button), so you can still find and follow new people. */
function computeFriendsList(myUid, myPinned) {
  const q = state.friendsSearch.trim().toLowerCase();
  let list;
  if (q) {
    list = state.allUsers.filter(u =>
      (u.name || "").toLowerCase().includes(q) || (u.handle || "").toLowerCase().includes(q)
    );
  } else {
    list = state.allUsers.filter(u => (u.followers || []).includes(myUid) && (u.following || []).includes(myUid));
  }
  list = list.filter(u => !isBlockedEitherWay(u.uid));
  return [...list].sort((a, b) => {
    const ap = myPinned.includes(a.uid) ? 1 : 0;
    const bp = myPinned.includes(b.uid) ? 1 : 0;
    return bp - ap;
  });
}

function renderFriendsScreen() {
  const myUid = state.user.uid;
  const myPinned = (state.myUserDoc && state.myUserDoc.pinnedFriends) || [];

  if (state.friendsSubTab === "videos") {
    renderFriendsVideoFeed();
    return;
  }

  const isSearching = !!state.friendsSearch.trim();
  const list = computeFriendsList(myUid, myPinned);

  const rowsHtml = list.length
    ? list.map(u => renderUserRow(u, myUid, myPinned)).join("")
    : (isSearching
        ? `<div class="empty-nav-tab"><div class="big">🔍</div><div class="line1">${t("noOneFound")}</div><div class="line2">${t("tryDifferentSearch")}</div></div>`
        : `<div class="empty-nav-tab"><div class="big">👥</div><div class="line1">${t("noFriendsYet")}</div><div class="line2">${t("searchFollowThemHint")}</div></div>`);

  root.innerHTML = `
    <div class="topbar">
      <div class="brand-sm" id="brandHomeBtn2">${t("navFriends")}</div>
    </div>
    <div class="friends-sub-tabs">
      <button class="simple-tab ${state.friendsSubTab === "people" ? "active" : ""}" id="friendsSubPeople">${t("navFriends")}</button>
      <button class="simple-tab ${state.friendsSubTab === "videos" ? "active" : ""}" id="friendsSubVideos">${t("videosTab")}</button>
    </div>
    <div class="friends-search-wrap">
      <input id="friendsSearchInput" type="text" placeholder="${t("searchPeopleByNameHandle")}" value="${escapeHtml(state.friendsSearch)}" />
    </div>
    <div class="user-list">${rowsHtml}</div>
    ${renderBottomNav("friends")}
  `;

  document.getElementById("brandHomeBtn2").onclick = () => setState({ view: "feed" });
  document.getElementById("friendsSubPeople").onclick = () => setState({ friendsSubTab: "people" });
  document.getElementById("friendsSubVideos").onclick = () => setState({ friendsSubTab: "videos" });

  // Keep the search box focused across re-renders: update state without a full setState()
  // re-render on every keystroke (setState() previously destroyed & recreated this input,
  // which stole focus and closed the keyboard after every character).
  const searchInput = document.getElementById("friendsSearchInput");
  searchInput.oninput = (e) => { state.friendsSearch = e.target.value; renderFriendsListOnly(); };

  wireFriendsRowHandlers(list);
  wireBottomNav();
}

/* Re-renders ONLY the user-list portion of the Friends screen (used while typing in the
   search box) so the search <input> itself is never replaced and never loses focus/keyboard. */
function renderFriendsListOnly() {
  const myUid = state.user.uid;
  const myPinned = (state.myUserDoc && state.myUserDoc.pinnedFriends) || [];
  const isSearching = !!state.friendsSearch.trim();
  const list = computeFriendsList(myUid, myPinned);

  listEl.innerHTML = list.length

        ? `<div class="empty-nav-tab"><div class="big">🔍</div><div class="line1">${t("noOneFound")}</div><div class="line2">${t("tryDifferentSearch")}</div></div>`
        : `<div class="empty-nav-tab"><div class="big">👥</div><div class="line1">${t("noFriendsYet")}</div><div class="line2">${t("searchFollowThemHint")}</div></div>`);
  wireFriendsRowHandlers(list);
}

function wireFriendsRowHandlers(list) {
  list.forEach(u => {
    const rowAvatar = document.getElementById(`useravatar-${u.uid}`);
    const rowInfo = document.getElementById(`userinfo-${u.uid}`);
    const followBtn = document.getElementById(`followbtn-${u.uid}`);
    const msgBtn = document.getElementById(`msgbtn-${u.uid}`);
    const pinBtn = document.getElementById(`pinfriendbtn-${u.uid}`);

    if (rowInfo) rowInfo.onclick = () => openProfile(u.uid);
    if (followBtn) followBtn.onclick = () => toggleFollowFromList(u.uid);
    if (msgBtn) msgBtn.onclick = () => openChat(u.uid);
    if (pinBtn) pinBtn.onclick = () => togglePinFriend(u.uid);
  });
}

/* Friends' video feed: full-screen swipeable feed (same style as Home), but restricted to ONLY
   people the user follows — never shows anyone else's posts. */
function renderFriendsVideoFeed() {
  const myUid = state.user.uid;
  const followingUids = new Set((state.allUsers || []).filter(u => (u.followers || []).includes(myUid) && (u.following || []).includes(myUid)).map(u => u.uid));
  const hiddenSafe = (p) => !p.hidden || p.authorUid === myUid;
  const videos = state.posts.filter(p =>
    followingUids.has(p.authorUid) &&
    p.media &&
    hiddenSafe(p) &&
    !isBlockedEitherWay(p.authorUid) &&
    !isMutedByMe(p.authorUid) &&
    (!p.privacy || p.privacy === "public")
  );

  root.innerHTML = `
    <div class="feed-topbar on-light">
      <div class="feed-tab-btn active" style="pointer-events:none;">${t("navFriends")}</div>
      <button class="feed-search-btn" id="friendsFeedSearchBtn">🔍</button>
    </div>
    ${videos.length ? `<div class="fs-scroll" id="fsScrollFriends">${videos.map(renderFsSlide).join("")}</div>` : `
      <div class="fs-empty-full" style="position:static; min-height:60vh;">
        <div style="font-size:40px;margin-bottom:10px;">🎬</div>
        <div style="font-weight:700;margin-bottom:6px;">${t("noFriendVideosYet")}</div>
        <div style="font-size:13px;">${t("followPeopleVideosHint")}</div>
      </div>
    `}
    <div class="toast" id="toast">${escapeHtml(state.toastMsg)}</div>
    ${renderShareSheet()}
    ${renderOwnerSheet()}
    ${renderFsCommentsSheet()}
    ${renderBottomNav("friends")}
  `;
  document.getElementById("friendsFeedSearchBtn").onclick = () => setState({ friendsSubTab: "people" });

  wireFsSlideHandlers(videos);
  wireSheetHandlers();
  wireFsCommentsHandlers();
  wireBottomNav();
}

/* ================================================================
   SEARCH / DISCOVER
   Everything here is computed live from real Firestore data already
   loaded into state.posts / state.allUsers — no fake/sample numbers.
   Recent search terms are kept locally (this device only), same
   honest approach as the post draft: real, but not synced/online.
   ================================================================ */
function openDiscoverScreen() {
  setState({ view: "discover", discoverQuery: "", discoverTab: "top" });
}

function getRecentSearches() {
  try { return JSON.parse(localStorage.getItem("milon_recent_searches") || "[]"); } catch (e) { return []; }
}
function addRecentSearch(q) {
  if (!q || !q.trim()) return;
  const trimmed = q.trim();
  let list = getRecentSearches().filter(s => s.toLowerCase() !== trimmed.toLowerCase());
  list.unshift(trimmed);
  list = list.slice(0, 10);
  try { localStorage.setItem("milon_recent_searches", JSON.stringify(list)); } catch (e) {}
}
function clearRecentSearches() {
  try { localStorage.removeItem("milon_recent_searches"); } catch (e) {}
  renderDiscoverResultsOnly();
}

function computeTrendingHashtags(limit) {
  const counts = {};
  (state.posts || []).forEach(p => {
    (p.hashtags || []).forEach(h => { counts[h] = (counts[h] || 0) + 1; });
  });
  return Object.entries(counts).sort((a, b) => b[1] - a[1]).slice(0, limit || 10);
}
function computeTrendingCreators(limit) {
  return [...(state.allUsers || [])]
    .sort((a, b) => ((b.followers || []).length) - ((a.followers || []).length))
    .slice(0, limit || 8);
}

function discoverSearch(query) {
  const q = query.trim().toLowerCase();
  const myUid = state.user ? state.user.uid : null;
  const visible = (state.posts || []).filter(p => {
    if (p.hidden && p.authorUid !== myUid) return false;
    if (p.privacy && p.privacy !== "public" && p.authorUid !== myUid) return false;
    if (isBlockedEitherWay(p.authorUid)) return false;
    return true;
  });
  if (!q) return { users: [], videos: [], hashtags: [] };
  const users = (state.allUsers || []).filter(u =>
    !isBlockedEitherWay(u.uid) &&
    ((u.name || "").toLowerCase().includes(q) || (u.handle || "").toLowerCase().includes(q))
  );
  const cleanTag = q.replace(/^#/, "");
  const videos = visible.filter(p =>
    (p.text || "").toLowerCase().includes(q) || (p.hashtags || []).some(h => h.includes(cleanTag))
  );
  const hashtags = computeTrendingHashtags(200).filter(([tag]) => tag.includes(cleanTag));
  return { users, videos, hashtags };
}

/* Follow / unfollow / request. Public accounts: tapping Follow immediately adds you to
   their followers, no approval step. Private accounts: tapping Follow instead adds you to
   their followRequests (pending) — nothing changes until they Accept. Tapping again while
   pending cancels the request. "Friend" is simply the case where the follow is mutual. */
function toggleFollowFromList(targetUid) {
  const myUid = state.user.uid;
  const target = state.allUsers.find(u => u.uid === targetUid) || (state.profileUserDoc && state.profileUserDoc.uid === targetUid ? state.profileUserDoc : null);
  if (!target) return;
  const amFollowing = (target.followers || []).includes(myUid);
  const isRequested = !amFollowing && (target.followRequests || []).includes(myUid);
  const targetRef = db.collection("users").doc(targetUid);
  const myRef = db.collection("users").doc(myUid);
  const batch = db.batch();

  if (amFollowing) {
    batch.update(targetRef, { followers: firebase.firestore.FieldValue.arrayRemove(myUid) });
    batch.update(myRef, { following: firebase.firestore.FieldValue.arrayRemove(targetUid) });
  } else if (isRequested) {
    batch.update(targetRef, { followRequests: firebase.firestore.FieldValue.arrayRemove(myUid) });
  } else if (target.private) {
    batch.update(targetRef, { followRequests: firebase.firestore.FieldValue.arrayUnion(myUid) });
  } else {
    batch.update(targetRef, { followers: firebase.firestore.FieldValue.arrayUnion(myUid) });
    batch.update(myRef, { following: firebase.firestore.FieldValue.arrayUnion(targetUid) });
  }

  batch.commit().then(() => {
    const updated = state.allUsers.map(u => {
      if (u.uid !== targetUid) return u;
      const followers = new Set(u.followers || []);
      const followRequests = new Set(u.followRequests || []);
      if (amFollowing) {
        followers.delete(myUid);
      } else if (isRequested) {
        followRequests.delete(myUid);
      } else if (target.private) {
        followRequests.add(myUid);
      } else {
        followers.add(myUid);
      }
      return { ...u, followers: Array.from(followers), followRequests: Array.from(followRequests) };
    });
    setState({ allUsers: updated });
    if (!amFollowing && !isRequested) {
      if (target.private) {
        logActivity(targetUid, "follow_request", `${state.user.name} requested to follow you`);
      } else {
        logActivity(targetUid, "follow", `${state.user.name} started following you`);
      }
    }
  }).catch((err) => {
    console.error(err);
    showToast(t("couldntUpdateFollowStatus"));
  });
}

/* Accept a pending follow request: moves the requester into my followers/their following,
   clears the request, and lets them know it was accepted. */
function acceptFollowRequest(fromUid) {
  const myUid = state.user.uid;
  const myRef = db.collection("users").doc(myUid);
  const fromRef = db.collection("users").doc(fromUid);
  const batch = db.batch();
  batch.update(myRef, {
    followRequests: firebase.firestore.FieldValue.arrayRemove(fromUid),
    followers: firebase.firestore.FieldValue.arrayUnion(fromUid)
  });
  batch.update(fromRef, { following: firebase.firestore.FieldValue.arrayUnion(myUid) });
  batch.commit().then(() => {
    logActivity(fromUid, "follow_accept", `${state.user.name} accepted your follow request`);
    showToast(t("requestAccepted"));
  }).catch((err) => {
    console.error(err);
    showToast(t("couldntAcceptRequest"));
  });
}

/* Decline a pending follow request: just removes it, no notification sent. */
function declineFollowRequest(fromUid) {
  const myUid = state.user.uid;
  db.collection("users").doc(myUid).update({
    followRequests: firebase.firestore.FieldValue.arrayRemove(fromUid)
  }).catch((err) => {
    console.error(err);
    showToast(t("couldntDeclineRequest"));
  });
}

/* ---------------- Inbox / threads ---------------- */
function threadIdFor(uidA, uidB) {
  return [uidA, uidB].sort().join("_");
}

let unsubscribeThreads = null;
let prevThreadUnreadRef = {}; // threadId -> last-seen unread count, used to detect real-time new messages for notifications
function listenToThreads() {
  if (unsubscribeThreads) unsubscribeThreads();
  const myUid = state.user.uid;
  unsubscribeThreads = db.collection("threads")
    .where("participants", "array-contains", myUid)
    .onSnapshot((snap) => {
      // serverTimestamps: "estimate" — without this, a just-sent message's lastMessageAt
      // reads as null in the local echo (before the server confirms it), which sorts the
      // thread to the bottom for a moment and then jumps it up once the real value lands.
      // Estimating gives an immediate local clock value so the thread sorts correctly right away.
      const threads = snap.docs.map(d => ({ id: d.id, ...d.data({ serverTimestamps: "estimate" }) }))
        .sort((a, b) => (b.lastMessageAt?.toMillis?.() || 0) - (a.lastMessageAt?.toMillis?.() || 0));

      threads.forEach(t => {
        const unread = (t.unread && t.unread[myUid]) || 0;
        const prev = prevThreadUnreadRef[t.id] || 0;
        const otherUid = (t.participants || []).find(p => p !== myUid);
        const isViewingThisChat = state.view === "chat" && state.chatUid === otherUid;
        if (unread > prev && !isViewingThisChat && window.Notification && Notification.permission === "granted") {
          const otherInfo = (t.participantInfo && t.participantInfo[otherUid]) || { name: "Someone" };
          try {
            new Notification(otherInfo.name, { body: t.lastMessage || "New message", tag: t.id });
          } catch (e) { /* notification not supported in this context */ }
        }
        prevThreadUnreadRef[t.id] = unread;
      });

      setState({ threads });
    }, (err) => {
      console.error(err);
      showToast(t("couldntLoadInbox"));
    });
}

/* Real-time notifications: one unified sub-collection per user (users/{uid}/notifications) holds
   every "follow" / "like" / "comment" / "message" event aimed at me, newest first. Each of the
   Inbox rows (New followers / Activity / Message requests) is just this same list filtered by type —
   so all three update live the instant something happens, with no polling or manual refresh. */
let unsubscribeActivity = null;
function listenToNotifications() {
  if (unsubscribeActivity) unsubscribeActivity();
  const myUid = state.user.uid;
  unsubscribeActivity = db.collection("users").doc(myUid).collection("notifications")
    .orderBy("createdAt", "desc").limit(60)
    .onSnapshot((snap) => {
      const items = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      setState({ activity: items, activityLoaded: true });
    }, (err) => console.error(err));
}

/* Small thumbnail to attach to a like/comment notification: the post's own image, or the
   video's cover frame when it's a video. Falls back to null (plain icon shown instead) when
   neither is available yet. */
function getPostThumb(post) {
  if (!post) return null;
  const isVideo = post.mediaType === "video" || (post.media && post.media.startsWith("data:video"));
  return isVideo ? (post.cover || null) : (post.media || null);
}

/* Records a real-time notification for a target user. type: "follow" | "like" | "comment" | "message" */
function logActivity(targetUid, type, text, extra) {
  if (!targetUid || targetUid === state.user.uid) return; // never notify yourself
  const prefKey = type === "like" ? "likes"
    : type === "comment" ? "comments"
    : (type === "follow" || type === "follow_accept" || type === "follow_request") ? "follows"
    : type === "message" ? "messages" : null;
  const write = () => db.collection("users").doc(targetUid).collection("notifications").add({
    type, text, fromUid: state.user.uid, fromName: state.user.name,
    createdAt: firebase.firestore.FieldValue.serverTimestamp(), read: false, ...(extra || {})
  }).catch((err) => console.error(err));
  if (!prefKey) { write(); return; }
  // Real gating: check the recipient's own Notifications settings before writing —
  // if they've turned this type off, it never gets created for them at all.
  db.collection("users").doc(targetUid).get().then((doc) => {
    const notifPrefs = (doc.exists && doc.data().settings && doc.data().settings.notifPrefs) || {};
    if (notifPrefs[prefKey] === false) return;
    write();
  }).catch(() => write());
}

/* Marks every notification of a given type as read (called when its Inbox section is opened) */
function markNotificationsRead(type) {
  const myUid = state.user.uid;
  const toMark = state.activity.filter(a => (!type || a.type === type) && !a.read);
  if (!toMark.length) return;
  const batch = db.batch();
  toMark.forEach(a => batch.update(db.collection("users").doc(myUid).collection("notifications").doc(a.id), { read: true }));
  batch.commit().catch((err) => console.error(err));
}

/* System notifications: a single global collection the app owner can broadcast into. Every user
   listens to it in real time, so a new notice appears instantly for everyone. */
let unsubscribeSystemNotices = null;
function listenToSystemNotices() {
  if (unsubscribeSystemNotices) unsubscribeSystemNotices();
  unsubscribeSystemNotices = db.collection("systemNotices").orderBy("createdAt", "desc").limit(20)
    .onSnapshot((snap) => {
      setState({ systemNotices: snap.docs.map(d => ({ id: d.id, ...d.data() })) });
    }, (err) => console.error(err));
}

function isOwnerAccount() {
  return !!(state.user && state.user.email && state.user.email.toLowerCase() === OWNER_EMAIL.toLowerCase());

function sendSystemNotice() {
  const text = (state.ownerNoticeText || "").trim();
  if (!text) return;
  db.collection("systemNotices").add({
    text, fromName: state.user.name, createdAt: firebase.firestore.FieldValue.serverTimestamp()
  }).then(() => {
    setState({ ownerNoticeText: "" });
    showToast(t("noticeSentToEveryone"));
  }).catch((err) => { console.error(err); showToast(t("couldntSendNotice")); });
}

function renderInboxScreen() {
  if (state.inboxSection) return renderInboxSubScreen();

  const myUid = state.user.uid;
  const myPinned = (state.myUserDoc && state.myUserDoc.pinnedFriends) || [];
  // Pinned threads always float to the top of the list (matches TikTok), then within each
  // group (pinned / not pinned) threads stay in the existing most-recent-first order.
  // Archived threads (archivedFor[myUid] === true) stay out of the main list — they live
  // under the "Archived chats" row instead, matching TikTok's archive behavior.
  const activeThreads = state.threads
    .filter(t => !(t.archivedFor && t.archivedFor[myUid]))
    .sort((a, b) => {
      const otherA = (a.participants || []).find(p => p !== myUid);
      const otherB = (b.participants || []).find(p => p !== myUid);
      const pinnedA = myPinned.includes(otherA) ? 1 : 0;
      const pinnedB = myPinned.includes(otherB) ? 1 : 0;
      if (pinnedA !== pinnedB) return pinnedB - pinnedA;
      return (b.lastMessageAt?.toMillis?.() || 0) - (a.lastMessageAt?.toMillis?.() || 0);
    });
  const archivedThreadsList = state.threads.filter(t => t.archivedFor && t.archivedFor[myUid]);

  const followNotifs = state.activity.filter(a => a.type === "follow");
  const likeCommentNotifs = state.activity.filter(a => a.type === "like" || a.type === "comment" || a.type === "follow_accept");
  const messageNotifs = state.activity.filter(a => a.type === "message");
  const followUnread = followNotifs.filter(a => !a.read).length;
  const activityUnread = likeCommentNotifs.filter(a => !a.read).length;
  const messageNotifUnread = messageNotifs.filter(a => !a.read).length;

  let storyPeople = state.allUsers.filter(u => (u.followers || []).includes(myUid) || (u.following || []).includes(myUid));
  storyPeople = storyPeople.sort((a, b) => (myPinned.includes(b.uid) ? 1 : 0) - (myPinned.includes(a.uid) ? 1 : 0)).slice(0, 12);

  const storiesHtml = `
    <div class="inbox-stories-row">
      <div class="inbox-story-item" id="storyCreateBtn">
        <div class="inbox-story-avatar-wrap"><div class="inbox-story-avatar create">+</div></div>
        <div class="inbox-story-label">${t("create")}</div>
      </div>
      ${storyPeople.map(u => `
        <div class="inbox-story-item" data-uid="${u.uid}">
          <div class="inbox-story-avatar-wrap">
            <div class="inbox-story-avatar">${u.avatar ? `<img src="${u.avatar}" />` : initials(u.name || t("userFallback"))}</div>
            ${myPinned.includes(u.uid) ? `<div class="inbox-story-pin-mark">📌</div>` : ""}
          </div>
          <div class="inbox-story-label">${escapeHtml((u.name || t("userFallback")).split(" ")[0])}</div>
        </div>
      `).join("")}
    </div>
  `;

  const lastFollow = followNotifs[0];
  const lastActivityItem = likeCommentNotifs[0];
  const lastMessageNotif = messageNotifs[0];
  const lastSystemNotice = state.systemNotices[0];
  const pendingFollowRequests = (state.myUserDoc && state.myUserDoc.followRequests) || [];
  const lastRequester = pendingFollowRequests.length ? (state.allUsers.find(u => u.uid === pendingFollowRequests[pendingFollowRequests.length - 1]) || null) : null;
  const followRequestsRowHtml = pendingFollowRequests.length ? `
    <div class="inbox-section-row" id="secFollowRequests">
      <div class="inbox-section-icon" style="background:#0F6E56">🔒</div>
      <div class="inbox-section-info">
        <div class="is-title">${t("followRequests")} (${pendingFollowRequests.length})</div>
        <div class="is-sub">${lastRequester ? `${escapeHtml(lastRequester.name || t("someone"))} ${t("wantsToFollowYou")}` : t("newRequestsToFollowYou")}</div>
      </div>
      <div class="inbox-section-chevron">›</div>
    </div>
  ` : "";
  const rowsHtml = `
    ${followRequestsRowHtml}
    <div class="inbox-section-row" id="secFollowers">
      <div class="inbox-section-icon" style="background:#2f8cf0">👥</div>
      <div class="inbox-section-info">
        <div class="is-title">${t("newFollowers")}${followUnread > 0 ? ` (${followUnread})` : ""}</div>
        <div class="is-sub">${lastFollow ? escapeHtml(lastFollow.text) : t("noNewFollowersYet")}</div>
      </div>
      <div class="inbox-section-chevron">›</div>
    </div>
    <div class="inbox-section-row" id="secActivity">
      <div class="inbox-section-icon" style="background:#e84393">❤️</div>
      <div class="inbox-section-info">
        <div class="is-title">${t("settingsActivity")}${activityUnread > 0 ? ` (${activityUnread})` : ""}</div>
        <div class="is-sub">${lastActivityItem ? escapeHtml(lastActivityItem.text) : t("noActivityYet")}</div>
      </div>
      <div class="inbox-section-chevron">›</div>
    </div>
    <div class="inbox-section-row" id="secRequests">
      <div class="inbox-section-icon" style="background:#5352ed">💬</div>
      <div class="inbox-section-info">
        <div class="is-title">${t("messageRequests")}${messageNotifUnread > 0 ? ` (${messageNotifUnread})` : ""}</div>
        <div class="is-sub">${lastMessageNotif ? escapeHtml(lastMessageNotif.text) : t("noNewMessages")}</div>
      </div>
      <div class="inbox-section-chevron">›</div>
    </div>
    <div class="inbox-section-row" id="secSystem">
      <div class="inbox-section-icon" style="background:#1e1e2e">📥</div>
      <div class="inbox-section-info">
        <div class="is-title">${t("systemNotifications")}</div>
        <div class="is-sub">${lastSystemNotice ? escapeHtml(lastSystemNotice.text) : t("creatorUpdatesAppNews")}</div>
      </div>
      <div class="inbox-section-chevron">›</div>
    </div>
    ${archivedThreadsList.length ? `
    <div class="inbox-section-row" id="secArchive">
      <div class="inbox-section-icon" style="background:#636e72">🗄️</div>
      <div class="inbox-section-info">
        <div class="is-title">${t("archivedChats")} (${archivedThreadsList.length})</div>
        <div class="is-sub">${t("archivedChatsSub")}</div>
      </div>
      <div class="inbox-section-chevron">›</div>
    </div>` : ""}
  `;

  const suggested = state.allUsers.filter(u => !(u.followers || []).includes(myUid)).slice(0, 6);
  const suggestedHtml = suggested.length ? `
    <div class="inbox-suggested-heading">${t("suggestedAccounts")}</div>
    ${suggested.map(u => {
      const isRequested = (u.followRequests || []).includes(myUid);
      return `
      <div class="user-row">
        <div class="avatar" id="sugavatar-${u.uid}">${u.avatar ? `<img src="${u.avatar}" />` : initials(u.name || t("userFallback"))}</div>
        <div class="user-row-info" id="suginfo-${u.uid}">
          <div class="u-name">${escapeHtml(u.name || t("userFallback"))}</div>
          <div class="u-handle">@${escapeHtml(u.handle || slugifyHandle(u.name || "user"))}</div>
        </div>
        <div class="user-row-actions">
          <button class="pill-btn ${isRequested ? "requested" : ""}" id="sugfollow-${u.uid}">${isRequested ? t("requested") : t("follow")}</button>
          <button class="pin-icon-btn" id="sugremove-${u.uid}" title="${t("remove")}">✕</button>
        </div>
      </div>
    `;
    }).join("")}
  ` : "";

  const threadsHtml = activeThreads.length
    ? activeThreads.map(t => renderThreadRow(t, myUid, myPinned)).join("")
    : `<div class="empty-nav-tab"><div class="big">💬</div><div class="line1">${t("noMessagesYet")}</div><div class="line2">${t("messageFromFriendsHint")}</div></div>`;

  const anyUnreadNotifs = state.activity.some(a => !a.read);
  root.innerHTML = `
    <div class="topbar">
      <div class="brand-sm" id="brandHomeBtn3">${t("navInbox")}</div>
      ${anyUnreadNotifs ? `<button class="mark-all-read-btn" id="markAllReadBtn">${t("markAllRead")}</button>` : ""}
    </div>
    ${storiesHtml}
    ${rowsHtml}
    <div class="thread-list">${threadsHtml}</div>
    ${suggestedHtml}
    <div style="height:16px"></div>
    ${renderBottomNav("inbox")}
  `;
  document.getElementById("brandHomeBtn3").onclick = () => setState({ view: "feed" });
  const markAllBtn = document.getElementById("markAllReadBtn");
  if (markAllBtn) markAllBtn.onclick = () => markNotificationsRead();
  document.getElementById("storyCreateBtn").onclick = openCameraScreen;
  document.querySelectorAll(".inbox-story-item[data-uid]").forEach(el => {
    el.onclick = () => openChat(el.dataset.uid);
  });

  const secFollowRequestsEl = document.getElementById("secFollowRequests");
  if (secFollowRequestsEl) secFollowRequestsEl.onclick = () => { markNotificationsRead("follow_request"); setState({ inboxSection: "followRequests" }); };
  document.getElementById("secFollowers").onclick = () => { markNotificationsRead("follow"); setState({ inboxSection: "followers" }); };
  document.getElementById("secActivity").onclick = () => { markNotificationsRead("like"); markNotificationsRead("comment"); markNotificationsRead("follow_accept"); setState({ inboxSection: "activity" }); };
  document.getElementById("secRequests").onclick = () => { markNotificationsRead("message"); setState({ inboxSection: "requests" }); };
  document.getElementById("secSystem").onclick = () => setState({ inboxSection: "system" });
  const secArchiveEl = document.getElementById("secArchive");
  if (secArchiveEl) secArchiveEl.onclick = () => setState({ inboxSection: "archive" });

  suggested.forEach(u => {
    const av = document.getElementById(`sugavatar-${u.uid}`);
    const info = document.getElementById(`suginfo-${u.uid}`);
    const followBtn = document.getElementById(`sugfollow-${u.uid}`);
    const removeBtn = document.getElementById(`sugremove-${u.uid}`);
    if (av) av.onclick = () => openProfile(u.uid);
    if (info) info.onclick = () => openProfile(u.uid);
    if (followBtn) followBtn.onclick = () => toggleFollowFromList(u.uid);
    if (removeBtn) removeBtn.onclick = () => setState({ allUsers: state.allUsers.filter(x => x.uid !== u.uid) });
  });

  activeThreads.forEach(t => {
    const row = document.getElementById(`thread-${t.id}`);
    const otherUid = (t.participants || []).find(p => p !== myUid);
    if (row) row.onclick = (e) => { if (e.target.closest(".thread-row-actions")) return; openChat(otherUid); };
    const pinBtn = document.getElementById(`pinthread-${t.id}`);
    if (pinBtn) pinBtn.onclick = () => togglePinFriend(otherUid);
  });

  wireBottomNav();
}

/* Sub-screens for each Inbox section (New followers / Activity / Message requests / System) */
function renderInboxSubScreen() {
  const myUid = state.user.uid;
  const section = state.inboxSection;
  let title = "";
  let bodyHtml = "";

  const followerRow = (a) => {
    const u = state.allUsers.find(x => x.uid === a.fromUid);
    const name = (u && u.name) || a.fromName || "User";
    const avatar = u && u.avatar;
    const amFollowingBack = u ? (u.followers || []).includes(myUid) : false;
    const mutuals = a.fromUid ? mutualFriendsWith(a.fromUid) : [];
    let subLine = "";
    if (mutuals.length > 0) {
      const shown = mutuals.slice(0, 3);
      const extra = mutuals.length - shown.length;
      subLine = `
        <div class="notif-mutual-line">
          <span>${t("friendsWith")}</span>
          <span class="notif-mutual-avatars">${shown.map(m => `<span>${m.avatar ? `<img src="${m.avatar}" />` : ""}</span>`).join("")}</span>
          ${extra > 0 ? `<span>+${extra}</span>` : ""}
        </div>`;
    } else if (!amFollowingBack) {
      subLine = `<div class="notif-suggest-tag">👥 People you may know</div>`;
    }
    return `
      <div class="inbox-section-row" data-uid="${a.fromUid || ""}" style="cursor:pointer;">
        <div class="notif-row-avatar">${avatar ? `<img src="${avatar}" />` : initials(name)}</div>
        <div class="inbox-section-info">
          <div class="notif-row-name">${escapeHtml(name)}</div>
          ${subLine}
          <div class="notif-row-sub">${a.type === "follow_accept" ? t("acceptedYourFollowRequestText") : t("startedFollowingYouText")} · ${timeAgoShort(a.createdAt)}</div>
        </div>
        ${a.fromUid ? (amFollowingBack
          ? `<button class="wave-btn" data-wave="${a.fromUid}">${t("sendWave")}</button>`
          : `<button class="followback-btn" data-followback="${a.fromUid}">${t("followBack")}</button>`) : ""}
      </div>
    `;
  };

  const activityRow = (a) => {
    const u = state.allUsers.find(x => x.uid === a.fromUid);
    const name = (u && u.name) || a.fromName || "User";
    const avatar = u && u.avatar;
    const badge = a.type === "like" ? "❤️" : "💬";
    // Tapping a like/comment notification jumps to the exact post (TikTok's own behavior),
    // so it carries the post's id and a small thumbnail instead of just a plain icon.
    const thumbHtml = a.thumb
      ? `<div class="notif-post-thumb">${a.thumb.startsWith("data:video") ? `<video src="${a.thumb}" muted></video>` : `<img src="${a.thumb}" />`}<span class="notif-thumb-badge">${badge}</span></div>`
      : `<div class="inbox-section-icon" style="width:30px;height:30px;font-size:14px;background:${a.type === "like" ? "var(--tiktok-red)" : "#5352ed"}">${badge}</div>`;
    return `
      <div class="inbox-section-row" data-uid="${a.fromUid || ""}" ${a.postId ? `data-post="${a.postId}"` : ""} style="cursor:pointer;">
        <div class="notif-row-avatar">${avatar ? `<img src="${avatar}" />` : initials(name)}</div>
        <div class="inbox-section-info">
          <div class="is-title">${escapeHtml(a.text)}</div>
          <div class="notif-row-sub">${timeAgoShort(a.createdAt)}</div>
        </div>
        ${thumbHtml}
      </div>
    `;
  };

  if (section === "followRequests") {
    title = t("followRequests");
    const pendingUids = (state.myUserDoc && state.myUserDoc.followRequests) || [];
    const requesters = pendingUids.map(uid => state.allUsers.find(u => u.uid === uid)).filter(Boolean);
    bodyHtml = requesters.length
      ? `<div class="thread-list">${requesters.map(u => {
          const mutuals = mutualFriendsWith(u.uid);
          let subLine = "";
          if (mutuals.length > 0) {
            const shown = mutuals.slice(0, 3);
            const extra = mutuals.length - shown.length;
            subLine = `
              <div class="notif-mutual-line">
                <span>${t("friendsWith")}</span>
                <span class="notif-mutual-avatars">${shown.map(m => `<span>${m.avatar ? `<img src="${m.avatar}" />` : ""}</span>`).join("")}</span>
                ${extra > 0 ? `<span>+${extra}</span>` : ""}
              </div>`;
          }
          return `
          <div class="inbox-section-row" data-uid="${u.uid}">
            <div class="notif-row-avatar" style="cursor:pointer;" data-open="${u.uid}">${u.avatar ? `<img src="${u.avatar}" />` : initials(u.name || "User")}</div>
            <div class="inbox-section-info" style="cursor:pointer;" data-open="${u.uid}">
              <div class="notif-row-name">${escapeHtml(u.name || "User")}</div>
              ${subLine}
              <div class="notif-row-sub">${t("wantsToFollowYou")}</div>
            </div>
            <div class="user-row-actions" style="flex-direction:column; gap:6px;">
              <button class="pill-btn" data-accept="${u.uid}">${t("accept")}</button>
              <button class="pill-btn ghost" data-decline="${u.uid}">${t("decline")}</button>
            </div>
          </div>
        `;
        }).join("")}</div>`
      : `<div class="empty-nav-tab"><div class="big">🔒</div><div class="line1">${t("noPendingRequests")}</div><div class="line2">${t("pendingRequestsHint")}</div></div>`;
  } else if (section === "followers") {
    title = t("newFollowers");
    const list = state.activity.filter(a => a.type === "follow");
    bodyHtml = list.length
      ? `<div class="thread-list">${list.map(followerRow).join("")}</div>`
      : `<div class="empty-nav-tab"><div class="big">👥</div><div class="line1">${t("noFollowersYet")}</div><div class="line2">${t("followersHint")}</div></div>`;
  } else if (section === "activity") {
    title = t("settingsActivity");
    const filter = state.activityFilter || "all";
    const likeCount = state.activity.filter(a => a.type === "like").length;
    const commentCount = state.activity.filter(a => a.type === "comment").length;
    // "follow_accept" (someone approved a request you sent) shows only under All, matching
    // TikTok: request approvals land in Activity, but new-follower notices stay in their own section.
    const filterList = filter === "like" ? state.activity.filter(a => a.type === "like")
      : filter === "comment" ? state.activity.filter(a => a.type === "comment")
      : state.activity.filter(a => a.type === "like" || a.type === "comment" || a.type === "follow_accept");
    const chipsHtml = `
      <div class="friends-sub-tabs">
        <button class="simple-tab ${filter === "all" ? "active" : ""}" data-activity-filter="all">${t("filterAll")}</button>
        <button class="simple-tab ${filter === "like" ? "active" : ""}" data-activity-filter="like">${t("filterLikes")}${likeCount ? ` (${likeCount})` : ""}</button>
        <button class="simple-tab ${filter === "comment" ? "active" : ""}" data-activity-filter="comment">${t("filterComments")}${commentCount ? ` (${commentCount})` : ""}</button>
      </div>
    `;
    const emptyText = filter === "like" ? { big: "❤️", l1: t("noLikesYet"), l2: t("likesHint") }
      : filter === "comment" ? { big: "💬", l1: t("noCommentsYet"), l2: t("commentsHint") }
      : { big: "🔔", l1: t("noActivityYet"), l2: t("activityHint") };
    bodyHtml = chipsHtml + (filterList.length
      ? `<div class="thread-list">${filterList.map(a => a.type === "follow_accept" ? followerRow(a) : activityRow(a)).join("")}</div>`
      : `<div class="empty-nav-tab"><div class="big">${emptyText.big}</div><div class="line1">${emptyText.l1}</div><div class="line2">${emptyText.l2}</div></div>`);
  } else if (section === "requests") {
    title = t("messageRequests");
    const list = state.activity.filter(a => a.type === "message");
    bodyHtml = list.length
      ? `<div class="thread-list">${list.map(a => `
          <div class="inbox-section-row" id="msgnotif-${a.id}" style="cursor:pointer;">
            <div class="inbox-section-icon" style="background:#5352ed">💬</div>
            <div class="inbox-section-info"><div class="is-title">${escapeHtml(a.text)}</div></div>
          </div>
        `).join("")}</div>`
      : `<div class="empty-nav-tab"><div class="big">💬</div><div class="line1">${t("noNewMessages")}</div><div class="line2">${t("newChatsHint")}</div></div>`;
  } else if (section === "system") {
    title = t("systemNotifications");
    const notices = state.systemNotices;
    const composerHtml = isOwnerAccount() ? `
      <div style="padding:14px;">
        <textarea id="ownerNoticeInput" rows="3" placeholder="${t("writeNoticePlaceholder")}" style="width:100%; padding:12px 14px; border:1px solid var(--line); border-radius:10px; font-size:14px; font-family:inherit; background:var(--card); color:var(--ink); resize:vertical;">${escapeHtml(state.ownerNoticeText)}</textarea>
        <button class="btn-primary" id="sendOwnerNoticeBtn" style="margin-top:8px;">${t("sendToEveryone")}</button>
      </div>
    ` : "";
    bodyHtml = `
      ${composerHtml}
      <div class="thread-list">
        <div class="inbox-section-row">
          <div class="inbox-section-icon" style="background:#1e1e2e">📥</div>
          <div class="inbox-section-info">
            <div class="is-title">${t("welcomeToMilon")}</div>
            <div class="is-sub">${t("welcomeToMilonSub")}</div>
          </div>
        </div>
        ${notices.map(n => `
          <div class="inbox-section-row">
            <div class="inbox-section-icon" style="background:#1e1e2e">📥</div>
            <div class="inbox-section-info">
              <div class="is-title">${escapeHtml(n.text)}</div>
              <div class="is-sub">${timeAgo(n.createdAt)}</div>
            </div>
          </div>
        `).join("")}
      </div>
    `;
  } else if (section === "archive") {
    title = t("archivedChats");
    const list = state.threads.filter(t => t.archivedFor && t.archivedFor[myUid]);
    bodyHtml = list.length
      ? `<div class="thread-list">${list.map(t => {
          const otherUid = (t.participants || []).find(p => p !== myUid);
          const otherInfo = (t.participantInfo && t.participantInfo[otherUid]) || { name: t("userFallback"), avatar: null };
          return `
          <div class="inbox-section-row" id="archrow-${t.id}" style="cursor:pointer;">
            <div class="notif-row-avatar" data-open="${otherUid}">${otherInfo.avatar ? `<img src="${otherInfo.avatar}" />` : initials(otherInfo.name)}</div>
            <div class="inbox-section-info" data-open="${otherUid}">
              <div class="notif-row-name">${escapeHtml(otherInfo.name)}</div>
              <div class="notif-row-sub">${escapeHtml(t.lastMessage || "")}</div>
            </div>
            <div class="user-row-actions" style="flex-direction:column; gap:6px;">
              <button class="pill-btn" data-unarchive="${t.id}">${t("unarchive")}</button>
              <button class="pill-btn ghost" data-delete-archived="${t.id}">${t("deleteBtn")}</button>
            </div>
          </div>`;
        }).join("")}</div>`
      : `<div class="empty-nav-tab"><div class="big">🗄️</div><div class="line1">${t("noArchivedChats")}</div><div class="line2">${t("archivedChatsHint2")}</div></div>`;
  }

  const sectionTypeMap = {
    followers: ["follow"],
    activity: ["like", "comment", "follow_accept"],
    requests: ["message"],
    followRequests: [],
    system: []
  };
  const sectionMarkTypes = sectionTypeMap[section] || [];
  const sectionUnread = state.activity.filter(a => sectionMarkTypes.includes(a.type) && !a.read).length;

  root.innerHTML = `
    <div class="back-row">
      <button class="profile-back-btn" id="inboxSubBackBtn">←</button>
      <div class="back-title">${title}</div>
      ${sectionUnread > 0 ? `<button class="mark-all-read-btn" id="markSectionReadBtn">${t("markAllRead")}</button>` : ""}
    </div>
    ${bodyHtml}
    ${renderBottomNav("inbox")}
  `;
  document.getElementById("inboxSubBackBtn").onclick = () => setState({ inboxSection: null });
  const markSectionBtn = document.getElementById("markSectionReadBtn");
  if (markSectionBtn) markSectionBtn.onclick = () => sectionMarkTypes.forEach(t => markNotificationsRead(t));

  if (section === "followRequests") {
    document.querySelectorAll("[data-accept]").forEach(btn => {
      btn.onclick = (e) => { e.stopPropagation(); acceptFollowRequest(btn.dataset.accept); };
    });
    document.querySelectorAll("[data-decline]").forEach(btn => {
      btn.onclick = (e) => { e.stopPropagation(); declineFollowRequest(btn.dataset.decline); };
    });
    document.querySelectorAll("[data-open]").forEach(el => {
      el.onclick = (e) => { e.stopPropagation(); openProfile(el.dataset.open); };
    });
  } else if (section === "followers" || section === "activity") {
    document.querySelectorAll("[data-activity-filter]").forEach(btn => {
      btn.onclick = () => setState({ activityFilter: btn.dataset.activityFilter });
    });
    document.querySelectorAll(".followback-btn").forEach(btn => {
      btn.onclick = (e) => { e.stopPropagation(); toggleFollowFromList(btn.dataset.followback); };
    });
    document.querySelectorAll(".wave-btn").forEach(btn => {
      btn.onclick = (e) => { e.stopPropagation(); sendWaveTo(btn.dataset.wave); };
    });
    document.querySelectorAll(".inbox-section-row").forEach(row => {
      // Like/comment rows carry the post id, so they open that exact post; everything else
      // (new followers, approved follow requests) still opens the person's profile.
      if (row.dataset.post) row.onclick = () => openPostViewer(row.dataset.post);
      else if (row.dataset.uid) row.onclick = () => openProfile(row.dataset.uid);
    });
  } else if (section === "requests") {
    state.activity.filter(a => a.type === "message").forEach(a => {
      const row = document.getElementById(`msgnotif-${a.id}`);
      if (row) row.onclick = () => openMessageRequestPreview(a.fromUid, a.id);
    });
  } else if (section === "system" && isOwnerAccount()) {
    const input = document.getElementById("ownerNoticeInput");
    if (input) input.oninput = (e) => { state.ownerNoticeText = e.target.value; };
    const sendBtn = document.getElementById("sendOwnerNoticeBtn");
    if (sendBtn) sendBtn.onclick = sendSystemNotice;
  } else if (section === "archive") {
    document.querySelectorAll(".inbox-section-row[id^='archrow-'] [data-open]").forEach(el => {
      el.onclick = (e) => { e.stopPropagation(); openProfile(el.dataset.open); };
    });
    document.querySelectorAll("[data-unarchive]").forEach(btn => {
      btn.onclick = (e) => { e.stopPropagation(); unarchiveThread(btn.dataset.unarchive); };
    });
    document.querySelectorAll("[data-delete-archived]").forEach(btn => {
      btn.onclick = (e) => { e.stopPropagation(); deleteArchivedThread(btn.dataset.deleteArchived); };
    });
  }

  wireBottomNav();
}

function renderThreadRow(thread, myUid, myPinned) {
  const otherUid = (thread.participants || []).find(p => p !== myUid);
  const otherInfo = (thread.participantInfo && thread.participantInfo[otherUid]) || { name: t("userFallback"), avatar: null };
  const unread = (thread.unread && thread.unread[myUid]) || 0;
  const isPinned = (myPinned || []).includes(otherUid);
  const online = isUserOnline(otherUid);
  return `
    <div class="thread-row ${unread > 0 ? "unread" : ""}" id="thread-${thread.id}">
      <div class="avatar">${otherInfo.avatar ? `<img src="${otherInfo.avatar}" />` : initials(otherInfo.name)}${online ? `<span class="presence-dot"></span>` : ""}</div>
      <div class="thread-info">
        <div class="t-name">${escapeHtml(otherInfo.name)} ${isPinned ? `<span class="pin-flag">📌</span>` : ""}</div>
        <div class="t-preview">${escapeHtml(thread.lastMessage || "")}</div>
      </div>
      ${unread > 0 ? `<div class="thread-unread-dot"></div>` : ""}
      <div class="thread-row-actions">
        <button class="pin-icon-btn ${isPinned ? "pinned" : ""}" id="pinthread-${thread.id}" title="${t("pin")}">📌</button>
      </div>
      <div class="thread-time">${timeAgo(thread.lastMessageAt)}</div>
    </div>
  `;
}

/* ---------------- Chat screen ---------------- */
let unsubscribeChat = null;
let unsubscribeChatPresence = null;
let unsubscribeRequestPreview = null;

/* Message request preview: shows the incoming conversation read-only, with Accept /
   Delete actions, instead of tapping a "Message requests" row dropping straight into
   a full composable chat (matches TikTok's request-preview flow). */
function openMessageRequestPreview(otherUid, notifId) {
  if (!otherUid) return;
  const myUid = state.user.uid;
  const threadId = threadIdFor(myUid, otherUid);

  db.collection("users").doc(otherUid).get().then((doc) => {
    const previewProfile = doc.exists ? doc.data() : { name: t("userFallback"), avatar: null };
    setState({
      view: "requestPreview",
      requestPreviewUid: otherUid,
      requestPreviewProfile: previewProfile,
      requestPreviewMessages: [],
      requestPreviewNotifId: notifId || null
    });

    if (unsubscribeRequestPreview) unsubscribeRequestPreview();
    unsubscribeRequestPreview = db.collection("threads").doc(threadId).collection("messages")
      .orderBy("createdAt", "asc")
      .limit(200)
      .onSnapshot((snap) => {
        state.requestPreviewMessages = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        render();
      }, (err) => console.error(err));
  }).catch((err) => {
    console.error(err);
    showToast(t("couldntOpenRequest"));
  });
}

function closeRequestPreview(nextView) {
  if (unsubscribeRequestPreview) unsubscribeRequestPreview();
  setState({ view: nextView || "inbox", requestPreviewUid: null, requestPreviewProfile: null, requestPreviewMessages: [], requestPreviewNotifId: null });
}

/* Accept: marks the request notification read and drops into the real, composable chat. */
function acceptMessageRequest() {
  const otherUid = state.requestPreviewUid;
  const notifId = state.requestPreviewNotifId;
  if (!otherUid) return;
  if (notifId) {
    db.collection("users").doc(state.user.uid).collection("notifications").doc(notifId)
      .update({ read: true }).catch((err) => console.error(err));
  }
  if (unsubscribeRequestPreview) unsubscribeRequestPreview();
  setState({ requestPreviewUid: null, requestPreviewProfile: null, requestPreviewMessages: [], requestPreviewNotifId: null });
  openChat(otherUid);
}

/* Delete (from the request preview): matches TikTok — this does NOT permanently wipe the
   thread. It archives it (archivedFor[myUid] = true), so it drops out of both the main
   inbox list and the Message requests list, but the conversation itself and its messages
   are preserved and recoverable from "Archived chats". Only "Delete" inside Archived chats
   is actually permanent (see deleteArchivedThread below). */
function declineMessageRequest() {
  const otherUid = state.requestPreviewUid;
  const notifId = state.requestPreviewNotifId;
  const myUid = state.user.uid;
  if (!otherUid) return;
  const threadId = threadIdFor(myUid, otherUid);
  const threadRef = db.collection("threads").doc(threadId);
  const batch = db.batch();
  batch.set(threadRef, { archivedFor: { [myUid]: true } }, { merge: true });
  if (notifId) batch.delete(db.collection("users").doc(myUid).collection("notifications").doc(notifId));
  batch.commit().then(() => {
    closeRequestPreview("inbox");
    setState({ inboxSection: "requests" });
    showToast(t("requestArchived"));
  }).catch((err) => {
    console.error(err);
    showToast(t("couldntArchiveRequest"));
  });
}

/* Restore an archived chat back into the normal inbox list. */
function unarchiveThread(threadId) {
  const myUid = state.user.uid;
  if (!threadId) return;
  db.collection("threads").doc(threadId).set({ archivedFor: { [myUid]: false } }, { merge: true })
    .then(() => showToast(t("chatUnarchived")))
    .catch((err) => { console.error(err); showToast(t("couldntUnarchiveChat")); });
}

/* Permanently deletes an archived thread and its messages — the only place in the app
   that actually destroys a conversation, matching TikTok's Archived-chats "Delete". */
function deleteArchivedThread(threadId) {
  if (!threadId) return;
  const threadRef = db.collection("threads").doc(threadId);
  threadRef.collection("messages").get().then((snap) => {
    const batch = db.batch();
    snap.docs.forEach(d => batch.delete(d.ref));
    batch.delete(threadRef);
    return batch.commit();
  }).then(() => {
    showToast(t("chatDeleted"));
  }).catch((err) => {
    console.error(err);
    showToast(t("couldntDeleteChat"));
  });
}

function renderRequestPreviewScreen() {
  const other = state.requestPreviewProfile || {};
  const bubblesHtml = state.requestPreviewMessages.map(m => `
    <div class="chat-bubble ${m.senderUid === state.user.uid ? "mine" : "theirs"}">
      ${m.image ? `<img src="${m.image}" />` : ""}
      ${m.video ? `<video src="${m.video}" controls></video>` : ""}
      ${m.audio ? `<audio src="${m.audio}" controls></audio>` : ""}
      ${m.text ? `<div class="${(m.image || m.video) ? "bubble-text-with-image" : ""}">${escapeHtml(m.text)}</div>` : ""}
    </div>
  `).join("");

  root.innerHTML = `
    <div class="back-row">
      <button class="profile-back-btn" id="reqPreviewBackBtn">←</button>
      <div class="back-title">${escapeHtml(other.name || t("messageRequestTitle"))}</div>
    </div>
    <div class="chat-messages" style="padding-bottom:14px;">
      ${bubblesHtml || `<div class="empty-nav-tab"><div class="big">💬</div><div class="line1">${t("noMessagesYetChat")}</div></div>`}
    </div>
    <div style="display:flex; gap:10px; padding:14px; border-top:1px solid var(--line);">
      <button class="btn-primary" id="reqPreviewDeleteBtn" style="flex:1; width:auto; margin-top:0; background:var(--card); color:var(--ink); border:1px solid var(--line);">${t("deleteBtn")}</button>
      <button class="btn-primary" id="reqPreviewAcceptBtn" style="flex:1; width:auto; margin-top:0;">${t("accept")}</button>
    </div>
  `;
  document.getElementById("reqPreviewBackBtn").onclick = () => closeRequestPreview("inbox");
  document.getElementById("reqPreviewAcceptBtn").onclick = acceptMessageRequest;

}
function openChat(otherUid) {
  if (!otherUid) return;
  if (isBlockedEitherWay(otherUid)) { showToast(t("cantMessageAccount")); return; }
  if (!canMessage(otherUid, state.user.uid)) {
    const other = findCachedUser(otherUid);
    const tier = other && other.dmPrivacy;
    showToast(tier === "noone" ? t("dmNotAccepting") : t("dmFriendsOnly"));
    return;
  }
  const myUid = state.user.uid;
  const threadId = threadIdFor(myUid, otherUid);

  db.collection("users").doc(otherUid).get().then((doc) => {
    const chatProfile = doc.exists ? doc.data() : { name: t("userFallback"), avatar: null };
    setState({ view: "chat", chatUid: otherUid, chatProfile, chatMessages: [], chatText: "", chatMedia: null });

    // Mark this thread read for me now that I've opened it
    db.collection("threads").doc(threadId).set({
      [`unread.${myUid}`]: 0
    }, { merge: true }).catch((err) => console.error(err));

    if (unsubscribeChat) unsubscribeChat();
    unsubscribeChat = db.collection("threads").doc(threadId).collection("messages")
      .orderBy("createdAt", "asc")
      .limit(200)
      .onSnapshot((snap) => {
        state.chatMessages = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        render();
        const box = document.getElementById("chatMessagesBox");
        if (box) box.scrollTop = box.scrollHeight;
        // Mark any of the other person's messages as seen by me
        markMessagesSeen(threadId, myUid);
      }, (err) => console.error(err));

    if (unsubscribeChatPresence) unsubscribeChatPresence();
    unsubscribeChatPresence = db.collection("presence").doc(otherUid).onSnapshot((doc) => {
      state.chatOtherPresence = doc.exists ? doc.data() : null;
      render();
    }, (err) => console.error(err));
  }).catch((err) => {
    console.error(err);
    showToast(t("couldntOpenChat"));
  });
}

/* Marks all of the other participant's messages in this thread as seen by me, in real time */
function markMessagesSeen(threadId, myUid) {
  const unseen = state.chatMessages.filter(m => m.senderUid !== myUid && !m.seenBy);
  unseen.forEach(m => {
    db.collection("threads").doc(threadId).collection("messages").doc(m.id).update({ seenBy: myUid }).catch(() => {});
  });
}

const CHAT_QUICK_REACTIONS = ["❤️", "😂", "👍", "👉", "🐾"]; // last one stands in for a "Streak Pet" style reaction

function chatPresenceLabel() {
  const p = state.chatOtherPresence;
  if (p && p.online) return t("activeNow");
  if (p && p.lastSeenAt && p.lastSeenAt.toDate) return `${t("activePrefix")} ${timeAgo(p.lastSeenAt)}`;
  return "";
}

function renderChatScreen() {
  const myUid = state.user.uid;
  const other = state.chatProfile || {};
  const lastMineIdx = (() => {
    for (let i = state.chatMessages.length - 1; i >= 0; i--) {

    }
    return -1;
  })();

  const bubblesHtml = state.chatMessages.map((m, idx) => {
    const isReactionOnly = m.reaction && !m.text && !m.image && !m.video && !m.audio;
    const showSeen = idx === lastMineIdx && m.senderUid === myUid && m.seenBy === state.chatUid;
    return `
    <div class="chat-bubble ${isReactionOnly ? "reaction-only" : ""} ${m.senderUid === myUid ? "mine" : "theirs"}">
      ${m.image ? `<img src="${m.image}" />` : ""}
      ${m.video ? `<video src="${m.video}" controls></video>` : ""}
      ${m.audio ? `<audio src="${m.audio}" controls></audio>` : ""}
      ${m.text ? `<div class="${(m.image || m.video) ? "bubble-text-with-image" : ""}">${escapeHtml(m.text)}</div>` : ""}
    </div>
    ${showSeen ? `<div class="chat-seen-label">${t("seenLabel")}</div>` : ""}
  `;
  }).join("");

  const presenceLabel = chatPresenceLabel();
  const hasContent = !!(state.chatText.trim() || state.chatMedia);
  const wallpaperKey = ((state.myUserDoc && state.myUserDoc.settings) || getCachedSettings()).chatWallpaper || "default";

  root.innerHTML = `
    <div class="chat-header">
      <button class="profile-back-btn" id="chatBackBtn">←</button>
      <div class="avatar" id="chatHeaderAvatar">${other.avatar ? `<img src="${other.avatar}" />` : initials(other.name || t("userFallback"))}${state.chatOtherPresence && state.chatOtherPresence.online ? `<span class="presence-dot"></span>` : ""}</div>
      <div class="chat-header-info">

    <div class="chat-input-bar">
      ${!hasContent ? `
      <div class="chat-reaction-row">
        ${CHAT_QUICK_REACTIONS.map(r => `<button class="chat-reaction-btn" data-r="${r}">${r}</button>`).join("")}
      </div>` : ""}
      ${(state.chatStickerPanelOpen && !hasContent) ? `
        <div class="chat-sticker-panel">
          ${["🎉","🔥","😍","👏","😢","😮","🙌","💯"].map(s => `<button data-s="${s}">${s}</button>`).join("")}
        </div>
      ` : ""}
      ${state.chatMedia ? `
        <div class="chat-media-preview">
          ${state.chatMediaType === "video" ? `<video src="${state.chatMedia}" style="width:54px;height:54px;object-fit:cover;border-radius:8px;"></video>` : `<img src="${state.chatMedia}" />`}
          <button class="chat-media-remove" id="removeChatMediaBtn">✕</button>
        </div>` : ""}
      <div class="chat-input-row">
        ${!hasContent ? `
        <label class="chat-image-btn" title="${t("photoVideoFromGallery")}">
          🖼️
          <input type="file" accept="image/*,video/*" id="chatGalleryInput" style="display:none" />
        </label>` : ""}
        <input id="chatInput" type="text" placeholder="${t("messagePlaceholder")}" value="${escapeHtml(state.chatText)}" />
        ${!hasContent ? `<button class="chat-image-btn" id="chatStickerBtn" title="${t("stickersLabel")}">😊</button>` : ""}
        ${!hasContent ? `<button class="chat-image-btn chat-mic-btn ${state.chatRecordingVoice ? "recording" : ""}" id="chatMicBtn" title="${t("voiceMessageTitle")}">${state.chatRecordingVoice ? "⏹" : "🎤"}</button>` : ""}

  document.getElementById("chatHeaderAvatar").onclick = () => openProfile(state.chatUid);

    if (unsubscribeChat) unsubscribeChat();
    if (unsubscribeChatPresence) unsubscribeChatPresence();
    setState({ view: "inbox", chatStickerPanelOpen: false });
  };
  const input = document.getElementById("chatInput");
  input.oninput = (e) => {
    const prevHasContent = !!(state.chatText.trim() || state.chatMedia);
    state.chatText = e.target.value;
    const nowHasContent = !!(state.chatText.trim() || state.chatMedia);
    if (prevHasContent !== nowHasContent) {
      // Layout changes (icons <-> send button) only at this boundary, so re-render here
      // and restore focus/cursor — re-rendering on every keystroke would steal focus.
      const caretPos = e.target.selectionStart;
      render();
      const newInput = document.getElementById("chatInput");
      if (newInput) {
        newInput.focus();
        newInput.setSelectionRange(caretPos, caretPos);

    } else {

      if (sendBtn) sendBtn.disabled = !nowHasContent;

  input.onkeydown = (e) => { if (e.key === "Enter") sendChatMessage(); };
  const sendBtn = document.getElementById("chatSendBtn");

  if (galleryInput) galleryInput.onchange = handleChatMediaSelect;

  const box = document.getElementById("chatMessagesBox");
  if (box) box.scrollTop = box.scrollHeight;
}

function handleChatMediaSelect(e) {
  const file = e.target.files[0];
  if (!file) return;
  if (!isAllowedMediaFile(file)) {
    showToast(t("fileTypeNotSupported"));
    e.target.value = "";
    return;
  }
  const isVideo = file.type.startsWith("video/");
  if (isVideo) {
    fileToDataUrl(file, (dataUrl) => setState({ chatMedia: dataUrl, chatMediaType: "video" }));
  } else {
    compressImageToDataUrl(file, { maxDim: 700, quality: 0.65 }, (compressed) => setState({ chatMedia: compressed, chatMediaType: "image" }));
  }
}

/* Quick emoji reaction (heart/laugh/thumbs-up/point/Streak Pet, or a sticker) sent as its own message */
function sendReactionMessage(emoji) {
  if (!state.chatUid) return;
  const myUid = state.user.uid;
  const otherUid = state.chatUid;
  const threadId = threadIdFor(myUid, otherUid);
  const threadRef = db.collection("threads").doc(threadId);
  setState({ chatStickerPanelOpen: false });
  threadRef.set({
    participants: [myUid, otherUid],
    participantInfo: {
      [myUid]: { name: state.user.name, avatar: (state.profile && state.profile.avatar) || null },
      [otherUid]: { name: (state.chatProfile && state.chatProfile.name) || t("userFallback"), avatar: (state.chatProfile && state.chatProfile.avatar) || null }
    },
    lastMessage: emoji,
    lastMessageAt: firebase.firestore.FieldValue.serverTimestamp(),
    [`unread.${otherUid}`]: firebase.firestore.FieldValue.increment(1),
    [`unread.${myUid}`]: 0
  }, { merge: true }).then(() => {
    return threadRef.collection("messages").add({
      senderUid: myUid,
      reaction: emoji,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
  }).catch((err) => {
    console.error(err);
    showToast(t("couldntSend"));
  });
}

/* Voice message recording via the mic button */
let voiceRecorderRef = null;
let voiceChunksRef = [];
let voiceTimerRef = null;
function startVoiceRecording() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    showToast(t("micNotAvailable"));
    return;
  }
  navigator.mediaDevices.getUserMedia({ audio: true }).then((stream) => {
    voiceChunksRef = [];
    voiceRecorderRef = new MediaRecorder(stream);
    voiceRecorderRef.ondataavailable = (e) => { if (e.data && e.data.size > 0) voiceChunksRef.push(e.data); };
    voiceRecorderRef.onstop = () => {
      stream.getTracks().forEach(t => t.stop());
      const blob = new Blob(voiceChunksRef, { type: "audio/webm" });
      const reader = new FileReader();
      reader.onload = () => sendVoiceMessage(reader.result);
      reader.readAsDataURL(blob);
    };
    voiceRecorderRef.start();
    state.chatRecordingVoice = true;
    state.chatVoiceSeconds = 0;
    render();
    voiceTimerRef = setInterval(() => {
      state.chatVoiceSeconds += 1;
      if (state.chatVoiceSeconds >= 60) stopVoiceRecording(); // 60s cap per voice note
    }, 1000);
  }).catch((err) => {
    console.error(err);
    showToast(t("couldntAccessMic"));
  });
}

function stopVoiceRecording() {
  if (voiceRecorderRef && voiceRecorderRef.state !== "inactive") voiceRecorderRef.stop();
  if (voiceTimerRef) { clearInterval(voiceTimerRef); voiceTimerRef = null; }
  state.chatRecordingVoice = false;
  render();
}

function sendVoiceMessage(audioDataUrl) {
  if (!state.chatUid) return;
  const myUid = state.user.uid;
  const otherUid = state.chatUid;
  const threadId = threadIdFor(myUid, otherUid);
  const threadRef = db.collection("threads").doc(threadId);
  threadRef.set({
    participants: [myUid, otherUid],
    participantInfo: {
      [myUid]: { name: state.user.name, avatar: (state.profile && state.profile.avatar) || null },
      [otherUid]: { name: (state.chatProfile && state.chatProfile.name) || t("userFallback"), avatar: (state.chatProfile && state.chatProfile.avatar) || null }
    },
    lastMessage: "🎤 " + t("voiceMessageLabel"),
    lastMessageAt: firebase.firestore.FieldValue.serverTimestamp(),
    [`unread.${otherUid}`]: firebase.firestore.FieldValue.increment(1),
    [`unread.${myUid}`]: 0
  }, { merge: true }).then(() => {
    return threadRef.collection("messages").add({
      senderUid: myUid,
      audio: audioDataUrl,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
  }).catch((err) => {
    console.error(err);
    showToast(t("couldntSendVoice"));
  });
}

function sendChatMessage() {
  const text = state.chatText.trim();
  const media = state.chatMedia;
  const mediaType = state.chatMediaType;
  if (!text && !media) return;
  if (!state.chatUid) return;
  if (isBlockedEitherWay(state.chatUid)) { showToast(t("cantMessageAccount")); return; }
  const myUid = state.user.uid;
  const otherUid = state.chatUid;
  const threadId = threadIdFor(myUid, otherUid);
  const threadRef = db.collection("threads").doc(threadId);

  state.chatText = "";
  state.chatMedia = null;
  state.chatMediaType = null;
  render();

  threadRef.get().then((threadDoc) => {
    const isNewThread = !threadDoc.exists;
    // Create/update the thread doc FIRST (with participants set), then write the message.
    // If Firestore rules check the thread's participants before allowing a message write,
    // doing it in this order means a brand-new conversation's first message won't be blocked.
    return threadRef.set({
      participants: [myUid, otherUid],
      participantInfo: {
        [myUid]: { name: state.user.name, avatar: (state.profile && state.profile.avatar) || null },
        [otherUid]: { name: (state.chatProfile && state.chatProfile.name) || t("userFallback"), avatar: (state.chatProfile && state.chatProfile.avatar) || null }
      },
      lastMessage: text || (mediaType === "video" ? "🎬 " + t("video") : "📷 " + t("photo")),
      lastMessageAt: firebase.firestore.FieldValue.serverTimestamp(),
      [`unread.${otherUid}`]: firebase.firestore.FieldValue.increment(1),
      [`unread.${myUid}`]: 0
    }, { merge: true }).then(() => {
      return threadRef.collection("messages").add({
        senderUid: myUid,
        text: text,
        image: mediaType === "image" ? media : null,
        video: mediaType === "video" ? media : null,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
    }).then(() => {
      if (isNewThread) logActivity(otherUid, "message", `${state.user.name} started a conversation with you`);
    });
  }).catch((err) => {
    console.error(err);
    showToast(t("couldntSendMessage"));
  });
}

/* ================= Profile screen ================= */
function openProfile(targetUid) {
  const uid = targetUid || state.user.uid;
  const isOwn = uid === state.user.uid;
  const ref = db.collection("users").doc(uid);

  ref.get().then((doc) => {
    const data = doc.exists ? doc.data() : { name: isOwn ? state.user.name : t("userFallback"), handle: slugifyHandle(isOwn ? state.user.name : "user"), bio: "", avatar: null, followers: [], following: [], followRequests: [], private: false, pinnedPosts: [] };

    if (isOwn) {
      setState({ view: "profile", viewingUid: null, profile: { uid, ...data }, profileTab: "posts" });
      listenToProfileUser(uid);
      return;
    }

    // Viewing someone else's profile: fetch only their public posts
    db.collection("posts").where("authorUid", "==", uid).get().then((snap) => {
      const posts = snap.docs
        .map(d => ({ id: d.id, ...d.data() }))
        .filter(p => (!p.privacy || p.privacy === "public") && !p.hidden)
        .sort((a, b) => (b.createdAt?.toMillis?.() || 0) - (a.createdAt?.toMillis?.() || 0));
      setState({ view: "profile", viewingUid: uid, profile: { uid, ...data }, profileTab: "posts", viewingPosts: posts });
      listenToProfileUser(uid);
    }).catch((err) => {
      console.error(err);
      setState({ view: "profile", viewingUid: uid, profile: { uid, ...data }, profileTab: "posts", viewingPosts: [] });
      listenToProfileUser(uid);
    });
  }).catch((err) => {
    console.error(err);
    showToast(t("couldntLoadProfile"));
  });
}

/* Follow / unfollow / request from the profile screen's follow button — same
   private-account-aware model as toggleFollowFromList. */
function toggleFollow(targetUid) {
  const myUid = state.user.uid;
  const profile = state.profile || {};
  const amFollowing = (profile.followers || []).includes(myUid);
  const isRequested = !amFollowing && (profile.followRequests || []).includes(myUid);
  const targetRef = db.collection("users").doc(targetUid);
  const myRef = db.collection("users").doc(myUid);
  const batch = db.batch();

  if (amFollowing) {
    batch.update(targetRef, { followers: firebase.firestore.FieldValue.arrayRemove(myUid) });
    batch.update(myRef, { following: firebase.firestore.FieldValue.arrayRemove(targetUid) });
  } else if (isRequested) {
    batch.update(targetRef, { followRequests: firebase.firestore.FieldValue.arrayRemove(myUid) });
  } else if (profile.private) {
    batch.update(targetRef, { followRequests: firebase.firestore.FieldValue.arrayUnion(myUid) });
  } else {
    batch.update(targetRef, { followers: firebase.firestore.FieldValue.arrayUnion(myUid) });
    batch.update(myRef, { following: firebase.firestore.FieldValue.arrayUnion(targetUid) });
  }

  batch.commit().then(() => {
    if (!amFollowing && !isRequested) {
      if (profile.private) {
        logActivity(targetUid, "follow_request", `${state.user.name} requested to follow you`);
      } else {
        logActivity(targetUid, "follow", `${state.user.name} started following you`);
      }
    }
    // No need to manually reload — listenToProfileUser's real-time listener will refresh state.profile
  }).catch((err) => {
    console.error(err);
    showToast(t("couldntUpdateFollowStatus"));
  });
}

function renderProfileScreen() {
  const profile = state.profile || {};
  const isOwn = !state.viewingUid || state.viewingUid === state.user.uid;
  const targetUid = isOwn ? state.user.uid : state.viewingUid;
  const pinnedPosts = profile.pinnedPosts || [];

  const myPosts = isOwn ? state.posts.filter(p => p.authorUid === targetUid) : state.viewingPosts;

  let publicPosts = myPosts.filter(p => !p.privacy || p.privacy === "public");
  // Pinned posts float to the top in the order they were pinned (index 0 = most recently
  // pinned = leftmost), matching TikTok; unpinned posts keep their existing relative order.
  publicPosts = [...publicPosts].sort((a, b) => {
    const ai = pinnedPosts.indexOf(a.id);
    const bi = pinnedPosts.indexOf(b.id);
    if (ai === -1 && bi === -1) return 0;
    if (ai === -1) return 1;
    if (bi === -1) return -1;
    return ai - bi;
  });
  const privatePosts = isOwn ? myPosts.filter(p => p.privacy && p.privacy !== "public") : [];
  const repostedPosts = isOwn ? state.posts.filter(p => (p.reposts || []).includes(targetUid)) : [];
  const savedPosts = isOwn ? state.posts.filter(p => (p.savedBy || []).includes(targetUid)) : [];
  const canViewLikes = isOwn || canSeeLikedVideos(targetUid, state.user.uid);
  const likedPosts = canViewLikes ? state.posts.filter(p => (p.likes || []).includes(targetUid)) : [];

  const totalLikesReceived = publicPosts.concat(privatePosts).reduce((sum, p) => sum + ((p.likes || []).length), 0);
  const followers = (profile.followers || []).length;
  const following = (profile.following || []).length;
  const amFollowing = !isOwn && (profile.followers || []).includes(state.user.uid);
  const theyFollowMe = !isOwn && (profile.following || []).includes(state.user.uid);

  const tabConfig = {

    saved: { list: savedPosts, empty1: t("nothingSavedYet"), empty2: t("savedHint"), cta: false },

    : (activeTab.list.length

  const linksHtml = (profile.youtubeLink || profile.facebookLink) ? `
    <div class="profile-links">
      ${profile.youtubeLink ? `<a class="profile-link-chip" href="${escapeHtml(profile.youtubeLink)}" target="_blank" rel="noopener">▶ YouTube</a>` : ""}
      ${profile.facebookLink ? `<a class="profile-link-chip" href="${escapeHtml(profile.facebookLink)}" target="_blank" rel="noopener">f Facebook</a>` : ""}

/* Simple full-post viewer opened from a profile grid thumbnail (own post) */
function openPostViewer(postId) {
  const post = state.posts.find(p => p.id === postId) || (state.viewingPosts || []).find(p => p.id === postId);
