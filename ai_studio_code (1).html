<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0F6E56">
<link rel="apple-touch-icon" href="icons/milon-icon-180.png">

<title>Milon — Social App</title>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  :root {
    --bg: #F6F3EC;
    --card: #FFFFFF;
    --ink: #262420;
    --ink-soft: #6B6860;
    --line: #E4E0D5;
    --teal: #0F6E56;
    --teal-deep: #085041;
    --coral: #D85A30;
    --coral-soft: #FAECE7;
    --green-online: #10B981;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    overflow-x: hidden;
  }
  .app { max-width: 480px; margin: 0 auto; min-height: 100vh; background: var(--bg); position: relative; }

  /* ---------- AUTH SCREEN ---------- */
  .login-screen {
    min-height: 100vh; display: flex; flex-direction: column;
    justify-content: center; padding: 32px 28px;
  }
  .brand { font-size: 36px; font-weight: 800; color: var(--teal-deep); letter-spacing: -0.5px; margin-bottom: 6px; }
  .tagline { color: var(--ink-soft); font-size: 15px; margin-bottom: 34px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 13px; font-weight: 600; color: var(--ink-soft); margin-bottom: 6px; }
  .field input {
    width: 100%; padding: 13px 14px; border: 1px solid var(--line); border-radius: 12px;
    font-size: 15px; background: var(--card); color: var(--ink);
  }
  .field input:focus { outline: none; border-color: var(--teal); }
  .btn-primary {
    width: 100%; padding: 14px; border: none; border-radius: 12px;
    background: var(--teal-deep); color: #fff; font-size: 15px; font-weight: 700;
    cursor: pointer; margin-top: 6px; transition: opacity 0.2s;
  }
  .btn-primary:active { opacity: 0.85; }
  .btn-primary:disabled { background: var(--line); color: var(--ink-soft); cursor: not-allowed; }
  .link-btn {
    width: 100%; background: none; border: none; color: var(--teal-deep);
    font-size: 13px; font-weight: 600; margin-top: 16px; cursor: pointer; text-align: center;
  }
  .divider { display: flex; align-items: center; gap: 12px; margin: 20px 0; color: var(--ink-soft); font-size: 13px; }
  .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .btn-social {
    width: 100%; padding: 12px; border: 1px solid var(--line); border-radius: 12px;
    background: var(--card); font-size: 14px; font-weight: 600; color: var(--ink);
    display: flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer;
  }
  .error-msg { color: var(--coral); font-size: 13px; margin-top: 10px; text-align: center; min-height: 16px; }
  .loading-screen {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    color: var(--ink-soft); font-size: 16px; font-weight: 600;
  }

  /* ---------- APP TOPBAR ---------- */
  .topbar {
    position: sticky; top: 0; z-index: 20; background: var(--bg);
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 16px; border-bottom: 1px solid var(--line);
  }
  .topbar .brand-sm { font-size: 20px; font-weight: 800; color: var(--teal-deep); cursor: pointer; }
  .avatar {
    width: 36px; height: 36px; border-radius: 50%; background: var(--coral-soft);
    color: var(--coral); display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 13px; flex-shrink: 0; overflow: hidden; cursor: pointer;
    position: relative;
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }
  .online-indicator {
    position: absolute; bottom: 0; right: 0; width: 11px; height: 11px;
    border-radius: 50%; background: var(--green-online); border: 2px solid #fff;
  }

  /* ---------- FULL-SCREEN VIDEO FEED (TikTok-style) ---------- */
  .feed-topbar {
    position: fixed; top: 0; left: 0; right: 0; max-width: 480px; margin: 0 auto;
    z-index: 25; display: flex; align-items: center; justify-content: center; gap: 24px;
    padding: 14px 16px; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,0.6);
  }
  .feed-tab-btn {
    background: none; border: none; color: rgba(255,255,255,0.65);
    font-size: 16px; font-weight: 700; cursor: pointer; padding: 4px;
  }
  .feed-tab-btn.active { color: #fff; border-bottom: 2px solid #fff; }
  .feed-search-btn {
    background: none; border: none; color: #fff; font-size: 19px;
    cursor: pointer; position: absolute; right: 16px;
  }
  .fs-scroll {
    height: 100vh; overflow-y: scroll; scroll-snap-type: y mandatory;
    background: #000; -webkit-overflow-scrolling: touch;
  }
  .fs-slide {
    position: relative; height: 100vh; scroll-snap-align: start;
    background: #000; display: flex; align-items: flex-end; overflow: hidden;
  }
  .fs-slide img, .fs-slide video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .fs-slide .fs-textonly {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    padding: 36px; background: linear-gradient(135deg, #085041, #D85A30);
    color: #fff; font-size: 21px; font-weight: 600; text-align: center; line-height: 1.5;
  }
  .fs-overlay-bottom {
    position: relative; z-index: 5; width: 100%; padding: 20px 80px calc(80px + env(safe-area-inset-bottom, 0px)) 16px;
    color: #fff; background: linear-gradient(to top, rgba(0,0,0,0.75), transparent);
  }
  .fs-author { font-weight: 700; font-size: 15px; margin-bottom: 6px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
  .fs-caption { font-size: 13.5px; line-height: 1.45; margin-bottom: 6px; white-space: pre-wrap; word-break: break-word; }
  .fs-keywords { font-size: 12px; color: rgba(255,255,255,0.8); margin-top: 4px; }
  .fs-reposted-tag { font-size: 11px; background: rgba(255,255,255,0.22); padding: 3px 8px; border-radius: 10px; margin-bottom: 6px; display: inline-block; }

  .fs-side-rail {
    position: absolute; right: 10px; bottom: calc(88px + env(safe-area-inset-bottom, 0px));
    z-index: 10; display: flex; flex-direction: column; align-items: center; gap: 18px; color: #fff;
  }
  .fs-side-avatar-wrap { position: relative; margin-bottom: 4px; }
  .fs-side-avatar {
    width: 48px; height: 48px; border-radius: 50%; overflow: hidden;
    border: 2px solid #fff; display: flex; align-items: center; justify-content: center;
    background: var(--coral-soft); color: var(--coral); font-weight: 700; cursor: pointer;
  }
  .fs-side-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .fs-side-follow-badge {
    position: absolute; bottom: -8px; left: 50%; transform: translateX(-50%);
    background: var(--coral); color: #fff; width: 20px; height: 20px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 900;
    cursor: pointer; border: 2px solid #000;
  }
  .fs-action {
    background: none; border: none; color: #fff; display: flex; flex-direction: column;
    align-items: center; gap: 3px; cursor: pointer; font-size: 24px; text-shadow: 0 1px 4px rgba(0,0,0,0.7);
  }
  .fs-action span { font-size: 11px; font-weight: 700; }
  .fs-action.liked { color: #FE2C55; }
  .fs-action.saved { color: #25F4EE; }
  .fs-empty-full {
    height: 100vh; display: flex; align-items: center; justify-content: center;
    flex-direction: column; color: var(--ink-soft); text-align: center; padding: 30px; background: var(--bg);
  }

  /* ---------- BOTTOM NAV ---------- */
  .bottom-nav {
    position: fixed; left: 0; right: 0; bottom: 0; margin: 0 auto; max-width: 480px;
    background: rgba(255, 255, 255, 0.96); backdrop-filter: blur(8px);
    border-top: 1px solid var(--line); display: flex; align-items: center; justify-content: space-around;
    padding: 8px 12px calc(8px + env(safe-area-inset-bottom, 0px)); z-index: 50;
  }
  .nav-item {
    border: none; background: none; display: flex; flex-direction: column;
    align-items: center; gap: 3px; color: var(--ink-soft); font-size: 10px; font-weight: 600;
    cursor: pointer; flex: 1; padding: 3px 0;
  }
  .nav-item.active { color: var(--teal-deep); }
  .nav-item svg { stroke: currentColor; }
  .nav-icon-wrap { position: relative; display: inline-flex; }
  .nav-badge {
    position: absolute; top: -4px; right: -8px; min-width: 16px; height: 16px; padding: 0 4px;
    border-radius: 8px; background: var(--coral); color: #fff; font-size: 10px; font-weight: 800;
    display: flex; align-items: center; justify-content: center;
  }
  .nav-add-btn {
    width: 44px; height: 32px; border-radius: 9px; border: none; cursor: pointer;
    background: linear-gradient(90deg, #25F4EE, #FE2C55); padding: 2px;
    display: flex; align-items: center; justify-content: center;
  }
  .nav-add-btn-inner {
    width: 100%; height: 100%; border-radius: 7px; background: #000;
    display: flex; align-items: center; justify-content: center;
  }

  /* ---------- BOTTOM SHEETS ---------- */
  .sheet-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 998;
  }
  .sheet-overlay.open { display: block; }
  .bottom-sheet {
    position: fixed; left: 0; right: 0; bottom: 0; margin: 0 auto; max-width: 480px;
    background: var(--card); border-radius: 20px 20px 0 0; padding: 18px 16px calc(18px + env(safe-area-inset-bottom, 0px));
    transform: translateY(100%); transition: transform 0.24s cubic-bezier(0.1, 0.9, 0.2, 1);
    z-index: 999; max-height: 80vh; overflow-y: auto;
  }
  .bottom-sheet.open { transform: translateY(0); }
  .sheet-handle { width: 44px; height: 4px; background: var(--line); border-radius: 2px; margin: 0 auto 16px; }
  .sheet-title { font-size: 14px; font-weight: 700; color: var(--ink-soft); margin-bottom: 12px; }
  .share-sendto-row { display: flex; gap: 14px; overflow-x: auto; padding: 4px 2px 14px; }
  .share-sendto-item {
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    min-width: 58px; background: none; border: none; cursor: pointer; font-size: 11px; color: var(--ink);
  }
  .share-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px 8px; padding: 10px 0; }
  .share-grid-item {
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    background: none; border: none; font-size: 11px; font-weight: 600; color: var(--ink); cursor: pointer;
  }
  .sheet-icon {
    width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center;
    justify-content: center; color: #fff; font-size: 20px;
  }
  .menu-list-item {
    display: flex; align-items: center; gap: 14px; padding: 14px 4px;
    border-bottom: 1px solid var(--line); background: none; border-left: none;
    border-right: none; border-top: none; width: 100%; text-align: left;
    font-size: 14px; font-weight: 600; color: var(--ink); cursor: pointer;
  }
  .menu-list-item.danger { color: var(--coral); }
  .privacy-options { display: flex; gap: 8px; margin-top: 8px; }
  .privacy-option {
    border: 1px solid var(--line); background: var(--bg); border-radius: 16px;
    padding: 6px 14px; font-size: 12px; font-weight: 600; color: var(--ink); cursor: pointer;
  }
  .privacy-option.selected { background: var(--teal-deep); color: #fff; border-color: var(--teal-deep); }

  /* Fullscreen Comments Drawer */
  .fs-comments-container { max-height: 55vh; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; padding: 8px 0; }
  .comment-line { font-size: 13px; line-height: 1.45; display: flex; gap: 10px; align-items: flex-start; }
  .comment-body { flex: 1; }
  .comment-name { font-weight: 700; cursor: pointer; }
  .comment-input-row { display: flex; gap: 8px; margin-top: 12px; padding-top: 8px; border-top: 1px solid var(--line); }
  .comment-input-row input {
    flex: 1; border: 1px solid var(--line); border-radius: 20px; padding: 10px 14px; font-size: 13px;
    background: var(--bg); color: var(--ink);
  }
  .comment-input-row input:focus { outline: none; border-color: var(--teal); }
  .comment-input-row button {
    border: none; background: var(--teal-deep); color: #fff; border-radius: 20px;
    padding: 8px 18px; font-size: 13px; font-weight: 700; cursor: pointer;
  }

  /* ---------- FRIENDS SCREEN ---------- */
  .friends-search-wrap { padding: 12px 14px 6px; }
  .friends-search-wrap input {
    width: 100%; padding: 12px 16px; border: 1px solid var(--line); border-radius: 22px;
    font-size: 14px; background: var(--card); color: var(--ink);
  }
  .friends-search-wrap input:focus { outline: none; border-color: var(--teal); }
  .simple-tabs { display: flex; gap: 8px; padding: 8px 14px; overflow-x: auto; }
  .simple-tab {
    border: 1px solid var(--line); background: var(--card); color: var(--ink-soft);
    font-size: 13px; font-weight: 700; padding: 6px 14px; border-radius: 18px; cursor: pointer; white-space: nowrap;
  }
  .simple-tab.active { background: var(--teal-deep); color: #fff; border-color: var(--teal-deep); }
  .user-list { padding: 4px 14px 90px; }
  .user-row {
    display: flex; align-items: center; gap: 12px; padding: 12px 2px; border-bottom: 1px solid var(--line);
  }
  .user-row-info { flex: 1; min-width: 0; cursor: pointer; }
  .user-row-info .u-name { font-weight: 700; font-size: 14px; display: flex; align-items: center; gap: 6px; }
  .user-row-info .u-handle { font-size: 12px; color: var(--ink-soft); margin-top: 2px; }
  .pill-btn {
    border: none; background: var(--teal-deep); color: #fff; font-size: 12px; font-weight: 700;
    padding: 7px 16px; border-radius: 16px; cursor: pointer; white-space: nowrap;
  }
  .pill-btn.following { background: var(--card); color: var(--ink); border: 1px solid var(--line); }
  .pill-btn.requested { background: var(--card); color: var(--ink-soft); border: 1px dashed var(--line); }
  .pill-btn.ghost { background: var(--card); color: var(--teal-deep); border: 1px solid var(--teal-deep); }

  /* ---------- INBOX & CHAT ---------- */
  .inbox-section-row {
    display: flex; align-items: center; gap: 14px; padding: 13px 16px; border-bottom: 1px solid var(--line); cursor: pointer;
  }
  .inbox-section-icon {
    width: 42px; height: 42px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 18px; flex-shrink: 0;
  }
  .inbox-section-info { flex: 1; min-width: 0; }
  .inbox-section-info .is-title { font-weight: 700; font-size: 14px; }
  .inbox-section-info .is-sub { font-size: 12px; color: var(--ink-soft); margin-top: 2px; }
  .thread-row {
    display: flex; align-items: center; gap: 12px; padding: 13px 16px; border-bottom: 1px solid var(--line); cursor: pointer;
  }
  .thread-info { flex: 1; min-width: 0; }
  .thread-info .t-name { font-weight: 700; font-size: 14px; display: flex; align-items: center; gap: 6px; }
  .thread-info .t-preview { font-size: 12px; color: var(--ink-soft); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .thread-row.unread .t-name, .thread-row.unread .t-preview { font-weight: 700; color: var(--ink); }

  .chat-header {
    position: sticky; top: 0; z-index: 20; background: var(--bg);
    display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-bottom: 1px solid var(--line);
  }
  .chat-header-info { flex: 1; cursor: pointer; }
  .chat-header-info .c-name { font-weight: 700; font-size: 15px; }
  .chat-header-info .c-status { font-size: 11px; color: var(--ink-soft); display: flex; align-items: center; gap: 4px; }
  .chat-header-info .c-status.online { color: var(--green-online); font-weight: 600; }
  .chat-messages { padding: 16px 14px 110px; display: flex; flex-direction: column; gap: 8px; min-height: 80vh; }
  .chat-bubble {
    max-width: 78%; padding: 10px 14px; border-radius: 18px; font-size: 14px; line-height: 1.45; word-break: break-word;
  }
  .chat-bubble.mine { align-self: flex-end; background: var(--teal-deep); color: #fff; border-bottom-right-radius: 4px; }
  .chat-bubble.theirs { align-self: flex-start; background: var(--card); color: var(--ink); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
  .chat-bubble img, .chat-bubble video { max-width: 210px; max-height: 280px; border-radius: 12px; display: block; object-fit: cover; }
  .chat-bubble audio { width: 220px; }
  .chat-bubble.reaction-only { font-size: 32px; background: none !important; border: none !important; padding: 2px 4px; }
  .seen-badge { align-self: flex-end; font-size: 10px; color: var(--ink-soft); margin-top: -4px; margin-right: 4px; }

  .chat-input-bar {
    position: fixed; left: 0; right: 0; bottom: 0; margin: 0 auto; max-width: 480px;
    background: var(--card); border-top: 1px solid var(--line); padding: 10px 12px calc(10px + env(safe-area-inset-bottom, 0px));
    z-index: 50; display: flex; flex-direction: column; gap: 8px;
  }
  .chat-input-row { display: flex; align-items: center; gap: 8px; }
  .chat-input-bar input {
    flex: 1; border: 1px solid var(--line); border-radius: 20px; padding: 10px 14px; font-size: 14px;
    background: var(--bg); color: var(--ink);
  }
  .chat-input-bar input:focus { outline: none; border-color: var(--teal); }
  .chat-btn-icon {
    border: none; background: var(--coral-soft); color: var(--coral); width: 38px; height: 38px;
    border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 16px; flex-shrink: 0;
  }
  .chat-btn-icon.recording { background: #FE2C55 !important; color: #fff !important; }
  .chat-send-btn {
    border: none; background: var(--teal-deep); color: #fff; width: 38px; height: 38px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; font-size: 14px;
  }
  .chat-send-btn:disabled { background: var(--line); color: var(--ink-soft); cursor: not-allowed; }
  .chat-sticker-tray { display: flex; gap: 12px; flex-wrap: wrap; padding: 10px 4px; background: var(--bg); border-radius: 12px; }
  .chat-sticker-tray button { border: none; background: none; font-size: 26px; cursor: pointer; }

  /* ---------- CAMERA CREATIVE SUITE ---------- */
  .camera-screen { position: fixed; inset: 0; max-width: 480px; margin: 0 auto; background: #000; z-index: 999; display: flex; flex-direction: column; }
  .camera-viewport { flex: 1; position: relative; overflow: hidden; background: #000; }
  .camera-viewport video.live { width: 100%; height: 100%; object-fit: cover; }
  .camera-viewport img.captured, .camera-viewport video.captured { width: 100%; height: 100%; object-fit: cover; }
  .camera-top-bar {
    position: absolute; top: 0; left: 0; right: 0; display: flex; align-items: center; justify-content: space-between;
    padding: 16px; z-index: 10;
  }
  .camera-circle-btn {
    background: rgba(0,0,0,0.45); border: none; color: #fff; width: 38px; height: 38px;
    border-radius: 50%; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  .camera-right-tools {
    position: absolute; top: 70px; right: 14px; z-index: 10; display: flex; flex-direction: column; gap: 16px;
  }
  .camera-tool-item {
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    color: #fff; font-size: 10px; font-weight: 700; background: none; border: none; cursor: pointer;
    text-shadow: 0 1px 3px rgba(0,0,0,0.7);
  }
  .camera-tool-item span.icon {
    width: 38px; height: 38px; border-radius: 50%; background: rgba(0,0,0,0.45);
    display: flex; align-items: center; justify-content: center; font-size: 18px;
  }
  .camera-tool-item.active span.icon { background: var(--teal); }
  .camera-timer-countdown {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-size: 96px; font-weight: 900; color: #fff; text-shadow: 0 2px 10px rgba(0,0,0,0.8); z-index: 15;
  }
  .camera-bottom-bar {
    padding: 16px 20px calc(20px + env(safe-area-inset-bottom, 0px)); background: #000;
    display: flex; flex-direction: column; gap: 16px;
  }
  .camera-speed-row { display: flex; justify-content: center; gap: 14px; }
  .camera-speed-btn {
    background: rgba(255,255,255,0.15); border: none; color: #fff; font-size: 12px; font-weight: 700;
    padding: 4px 10px; border-radius: 12px; cursor: pointer;
  }
  .camera-speed-btn.active { background: #fff; color: #000; }
  .camera-controls-row { display: flex; align-items: center; justify-content: space-between; padding: 0 10px; }
  .camera-record-btn {
    width: 76px; height: 76px; border-radius: 50%; border: 4px solid #fff; background: transparent;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .camera-record-btn-inner { width: 60px; height: 60px; border-radius: 50%; background: var(--coral); transition: all 0.15s; }
  .camera-record-btn.recording .camera-record-btn-inner { border-radius: 10px; width: 32px; height: 32px; background: #FE2C55; }
  .capture-review-bar { display: flex; gap: 10px; padding: 16px; background: #000; }
  .capture-review-bar button { flex: 1; padding: 14px; border-radius: 12px; border: none; font-size: 14px; font-weight: 700; cursor: pointer; }

  /* Filters */
  .filter-normal { filter: none; }
  .filter-warm { filter: sepia(0.25) saturate(1.3) brightness(1.05); }
  .filter-cool { filter: hue-rotate(180deg) saturate(1.1); }
  .filter-vintage { filter: sepia(0.5) contrast(1.1); }
  .filter-bw { filter: grayscale(1) contrast(1.2); }

  /* ---------- PROFILE SCREEN ---------- */
  .profile-topbar {
    position: sticky; top: 0; z-index: 10; background: var(--bg);
    display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid var(--line);
  }
  .profile-hero { padding: 24px 20px 14px; text-align: center; }
  .profile-avatar-wrap { position: relative; width: 92px; height: 92px; margin: 0 auto 12px; }
  .profile-avatar {
    width: 92px; height: 92px; border-radius: 50%; background: var(--coral-soft);
    color: var(--coral); display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 32px; overflow: hidden; border: 3px solid var(--card);
  }
  .profile-name { font-size: 20px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 6px; }
  .profile-handle { color: var(--ink-soft); font-size: 13px; margin-top: 2px; }
  .profile-bio { font-size: 13px; margin: 8px auto 0; max-width: 320px; line-height: 1.45; }
  .profile-stats { display: flex; justify-content: center; gap: 36px; padding: 18px 0 10px; }
  .profile-stat { display: flex; flex-direction: column; align-items: center; gap: 2px; background: none; border: none; cursor: pointer; }
  .profile-stat .num { font-size: 18px; font-weight: 800; }
  .profile-stat .lbl { font-size: 12px; color: var(--ink-soft); }
  .profile-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; padding: 2px 0 90px; }
  .profile-grid-item { aspect-ratio: 1; background: #222; overflow: hidden; position: relative; cursor: pointer; }
  .profile-grid-item img, .profile-grid-item video { width: 100%; height: 100%; object-fit: cover; }
  .grid-pin-badge {
    position: absolute; top: 6px; left: 6px; background: var(--teal-deep); color: #fff;
    width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; z-index: 3;
  }
  .profile-follow-btn {
    margin-top: 14px; border: none; background: var(--coral); color: #fff; font-size: 13px; font-weight: 700;
    padding: 8px 30px; border-radius: 20px; cursor: pointer;
  }
  .profile-follow-btn.following { background: var(--card); color: var(--ink); border: 1px solid var(--line); }
  .profile-follow-btn.requested { background: var(--card); color: var(--ink-soft); border: 1px dashed var(--line); }

  /* Toast */
  .toast {
    position: fixed; bottom: 84px; left: 50%; transform: translateX(-50%);
    background: var(--ink); color: #fff; padding: 10px 20px; border-radius: 20px;
    font-size: 13px; font-weight: 600; opacity: 0; pointer-events: none; transition: opacity 0.2s; z-index: 1100;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<div id="root" class="app"></div>

<script>
/* ================= Firebase Config ================= */
const firebaseConfig = {
  apiKey: "AIzaSyDTRdBE8OniAAbmN7iQgo9ejqGqehAer5U",
  authDomain: "tik-tok-vai.firebaseapp.com",
  projectId: "tik-tok-vai",
  storageBucket: "tik-tok-vai.firebasestorage.app",
  messagingSenderId: "182459233826",
  appId: "1:182459233826:web:9cfb0c7d24d51307b37c7b",
  measurementId: "G-0GXPRM00VH"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

/* ================= App State ================= */
const root = document.getElementById("root");

let state = {
  authReady: false,
  user: null,
  mode: "login",
  authError: "",

  view: "feed", // feed | friends | inbox | chat | profile | editProfile | camera | postCompose | followList
  feedTab: "forYou", // forYou | following
  posts: [],
  activePostId: null,

  // Real-time Profile & Current User Doc
  myUserDoc: null,
  profile: null,
  viewingUid: null,
  viewingPosts: [],
  followListKind: "following",
  followListUid: null,

  // Real-time Friends
  allUsers: [],
  allUsersLoaded: false,
  friendsTab: "all", // all | followers | following | requests
  friendsSearch: "",

  // Inbox & Chat
  threads: [],
  notifications: [],
  chatUid: null,
  chatProfile: null,
  chatMessages: [],
  chatText: "",
  chatMedia: null,
  chatMediaType: null,
  chatStickerPanelOpen: false,
  chatRecordingVoice: false,

  // Comments Sheet
  openFsComments: null,

  // Post Compose
  composerText: "",
  composerMedia: null,
  composerMediaType: null,
  composePrivacy: "public",
  composeKeywords: "",

  // Camera Studio (Filters, Speed, Timer, Flash)
  cameraStream: null,
  cameraFacing: "user",
  cameraFilter: "normal", // normal | warm | cool | vintage | bw
  cameraSpeed: 1.0,
  cameraTimerSec: 0, // 0 (off) | 3 | 10
  cameraTorch: false,
  cameraRecording: false,
  cameraRecordSeconds: 0,
  cameraCapturedType: null,
  cameraCapturedUrl: null,
  cameraCapturedBlob: null,
  cameraCountdownDisplay: 0,

  toastMsg: ""
};

let activeMediaRecorder = null;
let recordedBlobs = [];
let recTimerInterval = null;
let heartbeatInterval = null;

function setState(patch) {
  state = { ...state, ...patch };
  render();
}

function showToast(msg) {
  state.toastMsg = msg;
  const t = document.getElementById("toast");
  if (t) {
    t.textContent = msg;
    t.classList.add("show");
    setTimeout(() => t.classList.remove("show"), 2200);
  }
}

function escapeHtml(str) {
  const d = document.createElement("div");
  d.textContent = str || "";
  return d.innerHTML;
}

function initials(name) {
  if (!name) return "?";
  return name.trim().split(" ").map(w => w[0]).slice(0, 2).join("").toUpperCase();
}

function slugifyHandle(base) {
  return (base || "user").toLowerCase().replace(/[^a-z0-9_]+/g, "_").slice(0, 24);
}

function formatTime(ts) {
  if (!ts || !ts.toDate) return "Just now";
  const sec = Math.floor((Date.now() - ts.toDate().getTime()) / 1000);
  if (sec < 60) return "Just now";
  const min = Math.floor(sec / 60);
  if (min < 60) return `${min}m ago`;
  const hr = Math.floor(min / 60);
  if (hr < 24) return `${hr}h ago`;
  return `${Math.floor(hr / 24)}d ago`;
}

/* ================= Presence & Online Heartbeat ================= */
function setupPresence(uid) {
  const userRef = db.collection("users").doc(uid);
  const updateStatus = (online) => {
    userRef.update({
      isOnline: online,
      lastActive: firebase.firestore.FieldValue.serverTimestamp()
    }).catch(() => {});
  };

  updateStatus(true);
  if (heartbeatInterval) clearInterval(heartbeatInterval);
  heartbeatInterval = setInterval(() => updateStatus(true), 60000);

  document.addEventListener("visibilitychange", () => {
    updateStatus(document.visibilityState === "visible");
  });
  window.addEventListener("beforeunload", () => {
    updateStatus(false);
  });
}

/* ================= Auth Listener ================= */
auth.onAuthStateChanged((user) => {
  if (user) {
    state.user = {
      uid: user.uid,
      name: user.displayName || user.email.split("@")[0],
      email: user.email
    };
    state.authReady = true;
    ensureUserProfile(state.user).then(() => {
      listenToMyUser(state.user.uid);
      listenToPosts();
      listenToAllUsers();
      listenToThreads();
      listenToNotifications();
      setupPresence(state.user.uid);
    });
  } else {
    state.user = null;
    state.authReady = true;
    if (heartbeatInterval) clearInterval(heartbeatInterval);
    render();
  }
});

function ensureUserProfile(user) {
  const ref = db.collection("users").doc(user.uid);
  return ref.get().then((doc) => {
    if (!doc.exists) {
      return ref.set({
        name: user.name,
        handle: slugifyHandle(user.name),
        bio: "",
        avatar: null,
        followers: [],
        following: [],
        followRequests: [],
        pinnedPosts: [],
        isOnline: true,
        lastActive: firebase.firestore.FieldValue.serverTimestamp(),
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
    }
  });
}

/* ================= Real-time Listeners ================= */
let unsubMyUser = null;
function listenToMyUser(uid) {
  if (unsubMyUser) unsubMyUser();
  unsubMyUser = db.collection("users").doc(uid).onSnapshot((doc) => {
    state.myUserDoc = doc.exists ? { uid: doc.id, ...doc.data() } : null;
    render();
  });
}

let unsubPosts = null;
function listenToPosts() {
  if (unsubPosts) unsubPosts();
  unsubPosts = db.collection("posts").orderBy("createdAt", "desc").limit(80).onSnapshot((snap) => {
    state.posts = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    render();
  });
}

let unsubAllUsers = null;
function listenToAllUsers() {
  if (unsubAllUsers) unsubAllUsers();
  unsubAllUsers = db.collection("users").limit(150).onSnapshot((snap) => {
    state.allUsers = snap.docs.map(d => ({ uid: d.id, ...d.data() }));
    state.allUsersLoaded = true;
    render();
  });
}

let unsubThreads = null;
function listenToThreads() {
  if (unsubThreads) unsubThreads();
  unsubThreads = db.collection("threads")
    .where("participants", "array-contains", state.user.uid)
    .onSnapshot((snap) => {
      state.threads = snap.docs.map(d => ({ id: d.id, ...d.data() }))
        .sort((a, b) => (b.lastMessageAt?.toMillis?.() || 0) - (a.lastMessageAt?.toMillis?.() || 0));
      render();
    });
}

let unsubNotifications = null;
function listenToNotifications() {
  if (unsubNotifications) unsubNotifications();
  unsubNotifications = db.collection("users").doc(state.user.uid).collection("notifications")
    .orderBy("createdAt", "desc").limit(40).onSnapshot((snap) => {
      state.notifications = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      render();
    });
}

function sendNotification(targetUid, type, text) {
  if (targetUid === state.user.uid) return;
  db.collection("users").doc(targetUid).collection("notifications").add({
    type,
    text,
    fromUid: state.user.uid,
    fromName: state.user.name,
    createdAt: firebase.firestore.FieldValue.serverTimestamp(),
    read: false
  }).catch(() => {});
}

/* ================= View Dispatcher ================= */
function render() {
  if (!state.authReady) {
    root.innerHTML = `<div class="loading-screen">Starting Milon...</div>`;
    return;
  }
  if (!state.user) {
    renderLogin();
    return;
  }
  switch (state.view) {
    case "feed": renderFeedScreen(); break;
    case "friends": renderFriendsScreen(); break;
    case "inbox": renderInboxScreen(); break;
    case "chat": renderChatScreen(); break;
    case "profile": renderProfileScreen(); break;
    case "editProfile": renderEditProfileScreen(); break;
    case "camera": renderCameraScreen(); break;
    case "postCompose": renderPostComposeScreen(); break;
    case "followList": renderFollowListScreen(); break;
    default: renderFeedScreen();
  }
}

/* ================= Auth Screen ================= */
function renderLogin() {
  const isSignup = state.mode === "signup";
  root.innerHTML = `
    <div class="login-screen">
      <div class="brand">Milon</div>
      <div class="tagline">Real-time social connection</div>
      ${isSignup ? `
        <div class="field">
          <label>Full Name</label>
          <input id="nameInput" type="text" placeholder="Your name" />
        </div>` : ""}
      <div class="field">
        <label>Email Address</label>
        <input id="emailInput" type="email" placeholder="name@example.com" />
      </div>
      <div class="field">
        <label>Password</label>
        <input id="passInput" type="password" placeholder="At least 6 characters" />
      </div>
      <button class="btn-primary" id="authSubmitBtn">${isSignup ? "Create Account" : "Log In"}</button>
      <div class="error-msg">${escapeHtml(state.authError)}</div>
      <button class="link-btn" id="toggleAuthModeBtn">${isSignup ? "Have an account? Log in" : "New here? Create an account"}</button>
      <div class="divider">or</div>
      <button class="btn-social" id="googleBtn">Continue with Google</button>
    </div>
  `;

  document.getElementById("authSubmitBtn").onclick = () => {
    const email = document.getElementById("emailInput").value.trim();
    const pass = document.getElementById("passInput").value;
    const isSign = state.mode === "signup";
    const name = isSign ? document.getElementById("nameInput").value.trim() : "";

    if (!email || !pass || (isSign && !name)) {
      setState({ authError: "Please fill in all fields" });
      return;
    }
    const action = isSign
      ? auth.createUserWithEmailAndPassword(email, pass).then(c => c.user.updateProfile({ displayName: name }))
      : auth.signInWithEmailAndPassword(email, pass);

    action.catch(err => setState({ authError: err.message }));
  };

  document.getElementById("toggleAuthModeBtn").onclick = () => setState({
    mode: state.mode === "signup" ? "login" : "signup", authError: ""
  });
  document.getElementById("googleBtn").onclick = () => auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(e => setState({ authError: e.message }));
}

/* ================= 1. FULL-SCREEN VIDEO FEED ================= */
function renderFeedScreen() {
  const myUid = state.user.uid;
  const followingList = (state.myUserDoc && state.myUserDoc.following) || [];

  let visible = state.posts.filter(p => {
    if (p.hidden && p.authorUid !== myUid) return false;
    if (p.privacy === "private" && p.authorUid !== myUid) return false;
    if (p.privacy === "friends" && !followingList.includes(p.authorUid) && p.authorUid !== myUid) return false;
    return true;
  });

  if (state.feedTab === "following") {
    visible = visible.filter(p => followingList.includes(p.authorUid) || p.authorUid === myUid);
  }

  root.innerHTML = `
    <div class="feed-topbar">
      <button class="feed-tab-btn ${state.feedTab === "following" ? "active" : ""}" id="feedTabFollowing">Following</button>
      <button class="feed-tab-btn ${state.feedTab === "forYou" ? "active" : ""}" id="feedTabForYou">For You</button>
      <button class="feed-search-btn" id="feedSearchBtn">🔍</button>
    </div>

    ${visible.length ? `
      <div class="fs-scroll" id="fsScroll">
        ${visible.map(renderSlideHtml).join("")}
      </div>` : `
      <div class="fs-empty-full">
        <div style="font-size:48px; margin-bottom:12px;">🎬</div>
        <div style="font-weight:700; font-size:16px;">No posts available</div>
        <div style="font-size:13px; margin-top:6px;">Follow more people or create your first post!</div>
      </div>
    `}

    ${renderSheetOverlay()}
    ${renderCommentsSheet(visible)}
    ${renderDualShareSheet()}
    ${renderBottomNav("feed")}
    <div class="toast" id="toast"></div>
  `;

  document.getElementById("feedTabFollowing").onclick = () => setState({ feedTab: "following" });
  document.getElementById("feedTabForYou").onclick = () => setState({ feedTab: "forYou" });
  document.getElementById("feedSearchBtn").onclick = () => setState({ view: "friends" });

  wireSlideActions(visible);
  wireSheetEvents();
  wireBottomNav();
}

function renderSlideHtml(p) {
  const myUid = state.user.uid;
  const isVideo = p.mediaType === "video" || (p.media && p.media.startsWith("data:video"));
  const likes = p.likes || [];
  const comments = p.comments || [];
  const saves = p.savedBy || [];
  const liked = likes.includes(myUid);
  const saved = saves.includes(myUid);
  const isOwner = p.authorUid === myUid;
  const amFollowing = (state.myUserDoc?.following || []).includes(p.authorUid);

  return `
    <div class="fs-slide" id="slide-${p.id}">
      ${p.media ? (isVideo ? `<video src="${p.media}" playsinline loop autoplay muted></video>` : `<img src="${p.media}" />`)
        : `<div class="fs-textonly">${escapeHtml(p.text || "")}</div>`}

      <div class="fs-side-rail">
        <div class="fs-side-avatar-wrap">
          <div class="fs-side-avatar" data-user="${p.authorUid}">${initials(p.authorName)}</div>
          ${(!isOwner && !amFollowing) ? `<button class="fs-side-follow-badge" data-follow="${p.authorUid}">+</button>` : ""}
        </div>
        <button class="fs-action ${liked ? "liked" : ""}" data-like="${p.id}">
          ${liked ? "❤️" : "🤍"}<span>${likes.length}</span>
        </button>
        <button class="fs-action" data-comment="${p.id}">
          💬<span>${comments.length}</span>
        </button>
        <button class="fs-action ${saved ? "saved" : ""}" data-save="${p.id}">
          🔖<span>${saves.length}</span>
        </button>
        <button class="fs-action" data-share="${p.id}">
          ↗️<span>Share</span>
        </button>
      </div>

      <div class="fs-overlay-bottom">
        <div class="fs-author" data-user="${p.authorUid}">@${escapeHtml(p.authorName)}</div>
        ${p.text && p.media ? `<div class="fs-caption">${escapeHtml(p.text)}</div>` : ""}
        ${p.keywords ? `<div class="fs-keywords">🏷️ ${escapeHtml(p.keywords)}</div>` : ""}
      </div>
    </div>
  `;
}

function wireSlideActions(posts) {
  document.querySelectorAll("[data-user]").forEach(el => {
    el.onclick = (e) => { e.stopPropagation(); openProfile(el.dataset.user); };
  });
  document.querySelectorAll("[data-follow]").forEach(btn => {
    btn.onclick = (e) => { e.stopPropagation(); toggleFollowUser(btn.dataset.follow); };
  });
  document.querySelectorAll("[data-like]").forEach(btn => {
    const p = posts.find(x => x.id === btn.dataset.like);
    btn.onclick = () => p && toggleLikePost(p);
  });
  document.querySelectorAll("[data-comment]").forEach(btn => {
    btn.onclick = () => setState({ openFsComments: btn.dataset.comment });
  });
  document.querySelectorAll("[data-save]").forEach(btn => {
    const p = posts.find(x => x.id === btn.dataset.save);
    btn.onclick = () => p && toggleSavePost(p);
  });
  document.querySelectorAll("[data-share]").forEach(btn => {
    btn.onclick = () => openShareSheet(btn.dataset.share);
  });
}

/* ================= 2. FIXED COMMENT SUBMISSION ================= */
function renderCommentsSheet(posts) {
  const currentPost = posts.find(p => p.id === state.openFsComments);
  const comments = currentPost ? (currentPost.comments || []) : [];

  return `
    <div class="bottom-sheet ${state.openFsComments ? "open" : ""}" id="commentsDrawer">
      <div class="sheet-handle"></div>
      <div class="sheet-title">Comments (${comments.length})</div>
      <div class="fs-comments-container">
        ${comments.length ? comments.map(c => `
          <div class="comment-line">
            <div class="avatar" style="width:32px;height:32px;font-size:12px;" data-user="${c.uid || ''}">${initials(c.name)}</div>
            <div class="comment-body">
              <span class="comment-name" data-user="${c.uid || ''}">${escapeHtml(c.name)}</span>:
              <span>${escapeHtml(c.text)}</span>
            </div>
          </div>
        `).join("") : `<div style="text-align:center; color:var(--ink-soft); padding:20px;">No comments yet. Be first!</div>`}
      </div>
      <div class="comment-input-row">
        <input id="commentBoxInput" type="text" placeholder="Add comment..." />
        <button id="commentSubmitBtn">Send</button>
      </div>
    </div>
  `;
}

function submitCurrentComment() {
  const input = document.getElementById("commentBoxInput");
  if (!input || !state.openFsComments) return;
  const text = input.value.trim();
  if (!text) return;

  const postId = state.openFsComments;
  const targetPost = state.posts.find(p => p.id === postId);

  db.collection("posts").doc(postId).update({
    comments: firebase.firestore.FieldValue.arrayUnion({
      uid: state.user.uid,
      name: state.user.name,
      text: text,
      createdAt: new Date().toISOString()
    })
  }).then(() => {
    input.value = "";
    if (targetPost) sendNotification(targetPost.authorUid, "comment", `${state.user.name} commented: "${text.slice(0, 40)}"`);
  }).catch(() => showToast("Couldn't add comment"));
}

/* ================= 3. SEPARATED SHARE SHEETS ================= */
function renderDualShareSheet() {
  const p = state.posts.find(x => x.id === state.activePostId);
  const isOwner = p && p.authorUid === state.user.uid;
  const myFriends = state.allUsers.filter(u => (state.myUserDoc?.following || []).includes(u.uid));

  return `
    <div class="bottom-sheet" id="universalShareSheet">
      <div class="sheet-handle"></div>
      ${isOwner ? `
        <div class="sheet-title">Manage Your Post</div>
        <button class="menu-list-item" id="btnAnalytics">📊 View Analytics</button>
        <button class="menu-list-item" id="btnAddToStory">⭐ Add to Story</button>
        <button class="menu-list-item" id="btnPinPost">📌 Pin to Profile</button>
        <button class="menu-list-item" id="btnEditPost">✏️ Edit Caption</button>
        <button class="menu-list-item" id="btnKeywords">🏷️ Manage Keywords</button>
        <div class="menu-list-item" style="flex-direction:column; align-items:flex-start;">
          <span>🔒 Privacy Settings</span>
          <div class="privacy-options">
            <button class="privacy-option ${(p.privacy==='public'||!p.privacy)?'selected':''}" data-priv="public">Public</button>
            <button class="privacy-option ${p.privacy==='friends'?'selected':''}" data-priv="friends">Friends</button>
            <button class="privacy-option ${p.privacy==='private'?'selected':''}" data-priv="private">Only Me</button>
          </div>
        </div>
        <button class="menu-list-item" id="btnDownloadMedia">⬇️ Download</button>
        <button class="menu-list-item" id="btnCreateGroup">👥 Create Group</button>
        <button class="menu-list-item danger" id="btnDeletePost">🗑️ Delete Post</button>
      ` : `
        <div class="sheet-title">Send to Friends</div>
        <div class="share-sendto-row">
          ${myFriends.map(f => `
            <button class="share-sendto-item" data-sendto="${f.uid}">
              <div class="avatar" style="width:48px;height:48px;">${f.avatar ? `<img src="${f.avatar}"/>` : initials(f.name)}</div>
              <span>${escapeHtml(f.name.split(" ")[0])}</span>
            </button>
          `).join("")}
        </div>
        <div class="share-grid">
          <button class="share-grid-item" id="btnRepost"><span class="sheet-icon" style="background:#0F6E56">↻</span>Repost</button>
          <button class="share-grid-item" id="btnCopyLink"><span class="sheet-icon" style="background:#2563eb">🔗</span>Copy Link</button>
          <button class="share-grid-item" id="btnStatus"><span class="sheet-icon" style="background:#8b5cf6">◎</span>Status</button>
          <button class="share-grid-item" id="btnMessenger"><span class="sheet-icon" style="background:#0084FF">💬</span>Messenger</button>
          <button class="share-grid-item" id="btnWhatsapp"><span class="sheet-icon" style="background:#25D366">📱</span>WhatsApp</button>
          <button class="share-grid-item" id="btnFacebook"><span class="sheet-icon" style="background:#1877F2">f</span>Facebook</button>
          <button class="share-grid-item" id="btnReport"><span class="sheet-icon" style="background:#dc2626">⚑</span>Report</button>
        </div>
      `}
    </div>
  `;
}

function openShareSheet(postId) {
  state.activePostId = postId;
  render();

  document.getElementById("universalShareSheet").classList.add("open");
}

function closeAllSheets() {
  document.getElementById("sheetOverlay").classList.remove("open");

  state.openFsComments = null;
  state.activePostId = null;
}

function renderSheetOverlay() {
  return `<div class="sheet-overlay" id="sheetOverlay"></div>`;
}

function wireSheetEvents() {
  const overlay = document.getElementById("sheetOverlay");
  if (overlay) overlay.onclick = closeAllSheets;

  const commentBtn = document.getElementById("commentSubmitBtn");
  const commentInput = document.getElementById("commentBoxInput");
  if (commentBtn && commentInput) {
    commentBtn.onclick = submitCurrentComment;
    commentInput.onkeydown = (e) => { if (e.key === "Enter") submitCurrentComment(); };
  }

  // Owner Sheet actions
  const p = state.posts.find(x => x.id === state.activePostId);
  if (!p) return;

  const bAnalytics = document.getElementById("btnAnalytics");
  if (bAnalytics) bAnalytics.onclick = () => {
    alert(`Post Analytics:\n• Likes: ${(p.likes||[]).length}\n• Comments: ${(p.comments||[]).length}\n• Saves: ${(p.savedBy||[]).length}\n• Estimated Views: ${((p.likes||[]).length * 12) + 34}`);
    closeAllSheets();
  };

  const bAddToStory = document.getElementById("btnAddToStory");
  if (bAddToStory) bAddToStory.onclick = () => { showToast("Added to your Story!"); closeAllSheets(); };

  const bPin = document.getElementById("btnPinPost");
  if (bPin) bPin.onclick = () => { togglePinPost(p.id); closeAllSheets(); };

  const bEdit = document.getElementById("btnEditPost");
  if (bEdit) bEdit.onclick = () => {
    const val = prompt("Edit post caption:", p.text || "");
    if (val !== null) db.collection("posts").doc(p.id).update({ text: val });
    closeAllSheets();
  };

  const bKeywords = document.getElementById("btnKeywords");
  if (bKeywords) bKeywords.onclick = () => {
    const kw = prompt("Add keywords / tags (e.g. #nature, travel):", p.keywords || "");
    if (kw !== null) db.collection("posts").doc(p.id).update({ keywords: kw });
    closeAllSheets();
  };

  document.querySelectorAll("[data-priv]").forEach(btn => {
    btn.onclick = () => {
      db.collection("posts").doc(p.id).update({ privacy: btn.dataset.priv });
      closeAllSheets();
      showToast("Privacy updated");
    };
  });

  const bDownload = document.getElementById("btnDownloadMedia");
  if (bDownload) bDownload.onclick = () => {
    if (!p.media) { showToast("No media file to download"); return; }
    const a = document.createElement("a");
    a.href = p.media;
    a.download = `milon_${p.id}.jpg`;
    a.click();
    closeAllSheets();
  };

  const bDelete = document.getElementById("btnDeletePost");
  if (bDelete) bDelete.onclick = () => {
    if (confirm("Delete this post permanently?")) db.collection("posts").doc(p.id).delete();
    closeAllSheets();
  };

  // Other Post Sheet actions
  document.querySelectorAll("[data-sendto]").forEach(btn => {
    btn.onclick = () => {
      sendMessageToFriend(btn.dataset.sendto, `Shared post: ${p.text || "Check this post"}`);
      showToast("Post sent to friend!");
      closeAllSheets();
    };
  });

  const bRepost = document.getElementById("btnRepost");
  if (bRepost) bRepost.onclick = () => {
    db.collection("posts").doc(p.id).update({ reposts: firebase.firestore.FieldValue.arrayUnion(state.user.uid) });
    showToast("Reposted!");
    closeAllSheets();
  };

  const bCopy = document.getElementById("btnCopyLink");
  if (bCopy) bCopy.onclick = () => {
    navigator.clipboard.writeText(`${window.location.origin}/#post_${p.id}`);
    showToast("Link copied to clipboard");
    closeAllSheets();
  };

  const bReport = document.getElementById("btnReport");
  if (bReport) bReport.onclick = () => {
    db.collection("posts").doc(p.id).update({ reports: firebase.firestore.FieldValue.arrayUnion(state.user.uid) });
    showToast("Post reported. Thank you.");
    closeAllSheets();
  };
}

/* ================= 4. REAL-TIME FOLLOW & STATS ================= */
function toggleFollowUser(targetUid) {
  const myUid = state.user.uid;
  const amFollowing = (state.myUserDoc?.following || []).includes(targetUid);
  const targetRef = db.collection("users").doc(targetUid);
  const myRef = db.collection("users").doc(myUid);
  const batch = db.batch();

  if (amFollowing) {
    batch.update(myRef, { following: firebase.firestore.FieldValue.arrayRemove(targetUid) });
    batch.update(targetRef, { followers: firebase.firestore.FieldValue.arrayRemove(myUid) });
  } else {
    batch.update(myRef, { following: firebase.firestore.FieldValue.arrayUnion(targetUid) });
    batch.update(targetRef, { followers: firebase.firestore.FieldValue.arrayUnion(myUid) });
  }

  batch.commit().then(() => {
    if (!amFollowing) sendNotification(targetUid, "follow", `${state.user.name} started following you`);
  }).catch(() => showToast("Couldn't update follow"));
}

function toggleLikePost(p) {
  const myUid = state.user.uid;
  const isLiked = (p.likes || []).includes(myUid);
  db.collection("posts").doc(p.id).update({
    likes: isLiked ? firebase.firestore.FieldValue.arrayRemove(myUid) : firebase.firestore.FieldValue.arrayUnion(myUid)
  }).then(() => {
    if (!isLiked) sendNotification(p.authorUid, "like", `${state.user.name} liked your post`);
  });
}

function toggleSavePost(p) {
  const myUid = state.user.uid;
  const isSaved = (p.savedBy || []).includes(myUid);
  db.collection("posts").doc(p.id).update({
    savedBy: isSaved ? firebase.firestore.FieldValue.arrayRemove(myUid) : firebase.firestore.FieldValue.arrayUnion(myUid)
  });
}

function updateUserListDomOnly() {
  const container = document.getElementById("userListContainer");
  if (!container) return;

  const myUid = state.user.uid;
  const q = state.friendsSearch.toLowerCase().trim();
  const followers = state.myUserDoc?.followers || [];
  const following = state.myUserDoc?.following || [];
  const requests = state.myUserDoc?.followRequests || [];

  let list = state.allUsers.filter(u => u.uid !== myUid);
  if (state.friendsTab === "followers") list = list.filter(u => followers.includes(u.uid));
  if (state.friendsTab === "following") list = list.filter(u => following.includes(u.uid));
  if (state.friendsTab === "requests") list = list.filter(u => requests.includes(u.uid));

  if (q) {
    list = list.filter(u => (u.name || "").toLowerCase().includes(q) || (u.handle || "").toLowerCase().includes(q));
  }

  if (!list.length) {
    container.innerHTML = `<div style="text-align:center; padding:48px 20px; color:var(--ink-soft);">No users found</div>`;
    return;
  }

  container.innerHTML = list.map(u => {
    const isFollowing = following.includes(u.uid);
    return `
      <div class="user-row">
        <div class="avatar" data-user="${u.uid}">
          ${u.avatar ? `<img src="${u.avatar}" />` : initials(u.name)}
          ${u.isOnline ? `<div class="online-indicator"></div>` : ""}
        </div>
        <div class="user-row-info" data-user="${u.uid}">
          <div class="u-name">${escapeHtml(u.name)}</div>
          <div class="u-handle">@${escapeHtml(u.handle || "user")}</div>
        </div>
        <button class="pill-btn ghost" data-chat="${u.uid}">Chat</button>
        <button class="pill-btn ${isFollowing ? "following" : ""}" data-follow="${u.uid}">
          ${isFollowing ? "Following" : "Follow"}
        </button>
      </div>
    `;
  }).join("");

  container.querySelectorAll("[data-user]").forEach(el => el.onclick = () => openProfile(el.dataset.user));
  container.querySelectorAll("[data-chat]").forEach(btn => btn.onclick = () => openChat(btn.dataset.chat));
  container.querySelectorAll("[data-follow]").forEach(btn => btn.onclick = () => toggleFollowUser(btn.dataset.follow));
}

let unsubChat = null;
function openChat(otherUid) {
  state.chatUid = otherUid;
  state.chatProfile = state.allUsers.find(u => u.uid === otherUid) || {};
  state.view = "chat";
  render();

  const myUid = state.user.uid;
  const threadId = [myUid, otherUid].sort().join("_");

  // Mark seen
  db.collection("threads").doc(threadId).set({
    [`unread.${myUid}`]: 0,
    [`lastSeenBy.${myUid}`]: firebase.firestore.FieldValue.serverTimestamp()
  }, { merge: true });

  if (unsubChat) unsubChat();
  unsubChat = db.collection("threads").doc(threadId).collection("messages")
    .orderBy("createdAt", "asc").limit(100).onSnapshot(snap => {
      state.chatMessages = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      renderChatScreenOnlyMessages();
    });
}

function renderChatScreen() {
  const other = state.chatProfile || {};
  root.innerHTML = `
    <div class="chat-header">
      <button class="camera-circle-btn" style="background:none; color:var(--ink);" id="chatBackBtn">←</button>
      <div class="avatar" data-user="${other.uid}">

        <button class="chat-btn-icon ${state.chatRecordingVoice ? "recording" : ""}" id="chatVoiceToggle">🎤</button>
        <input id="chatTextInput" type="text" placeholder="Send a message..." />

      </div>
    </div>
  `;

  document.getElementById("chatBackBtn").onclick = () => {

  };

  const textInput = document.getElementById("chatTextInput");
  textInput.onkeydown = (e) => { if (e.key === "Enter") sendChatMessage(); };
  document.getElementById("chatSendBtn").onclick = sendChatMessage;

  document.getElementById("chatCameraInput").onchange = (e) => uploadChatMedia(e.target.files[0]);
  document.getElementById("chatGalleryInput").onchange = (e) => uploadChatMedia(e.target.files[0]);

  document.getElementById("chatStickerToggle").onclick = () => {
    state.chatStickerPanelOpen = !state.chatStickerPanelOpen;
    renderChatScreen();
  };

function renderChatScreenOnlyMessages() {
  const box = document.getElementById("chatMessagesBox");
  if (!box) return;
  const myUid = state.user.uid;

  box.innerHTML = state.chatMessages.map(m => {
    const isMine = m.senderUid === myUid;
    return `
      <div class="chat-bubble ${m.reaction ? "reaction-only" : ""} ${isMine ? "mine" : "theirs"}">
        ${m.image ? `<img src="${m.image}"/>` : ""}
        ${m.video ? `<video src="${m.video}" controls></video>` : ""}
        ${m.audio ? `<audio src="${m.audio}" controls></audio>` : ""}
        ${m.text ? `<div>${escapeHtml(m.text)}</div>` : ""}
        ${m.reaction ? `<div>${m.reaction}</div>` : ""}
      </div>
      ${isMine && m.seen ? `<div class="seen-badge">Seen</div>` : ""}
    `;
  }).join("");

  box.scrollTop = box.scrollHeight;
}

function sendChatMessage() {
  const input = document.getElementById("chatTextInput");
  if (!input) return;
  const text = input.value.trim();
  if (!text) return;
  sendMessageToFriend(state.chatUid, text);
  input.value = "";
}

function sendReaction(emoji) {
  sendMessageToFriend(state.chatUid, "", { reaction: emoji });
}

function sendMessageToFriend(otherUid, text, extra = {}) {
  const myUid = state.user.uid;
  const threadId = [myUid, otherUid].sort().join("_");
  const threadRef = db.collection("threads").doc(threadId);

  threadRef.collection("messages").add({
    senderUid: myUid,
    text: text || null,
    createdAt: firebase.firestore.FieldValue.serverTimestamp(),
    ...extra
  }).then(() => {
    threadRef.set({
      participants: [myUid, otherUid],
      lastMessage: text || extra.reaction || "Media",
      lastMessageAt: firebase.firestore.FieldValue.serverTimestamp(),
      [`unread.${otherUid}`]: firebase.firestore.FieldValue.increment(1)
    }, { merge: true });
  });
}

function uploadChatMedia(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    const isVid = file.type.startsWith("video/");
    sendMessageToFriend(state.chatUid, "", isVid ? { video: e.target.result } : { image: e.target.result });
  };
  reader.readAsDataURL(file);
}

function toggleVoiceRecording() {
  if (state.chatRecordingVoice) {
    if (activeMediaRecorder) activeMediaRecorder.stop();
    state.chatRecordingVoice = false;
  } else {
    navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
      const rec = new MediaRecorder(stream);
      let chunks = [];
      rec.ondataavailable = e => chunks.push(e.data);
      rec.onstop = () => {
        const blob = new Blob(chunks, { type: "audio/webm" });
        const reader = new FileReader();
        reader.onload = () => sendMessageToFriend(state.chatUid, "", { audio: reader.result });
        reader.readAsDataURL(blob);
      };
      rec.start();
      activeMediaRecorder = rec;
      state.chatRecordingVoice = true;
      renderChatScreen();
    });
  }
}

/* ================= 7. CAMERA STUDIO (SPEED, TIMER, FILTERS, FLASH) ================= */
function openCameraScreen() {
  setState({
    view: "camera",
    cameraRecording: false,
    cameraCapturedType: null,
    cameraCapturedUrl: null,
    cameraFilter: "normal",
    cameraSpeed: 1.0,
    cameraTimerSec: 0,
    cameraTorch: false
  });
  initCameraStream();
}

function initCameraStream() {
  if (state.cameraStream) state.cameraStream.getTracks().forEach(t => t.stop());
  navigator.mediaDevices.getUserMedia({
    video: { facingMode: state.cameraFacing },
    audio: true
  }).then(stream => {
    state.cameraStream = stream;
    const v = document.getElementById("liveCamFeed");
    if (v) { v.srcObject = stream; v.play(); }
  }).catch(() => showToast("Camera permission denied"));
}

function renderCameraScreen() {
  if (state.cameraCapturedType) {

      <div class="camera-screen">

  root.innerHTML = `

        <div class="camera-top-bar">

        </div>

        <div class="camera-right-tools">
          <button class="camera-tool-item ${state.cameraTorch ? "active" : ""}" id="camTorchBtn">
            <span class="icon">⚡</span><span>Flash</span>
          </button>
          <button class="camera-tool-item" id="camTimerBtn">
            <span class="icon">⏱️</span><span>${state.cameraTimerSec ? state.cameraTimerSec + "s" : "Timer"}</span>
          </button>
          <button class="camera-tool-item" id="camFilterBtn">
            <span class="icon">🎨</span><span>Filter</span>
          </button>
        </div>

        ${state.cameraCountdownDisplay ? `<div class="camera-timer-countdown">${state.cameraCountdownDisplay}</div>` : ""}
      </div>

      <div class="camera-bottom-bar">
        <div class="camera-speed-row">
          ${[0.5, 1.0, 2.0, 3.0].map(s => `
            <button class="camera-speed-btn ${state.cameraSpeed === s ? "active" : ""}" data-speed="${s}">${s}x</button>
          `).join("")}
        </div>
        <div class="camera-controls-row">
          <label class="camera-circle-btn" style="cursor:pointer;" title="Upload">
            🖼️<input type="file" accept="image/*,video/*" id="galleryUpload" style="display:none;" />
          </label>
          <button class="camera-record-btn ${state.cameraRecording ? "recording" : ""}" id="camRecordBtn">
            <div class="camera-record-btn-inner"></div>
          </button>
          <button class="camera-circle-btn" id="camPhotoBtn" title="Snap Photo">📸</button>
        </div>
      </div>
    </div>
  `;

  document.getElementById("camExit").onclick = () => {
    if (state.cameraStream) state.cameraStream.getTracks().forEach(t => t.stop());
    setState({ view: "feed" });
  };
  document.getElementById("camFlip").onclick = () => {
    state.cameraFacing = state.cameraFacing === "user" ? "environment" : "user";
    initCameraStream();
  };

  document.getElementById("camTorchBtn").onclick = toggleTorch;
  document.getElementById("camTimerBtn").onclick = () => {
    const next = state.cameraTimerSec === 0 ? 3 : (state.cameraTimerSec === 3 ? 10 : 0);
    setState({ cameraTimerSec: next });
  };
  document.getElementById("camFilterBtn").onclick = cycleFilters;

  document.querySelectorAll("[data-speed]").forEach(btn => {
    btn.onclick = () => setState({ cameraSpeed: parseFloat(btn.dataset.speed) });
  });

  document.getElementById("galleryUpload").onchange = handleGalleryUpload;
  document.getElementById("camPhotoBtn").onclick = triggerPhotoCapture;
  document.getElementById("camRecordBtn").onclick = triggerVideoRecording;

  const v = document.getElementById("liveCamFeed");
  if (v && state.cameraStream) { v.srcObject = state.cameraStream; v.play(); }
}

function cycleFilters() {
  const filters = ["normal", "warm", "cool", "vintage", "bw"];
  const idx = (filters.indexOf(state.cameraFilter) + 1) % filters.length;
  setState({ cameraFilter: filters[idx] });
}

function toggleTorch() {
  if (!state.cameraStream) return;
  const track = state.cameraStream.getVideoTracks()[0];
  state.cameraTorch = !state.cameraTorch;
  track.applyConstraints({ advanced: [{ torch: state.cameraTorch }] }).catch(() => showToast("Flash not supported"));
  render();
}

function triggerPhotoCapture() {
  if (state.cameraTimerSec > 0) {
    runCountdown(state.cameraTimerSec, capturePhotoNow);
  } else {
    capturePhotoNow();
  }
}

function runCountdown(sec, callback) {
  let count = sec;
  state.cameraCountdownDisplay = count;
  render();
  const iv = setInterval(() => {
    count--;
    if (count <= 0) {
      clearInterval(iv);
      state.cameraCountdownDisplay = 0;
      render();
      callback();
    } else {
      state.cameraCountdownDisplay = count;
      render();
    }
  }, 1000);
}

function capturePhotoNow() {
  const video = document.getElementById("liveCamFeed");
  const canvas = document.createElement("canvas");
  canvas.width = video.videoWidth || 720;
  canvas.height = video.videoHeight || 1280;
  const ctx = canvas.getContext("2d");
  if (state.cameraFacing === "user") {
    ctx.translate(canvas.width, 0); ctx.scale(-1, 1);
  }
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
  state.cameraCapturedType = "image";
  state.cameraCapturedUrl = canvas.toDataURL("image/jpeg", 0.85);
  render();
}

function triggerVideoRecording() {
  if (state.cameraRecording) {
    stopRecordingNow();
  } else {
    if (state.cameraTimerSec > 0) {
      runCountdown(state.cameraTimerSec, startRecordingNow);
    } else {
      startRecordingNow();
    }
  }
}

function startRecordingNow() {
  recordedBlobs = [];
  try {
    activeMediaRecorder = new MediaRecorder(state.cameraStream);
  } catch (e) {
    showToast("Recording not supported");
    return;
  }
  activeMediaRecorder.ondataavailable = e => { if (e.data?.size > 0) recordedBlobs.push(e.data); };
  activeMediaRecorder.onstop = () => {
    const blob = new Blob(recordedBlobs, { type: "video/webm" });
    state.cameraCapturedBlob = blob;
    state.cameraCapturedUrl = URL.createObjectURL(blob);
    state.cameraCapturedType = "video";
    render();
  };
  activeMediaRecorder.start();
  state.cameraRecording = true;
  render();
}

function stopRecordingNow() {
  if (activeMediaRecorder) activeMediaRecorder.stop();
  state.cameraRecording = false;
}

function handleGalleryUpload(e) {
  const f = e.target.files[0];
  if (!f) return;
  const reader = new FileReader();
  reader.onload = () => {
    setState({
      view: "postCompose",
      composerMedia: reader.result,
      composerMediaType: f.type.startsWith("video/") ? "video" : "image"
    });
  };
  reader.readAsDataURL(f);
}

/* ================= 8. POST COMPOSE & SUBMISSION ================= */
function renderPostComposeScreen() {
  root.innerHTML = `
    <div class="topbar">
      <button class="camera-circle-btn" style="background:none; color:var(--ink);" id="composeBackBtn">←</button>
      <div class="brand-sm">New Post</div>
      <div></div>
    </div>
    <div style="padding:16px;">
      ${state.composerMedia ? `
        <div style="max-height:280px; overflow:hidden; border-radius:12px; margin-bottom:12px; background:#000;">
          ${state.composerMediaType === "video"
            ? `<video src="${state.composerMedia}" controls style="width:100%; max-height:280px;"></video>`
            : `<img src="${state.composerMedia}" style="width:100%; max-height:280px; object-fit:cover;" />`}
        </div>
      ` : ""}
      <div class="field">
        <label>Caption</label>
        <textarea id="composeCaption" rows="3" placeholder="Write caption..." style="width:100%; border:1px solid var(--line); border-radius:12px; padding:12px; font-family:inherit;">${escapeHtml(state.composerText)}</textarea>
      </div>
      <div class="field">
        <label>Keywords / Tags</label>
        <input id="composeKeywords" type="text" placeholder="#trending, #fun..." value="${escapeHtml(state.composeKeywords)}" />
      </div>
      <div style="font-size:13px; font-weight:700; margin-bottom:6px;">Who can see this</div>
      <div class="privacy-options" style="margin-bottom:16px;">
        <button class="privacy-option ${state.composePrivacy === "public" ? "selected" : ""}" data-p="public">Public</button>
        <button class="privacy-option ${state.composePrivacy === "friends" ? "selected" : ""}" data-p="friends">Friends</button>
        <button class="privacy-option ${state.composePrivacy === "private" ? "selected" : ""}" data-p="private">Only me</button>
      </div>
      <button class="btn-primary" id="publishPostBtn">Publish Post</button>
    </div>
  `;

  document.getElementById("composeBackBtn").onclick = () => setState({ view: "feed" });
  document.getElementById("composeCaption").oninput = e => state.composerText = e.target.value;
  document.getElementById("composeKeywords").oninput = e => state.composeKeywords = e.target.value;

  document.querySelectorAll("[data-p]").forEach(b => {
    b.onclick = () => setState({ composePrivacy: b.dataset.p });
  });

  document.getElementById("publishPostBtn").onclick = submitPostToFirestore;
}

function submitPostToFirestore() {
  const btn = document.getElementById("publishPostBtn");
  btn.disabled = true;
  btn.textContent = "Publishing...";

  db.collection("posts").add({
    authorUid: state.user.uid,
    authorName: state.user.name,
    text: state.composerText.trim(),
    keywords: state.composeKeywords.trim(),
    media: state.composerMedia,
    mediaType: state.composerMediaType,
    privacy: state.composePrivacy,
    likes: [],
    comments: [],
    savedBy: [],
    reposts: [],
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  }).then(() => {
    setState({
      view: "feed",
      composerMedia: null,
      composerMediaType: null,
      composerText: "",
      composeKeywords: ""
    });
    showToast("Post published successfully!");
  }).catch(() => {
    btn.disabled = false;
    showToast("Couldn't publish post");
  });
}

/* ================= 9. PROFILE SCREEN & PINNING FIX ================= */
let unsubProfile = null;
function openProfile(uid) {
  const targetUid = uid || state.user.uid;
  state.viewingUid = targetUid;
  state.view = "profile";
  render();

  if (unsubProfile) unsubProfile();
  unsubProfile = db.collection("users").doc(targetUid).onSnapshot(doc => {
    state.profile = doc.exists ? { uid: doc.id, ...doc.data() } : null;
    render();
  });
}

function renderProfileScreen() {
  const isOwn = state.viewingUid === state.user.uid;
  const p = isOwn ? (state.myUserDoc || {}) : (state.profile || {});
  const myUid = state.user.uid;
  const amFollowing = (state.myUserDoc?.following || []).includes(state.viewingUid);

  const userPosts = state.posts.filter(post => post.authorUid === state.viewingUid);
  const pinnedList = p.pinnedPosts || [];
  const sortedPosts = [...userPosts].sort((a, b) => (pinnedList.includes(b.id) ? 1 : 0) - (pinnedList.includes(a.id) ? 1 : 0));

  const followersCount = (p.followers || []).length;
  const followingCount = (p.following || []).length;
  const totalLikes = userPosts.reduce((acc, x) => acc + (x.likes || []).length, 0);

  root.innerHTML = `
    <div class="profile-topbar">
      <button class="camera-circle-btn" style="background:none; color:var(--ink);" id="profileBackBtn">←</button>
      <div class="brand-sm">Profile</div>
      ${isOwn ? `<button class="camera-circle-btn" style="background:none; color:var(--ink);" id="editProfileBtn">✏️</button>` : `<div></div>`}
    </div>

    <div class="profile-hero">
      <div class="profile-avatar-wrap">
        <div class="profile-avatar">
          ${p.avatar ? `<img src="${p.avatar}" />` : initials(p.name)}
        </div>
      </div>
      <div class="profile-name">
        ${escapeHtml(p.name || "User")}
      </div>
      <div class="profile-handle">@${escapeHtml(p.handle || "user")}</div>
      ${p.bio ? `<div class="profile-bio">${escapeHtml(p.bio)}</div>` : ""}

      ${!isOwn ? `
        <button class="profile-follow-btn ${amFollowing ? "following" : ""}" id="profileFollowToggle">
          ${amFollowing ? "Following" : "Follow"}
        </button>
      ` : ""}

      <div class="profile-stats">
        <button class="profile-stat" id="statFollowing">
          <div class="num">${followingCount}</div><div class="lbl">Following</div>
        </button>
        <button class="profile-stat" id="statFollowers">
          <div class="num">${followersCount}</div><div class="lbl">Followers</div>
        </button>
        <div class="profile-stat">
          <div class="num">${totalLikes}</div><div class="lbl">Likes</div>
        </div>
      </div>
    </div>

    <div class="profile-grid">
      ${sortedPosts.map(post => {
        const isPinned = pinnedList.includes(post.id);
        return `
          <div class="profile-grid-item" data-openpost="${post.id}">
            ${post.media ? (post.mediaType === "video" ? `<video src="${post.media}" muted></video>` : `<img src="${post.media}"/>`)
              : `<div style="padding:10px; font-size:11px; color:#fff;">${escapeHtml(post.text)}</div>`}
            ${isPinned ? `<div class="grid-pin-badge" title="Pinned">📌</div>` : ""}
          </div>
        `;
      }).join("")}
    </div>

    ${isOwn ? renderBottomNav("profile") : ""}
    <div class="toast" id="toast"></div>
  `;

  document.getElementById("profileBackBtn").onclick = () => setState({ view: "feed" });
  if (isOwn) {
    document.getElementById("editProfileBtn").onclick = () => setState({ view: "editProfile" });
  } else {
    document.getElementById("profileFollowToggle").onclick = () => toggleFollowUser(state.viewingUid);
  }

  document.getElementById("statFollowing").onclick = () => openFollowList(state.viewingUid, "following");
  document.getElementById("statFollowers").onclick = () => openFollowList(state.viewingUid, "followers");

  // Clicking grid item opens full post viewer (not pin!)
  document.querySelectorAll("[data-openpost]").forEach(item => {
    item.onclick = () => {
      const pId = item.dataset.openpost;
      setState({ view: "feed", feedTab: "forYou" });
      setTimeout(() => {
        const el = document.getElementById(`slide-${pId}`);
        if (el) el.scrollIntoView({ behavior: "smooth" });
      }, 200);
    };
  });

  wireBottomNav();
}

function togglePinPost(postId) {
  const myUid = state.user.uid;
  const pinned = state.myUserDoc?.pinnedPosts || [];
  const isPinned = pinned.includes(postId);
  db.collection("users").doc(myUid).update({
    pinnedPosts: isPinned ? firebase.firestore.FieldValue.arrayRemove(postId) : firebase.firestore.FieldValue.arrayUnion(postId)
  }).then(() => showToast(isPinned ? "Post unpinned" : "Post pinned to top!"));
}

/* ================= 10. EDIT PROFILE & FOLLOW LIST ================= */
function renderEditProfileScreen() {
  const p = state.myUserDoc || {};
  root.innerHTML = `
    <div class="profile-topbar">
      <button class="camera-circle-btn" style="background:none; color:var(--ink);" id="editBackBtn">←</button>
      <div class="brand-sm">Edit Profile</div>
      <button class="pill-btn" id="saveProfileBtn">Save</button>
    </div>
    <div style="padding:20px;">
      <div style="text-align:center; margin-bottom:16px;">
        <label style="cursor:pointer;">
          <div class="profile-avatar" style="margin:0 auto 8px;">
            ${p.avatar ? `<img src="${p.avatar}" id="editAvatarPreview" />` : initials(p.name)}
          </div>
          <span style="font-size:12px; font-weight:700; color:var(--teal);">Change Photo</span>
          <input type="file" accept="image/*" id="avatarPicker" style="display:none;" />
        </label>
      </div>
      <div class="field">
        <label>Display Name</label>
        <input id="editName" type="text" value="${escapeHtml(p.name || "")}" />
      </div>
      <div class="field">
        <label>Username</label>
        <input id="editHandle" type="text" value="${escapeHtml(p.handle || "")}" />
      </div>
      <div class="field">
        <label>Bio</label>
        <textarea id="editBio" rows="3" style="width:100%; border:1px solid var(--line); border-radius:12px; padding:12px; font-family:inherit;">${escapeHtml(p.bio || "")}</textarea>
      </div>
    </div>
  `;

  document.getElementById("editBackBtn").onclick = () => setState({ view: "profile" });
  document.getElementById("avatarPicker").onchange = (e) => {
    const f = e.target.files[0];
    if (!f) return;
    const reader = new FileReader();
    reader.onload = () => {
      document.getElementById("editAvatarPreview").src = reader.result;
      p._newAvatar = reader.result;
    };
    reader.readAsDataURL(f);
  };

  document.getElementById("saveProfileBtn").onclick = () => {
    const name = document.getElementById("editName").value.trim();
    const handle = slugifyHandle(document.getElementById("editHandle").value.trim());
    const bio = document.getElementById("editBio").value.trim();

    const patch = { name, handle, bio };
    if (p._newAvatar) patch.avatar = p._newAvatar;

    db.collection("users").doc(state.user.uid).update(patch).then(() => {
      showToast("Profile updated!");
      setState({ view: "profile" });
    });
  };
}

function openFollowList(uid, kind) {
  state.followListUid = uid;
  state.followListKind = kind;
  state.view = "followList";
  render();
}

function renderFollowListScreen() {
  const targetUser = state.allUsers.find(u => u.uid === state.followListUid) || state.myUserDoc || {};
  const ids = state.followListKind === "following" ? (targetUser.following || []) : (targetUser.followers || []);
  const list = state.allUsers.filter(u => ids.includes(u.uid));

  root.innerHTML = `
    <div class="profile-topbar">
      <button class="camera-circle-btn" style="background:none; color:var(--ink);" id="followListBack">←</button>
      <div class="brand-sm">${state.followListKind === "following" ? "Following" : "Followers"}</div>
      <div></div>
    </div>
    <div class="user-list">
      ${list.length ? list.map(u => `
        <div class="user-row">
          <div class="avatar" data-user="${u.uid}">${u.avatar ? `<img src="${u.avatar}"/>` : initials(u.name)}</div>
          <div class="user-row-info" data-user="${u.uid}">
            <div class="u-name">${escapeHtml(u.name)}</div>
            <div class="u-handle">@${escapeHtml(u.handle || "user")}</div>
          </div>
          <button class="pill-btn ghost" data-user="${u.uid}">View</button>
        </div>
      `).join("") : `<div style="text-align:center; padding:48px 20px; color:var(--ink-soft);">No users found</div>`}
    </div>
  `;

  document.getElementById("followListBack").onclick = () => setState({ view: "profile" });
  document.querySelectorAll("[data-user]").forEach(el => el.onclick = () => openProfile(el.dataset.user));
}

/* ================= BOTTOM NAVIGATION BAR ================= */

  const reqCount = (state.myUserDoc?.followRequests || []).length;
  const unreadMessages = state.threads.reduce((acc, t) => acc + ((t.unread && t.unread[state.user.uid]) || 0), 0);
  const unreadNotifs = state.notifications.filter(n => !n.read).length;
  const inboxBadge = unreadMessages + unreadNotifs;

  return `
    <div class="bottom-nav">
      <button class="nav-item ${active === "feed" ? "active" : ""}" id="navHome">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke-width="2.2"><path d="M3 10l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
        <span>Home</span>
      </button>

      <button class="nav-item ${active === "friends" ? "active" : ""}" id="navFriends">
        <span class="nav-icon-wrap">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke-width="2.2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
          ${reqCount ? `<span class="nav-badge">${reqCount}</span>` : ""}
        </span>
        <span>Friends</span>
      </button>

      <button class="nav-add-btn" id="navCreate">
        <div class="nav-add-btn-inner">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3"><path d="M12 5v14M5 12h14"/></svg>
        </div>
      </button>

      <button class="nav-item ${active === "inbox" ? "active" : ""}" id="navInbox">
        <span class="nav-icon-wrap">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke-width="2.2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
          ${inboxBadge ? `<span class="nav-badge">${inboxBadge}</span>` : ""}
        </span>
        <span>Inbox</span>
      </button>

      <button class="nav-item ${active === "profile" ? "active" : ""}" id="navProfile">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke-width="2.2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <span>Profile</span>
      </button>
    </div>
  `;
}

function wireBottomNav() {
  const h = document.getElementById("navHome");
  const f = document.getElementById("navFriends");
  const c = document.getElementById("navCreate");
  const i = document.getElementById("navInbox");
  const p = document.getElementById("navProfile");

  if (h) h.onclick = () => setState({ view: "feed" });
  if (f) f.onclick = () => setState({ view: "friends" });
  if (c) c.onclick = openCameraScreen;
  if (i) i.onclick = () => setState({ view: "inbox" });
  if (p) p.onclick = () => openProfile(state.user.uid);
}

render();
