/* ================================================================
   CAMERA / CREATE SCREEN
   ================================================================ */
function openCameraScreen() {
  setState({
    view: "camera",
    cameraMode: "15s",
    cameraRecording: false,
    cameraRecordSeconds: 0,
    cameraCapturedType: null,
    cameraCapturedUrl: null,
    cameraCapturedBlob: null,
    cameraError: null,
    cameraFlashOn: false,
    cameraTimerOn: false,
    cameraCountdown: 0,
    cameraSpeed: "1x",
    cameraFilter: "none"
  });
  startCameraStream();
}

function stopCameraStream() {
  if (state.cameraStream) {
    state.cameraStream.getTracks().forEach(t => t.stop());
    state.cameraStream = null;
  }
  if (recordTimerRef) { clearInterval(recordTimerRef); recordTimerRef = null; }
}

function startCameraStream(facing) {
  const facingMode = facing || state.cameraFacing || "user";
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    state.cameraError = "Camera isn't available on this device/browser. Use the gallery button below to pick a photo or video instead.";
    render();
    return;
  }
  if (state.cameraStream) {
    state.cameraStream.getTracks().forEach(t => t.stop());
  }
  navigator.mediaDevices.getUserMedia({ video: { facingMode }, audio: true })
    .then((stream) => {
      state.cameraStream = stream;
      state.cameraFacing = facingMode;
      state.cameraError = null;
      render();
      const videoEl = document.getElementById("liveCameraVideo");
      if (videoEl) { videoEl.srcObject = stream; videoEl.play().catch(() => {}); }
      applyTorch();
    })
    .catch((err) => {
      console.error(err);
      state.cameraError = "Couldn't access the camera (permission denied or unavailable). Use the gallery button below to pick a photo or video instead.";
      render();
    });
}

/* Toggle the device flashlight/torch (where supported) via the MediaStreamTrack constraints API */
function applyTorch() {
  if (!state.cameraStream) return;
  const track = state.cameraStream.getVideoTracks()[0];
  if (!track) return;
  const caps = track.getCapabilities ? track.getCapabilities() : {};
  if (caps && caps.torch) {
    track.applyConstraints({ advanced: [{ torch: !!state.cameraFlashOn }] }).catch(() => {});
  }
}

function flipCamera() {
  const next = state.cameraFacing === "user" ? "environment" : "user";
  startCameraStream(next);
}

function closeCameraScreen() {
  stopCameraStream();
  setState({ view: "feed", cameraCapturedType: null, cameraCapturedUrl: null, cameraCapturedBlob: null });
}

function renderCameraScreen() {
  // ---- Review screen: after capturing a photo or video ----
  if (state.cameraCapturedType) {
    const mediaHtml = state.cameraCapturedType === "video"
      ? `<video class="captured" src="${state.cameraCapturedUrl}" controls autoplay loop></video>`
      : `<img class="captured" src="${state.cameraCapturedUrl}" />`;
    root.innerHTML = `
      <div class="camera-screen">
        <div class="camera-viewport">
          ${mediaHtml}
          <div class="camera-top-bar">
            <button class="camera-close-btn" id="camCloseBtn">✕</button>
            <div></div>
          </div>
        </div>
        <div class="capture-review-bar">
          <button class="capture-retake-btn" id="camRetakeBtn">Retake</button>
          <button class="capture-use-btn" id="camUseBtn">Use this</button>
        </div>
      </div>
    `;
    document.getElementById("camCloseBtn").onclick = closeCameraScreen;
    document.getElementById("camRetakeBtn").onclick = () => {
      setState({ cameraCapturedType: null, cameraCapturedUrl: null, cameraCapturedBlob: null });
      startCameraStream();
    };
    document.getElementById("camUseBtn").onclick = useCapturedMedia;
    return;
  }

  // ---- Live camera / recording screen ----
  const modes = ["10m", "60s", "15s", "PHOTO", "TEXT"];
  const speeds = ["0.5x", "1x", "2x", "3x"];
  const filters = [
    { key: "none", label: "Normal" },
    { key: "bw", label: "B&W" },
    { key: "warm", label: "Warm" },
    { key: "cool", label: "Cool" },
    { key: "vivid", label: "Vivid" },
    { key: "soft", label: "Soft" }
  ];
  const filterClass = state.cameraFilter && state.cameraFilter !== "none" ? `filter-${state.cameraFilter}` : "";

  root.innerHTML = `
    <div class="camera-screen">
      <div class="camera-viewport">
        ${state.cameraError
          ? `<div class="camera-error-box">${escapeHtml(state.cameraError)}</div>`
          : `<video class="live ${state.cameraFacing === "user" ? "mirrored" : ""} ${filterClass}" id="liveCameraVideo" autoplay playsinline muted></video>`
        }
        ${state.cameraCountdown > 0 ? `<div class="camera-countdown">${state.cameraCountdown}</div>` : ""}
        ${state.cameraRecording ? `<div class="camera-record-timer" id="recTimer">${formatRecTime(state.cameraRecordSeconds)}</div>` : ""}
        <div class="camera-top-bar">
          <button class="camera-close-btn" id="camCloseBtn2">✕</button>
          ${!state.cameraError ? `
          <div class="camera-top-icons">
            <button class="camera-flash-btn ${state.cameraFlashOn ? "on" : ""}" id="camFlashBtn" title="Flash">${state.cameraFlashOn ? "⚡" : "⚡"}</button>
            <button class="camera-timer-btn ${state.cameraTimerOn ? "on" : ""}" id="camTimerBtn" title="Timer">⏱</button>
            <button class="camera-flip-btn" id="camFlipBtn" title="Flip camera">🔄</button>
          </div>` : `<div></div>`}
        </div>
      </div>
      <div class="camera-bottom-bar">
        ${!state.cameraError ? `
        <div class="camera-filter-row">
          ${filters.map(f => `<button class="camera-filter-btn ${state.cameraFilter === f.key ? "active" : ""}" data-filter="${f.key}">${f.label}</button>`).join("")}
        </div>
        <div class="camera-speed-row">
          ${speeds.map(s => `<button class="camera-speed-btn ${state.cameraSpeed === s ? "active" : ""}" data-speed="${s}">${s}</button>`).join("")}
        </div>` : ""}
        <div class="camera-mode-row">
          ${modes.map(m => `<button class="camera-mode-btn ${state.cameraMode === m ? "active" : ""}" data-mode="${m}">${m}</button>`).join("")}
        </div>
        <div class="camera-controls-row">
          <div class="camera-gallery-shortcut" id="camGalleryShortcut" title="Choose from gallery">
            ${state.cameraLastGalleryThumb ? `<img src="${state.cameraLastGalleryThumb}" />` : "🖼️"}
            <input type="file" accept="image/*,video/*" id="camGalleryInput" style="display:none" />
          </div>
          <button class="camera-record-btn ${state.cameraRecording ? "recording" : ""}" id="camRecordBtn">
            <span class="camera-record-btn-inner"></span>
          </button>
          <div class="camera-next-placeholder"></div>
        </div>
      </div>
    </div>
  `;

  document.getElementById("camCloseBtn2").onclick = closeCameraScreen;
  const flipBtn = document.getElementById("camFlipBtn");
  if (flipBtn) flipBtn.onclick = flipCamera;
  const flashBtn = document.getElementById("camFlashBtn");
  if (flashBtn) flashBtn.onclick = () => { state.cameraFlashOn = !state.cameraFlashOn; render(); applyTorch(); };
  const timerBtn = document.getElementById("camTimerBtn");
  if (timerBtn) timerBtn.onclick = () => setState({ cameraTimerOn: !state.cameraTimerOn });

  document.querySelectorAll(".camera-filter-btn").forEach(btn => {
    btn.onclick = () => setState({ cameraFilter: btn.dataset.filter });
  });
  document.querySelectorAll(".camera-speed-btn").forEach(btn => {
    btn.onclick = () => setState({ cameraSpeed: btn.dataset.speed });
  });

  document.querySelectorAll(".camera-mode-btn").forEach(btn => {
    btn.onclick = () => {
      const mode = btn.dataset.mode;
      if (mode === "TEXT") {
        // Text-only post: close the camera and open the compose screen with no media
        stopCameraStream();
        setState({ view: "postCompose", composerMedia: null, composerMediaType: null, composerText: "" });
        return;
      }
      setState({ cameraMode: mode });
    };
  });

  document.getElementById("camGalleryShortcut").onclick = () => document.getElementById("camGalleryInput").click();
  document.getElementById("camGalleryInput").onchange = handleCameraGallerySelect;

  document.getElementById("camRecordBtn").onclick = () => {
    if (state.cameraTimerOn && state.cameraCountdown === 0) {
      runCountdownThen(() => triggerCapture());
      return;
    }
    triggerCapture();
  };

  const videoEl = document.getElementById("liveCameraVideo");
  if (videoEl && state.cameraStream) { videoEl.srcObject = state.cameraStream; videoEl.play().catch(() => {}); }
}

function triggerCapture() {
  if (state.cameraMode === "PHOTO") {
    capturePhotoFromStream();
  } else {
    if (state.cameraRecording) stopVideoRecording();
    else startVideoRecording();
  }
}

/* 3-second on-screen countdown before capture, when the Timer toggle is on */
function runCountdownThen(callback) {
  state.cameraCountdown = 3;
  render();
  const iv = setInterval(() => {
    state.cameraCountdown -= 1;
    if (state.cameraCountdown <= 0) {
      clearInterval(iv);
      state.cameraCountdown = 0;
      render();
      callback();
    } else {
      render();
    }
  }, 1000);
}

function formatRecTime(sec) {
  const m = Math.floor(sec / 60);
  const s = sec % 60;
  return `${m}:${s < 10 ? "0" : ""}${s}`;
}

/* Applies the currently-selected filter to a canvas context via CSS filter string, so
   photos/videos are saved with the same look the user saw in the live preview. */
function cssFilterFor(key) {
  const map = {
    none: "none",
    bw: "grayscale(1)",
    warm: "saturate(1.4) sepia(0.25)",
    cool: "saturate(1.2) hue-rotate(180deg) brightness(1.05)",
    vivid: "saturate(1.8) contrast(1.15)",
    soft: "brightness(1.08) contrast(0.92) saturate(0.9)"
  };
  return map[key] || "none";
}

function capturePhotoFromStream() {
  const videoEl = document.getElementById("liveCameraVideo");
  if (!videoEl) return;
  const canvas = document.createElement("canvas");
  canvas.width = videoEl.videoWidth || 720;
  canvas.height = videoEl.videoHeight || 1280;
  const ctx = canvas.getContext("2d");
  ctx.filter = cssFilterFor(state.cameraFilter);
  if (state.cameraFacing === "user") {
    // The live preview is mirrored for a natural selfie view, but the saved photo
    // should NOT be mirrored (so text/details look correct to everyone else) —
    // flip the drawing context back before capturing.
    ctx.translate(canvas.width, 0);
    ctx.scale(-1, 1);
  }
  ctx.drawImage(videoEl, 0, 0, canvas.width, canvas.height);
  const dataUrl = canvas.toDataURL("image/jpeg", 0.85);
  stopCameraStream();
  setState({ cameraCapturedType: "photo", cameraCapturedUrl: dataUrl, cameraCapturedBlob: null });
}

function maxRecordMs() {
  if (state.cameraMode === "10m") return 10 * 60 * 1000;
  if (state.cameraMode === "60s") return 60 * 1000;
  return 15 * 1000; // 15s default
}

function startVideoRecording() {
  if (!state.cameraStream) return;
  recordedChunksRef = [];
  const options = {};
  // MediaRecorder audio track is included by default; the "Sound" control mutes/unmutes
  // this input track before recording starts (see cameraSoundOn toggle usage in useCapturedMedia's audio track).
  try {
    mediaRecorderRef = new MediaRecorder(state.cameraStream, options);
  } catch (e) {
    console.error(e);
    showToast("Recording isn't supported on this browser");
    return;
  }
  mediaRecorderRef.ondataavailable = (e) => { if (e.data && e.data.size > 0) recordedChunksRef.push(e.data); };
  mediaRecorderRef.onstop = () => {
    const blob = new Blob(recordedChunksRef, { type: "video/webm" });
    const url = URL.createObjectURL(blob);
    stopCameraStream();
    setState({ cameraCapturedType: "video", cameraCapturedUrl: url, cameraCapturedBlob: blob, cameraRecording: false, cameraRecordSeconds: 0 });
  };
  mediaRecorderRef.start();
  state.cameraRecording = true;
  state.cameraRecordSeconds = 0;
  render();
  // "Speed" affects playback rate applied to the reviewed clip (0.5x/1x/2x/3x), and also
  // scales the recording time limit so a 2x/3x clip still fits the chosen duration mode.
  const speedFactor = parseFloat((state.cameraSpeed || "1x").replace("x", "")) || 1;
  const limitMs = maxRecordMs() * speedFactor;
  recordTimerRef = setInterval(() => {
    state.cameraRecordSeconds += 1;
    const timerEl = document.getElementById("recTimer");
    if (timerEl) timerEl.textContent = formatRecTime(state.cameraRecordSeconds);
    if (state.cameraRecordSeconds * 1000 >= limitMs) stopVideoRecording();
  }, 1000);
}

function stopVideoRecording() {
  if (mediaRecorderRef && mediaRecorderRef.state !== "inactive") mediaRecorderRef.stop();
  if (recordTimerRef) { clearInterval(recordTimerRef); recordTimerRef = null; }
}

/* Gallery shortcut inside the camera screen: pick an existing photo/video to post */
function handleCameraGallerySelect(e) {
  const file = e.target.files[0];
  if (!file) return;
  if (!isAllowedMediaFile(file)) {
    showToast("That file type isn't supported");
    e.target.value = "";
    return;
  }
  const isVideo = file.type.startsWith("video/");
  stopCameraStream();
  if (isVideo) {
    fileToDataUrl(file, (dataUrl) => {
      setState({ cameraCapturedType: "video", cameraCapturedUrl: dataUrl, cameraCapturedBlob: null, cameraLastGalleryThumb: null });
    });
  } else {
    compressImageToDataUrl(file, { maxDim: 900, quality: 0.75 }, (dataUrl) => {
      setState({ cameraCapturedType: "photo", cameraCapturedUrl: dataUrl, cameraCapturedBlob: null, cameraLastGalleryThumb: dataUrl });
    });
  }
}

/* "Use this" on the review screen — send captured media into the caption/compose screen */
function useCapturedMedia() {
  const type = state.cameraCapturedType;
  const url = state.cameraCapturedUrl;

  if (type === "photo") {
    setState({ view: "postCompose", composerMedia: url, composerMediaType: "image", composerText: "", cameraCapturedType: null, cameraCapturedUrl: null, cameraCapturedBlob: null });
    return;
  }

  if (type === "video") {
    if (state.cameraCapturedBlob) {
      const reader = new FileReader();
      reader.onload = () => {
        setState({ view: "postCompose", composerMedia: reader.result, composerMediaType: "video", composerText: "", cameraCapturedType: null, cameraCapturedUrl: null, cameraCapturedBlob: null });
      };
      reader.readAsDataURL(state.cameraCapturedBlob);
    } else {
      setState({ view: "postCompose", composerMedia: url, composerMediaType: "video", composerText: "", cameraCapturedType: null, cameraCapturedUrl: null, cameraCapturedBlob: null });
    }
  }
}

/* Real-time online/offline presence for everyone currently loaded into allUsers,
   so green "online" dots update live without a refresh. */
let unsubscribePresenceList = null;
let presenceMap = {};
function listenToPresenceForAllUsers() {
  if (unsubscribePresenceList) unsubscribePresenceList();
  unsubscribePresenceList = db.collection("presence").onSnapshot((snap) => {
    const map = {};
    snap.docs.forEach(d => { map[d.id] = d.data(); });
    presenceMap = map;
    render();
  }, (err) => console.error(err));
}
function isUserOnline(uid) {
  const p = presenceMap[uid];
  return !!(p && p.online);
}

/* Friends list: with no search text, shows ONLY mutual friends (you follow them AND they follow
   you back) — real "friends", not one-sided follows. Typing a search reveals everyone matching
   the query (with a Follow/Following button), so you can still find and follow new people. */
function computeFriendsList(myUid, myPinned) {
  const q = state.friendsSearch.trim().toLowerCase();
  let list;
  if (q) {
    list = state.allUsers.filter(u =>
      (u.name || "").toLowerCase().includes(q) || (u.handle || "").toLowerCase().includes(q)
    );
  } else {
    list = state.allUsers.filter(u => (u.followers || []).includes(myUid) && (u.following || []).includes(myUid));
  }
  list = list.filter(u => !isBlockedEitherWay(u.uid));
  return [...list].sort((a, b) => {
    const ap = myPinned.includes(a.uid) ? 1 : 0;
    const bp = myPinned.includes(b.uid) ? 1 : 0;
    return bp - ap;
  });
}

function renderFriendsScreen() {

/* ================================================================
   SEARCH / DISCOVER
   Everything here is computed live from real Firestore data already
   loaded into state.posts / state.allUsers — no fake/sample numbers.
   Recent search terms are kept locally (this device only), same
   honest approach as the post draft: real, but not synced/online.
   ================================================================ */
function openDiscoverScreen() {
  setState({ view: "discover", discoverQuery: "", discoverTab: "top" });
}

function getRecentSearches() {
  try { return JSON.parse(localStorage.getItem("milon_recent_searches") || "[]"); } catch (e) { return []; }
}
function addRecentSearch(q) {
  if (!q || !q.trim()) return;
  const trimmed = q.trim();
  let list = getRecentSearches().filter(s => s.toLowerCase() !== trimmed.toLowerCase());
  list.unshift(trimmed);
  list = list.slice(0, 10);
  try { localStorage.setItem("milon_recent_searches", JSON.stringify(list)); } catch (e) {}
}
function clearRecentSearches() {
  try { localStorage.removeItem("milon_recent_searches"); } catch (e) {}
  renderDiscoverResultsOnly();
}

function computeTrendingHashtags(limit) {
  const counts = {};
  (state.posts || []).forEach(p => {
    (p.hashtags || []).forEach(h => { counts[h] = (counts[h] || 0) + 1; });
  });
  return Object.entries(counts).sort((a, b) => b[1] - a[1]).slice(0, limit || 10);
}
function computeTrendingCreators(limit) {
  return [...(state.allUsers || [])]
    .sort((a, b) => ((b.followers || []).length) - ((a.followers || []).length))
    .slice(0, limit || 8);
}

function discoverSearch(query) {
  const q = query.trim().toLowerCase();
  const myUid = state.user ? state.user.uid : null;
  const visible = (state.posts || []).filter(p => {
    if (p.hidden && p.authorUid !== myUid) return false;
    if (p.privacy && p.privacy !== "public" && p.authorUid !== myUid) return false;
    if (isBlockedEitherWay(p.authorUid)) return false;
    return true;
  });
  if (!q) return { users: [], videos: [], hashtags: [] };
  const users = (state.allUsers || []).filter(u =>
    !isBlockedEitherWay(u.uid) &&
    ((u.name || "").toLowerCase().includes(q) || (u.handle || "").toLowerCase().includes(q))
  );
  const cleanTag = q.replace(/^#/, "");
  const videos = visible.filter(p =>
    (p.text || "").toLowerCase().includes(q) || (p.hashtags || []).some(h => h.includes(cleanTag))
  );
  const hashtags = computeTrendingHashtags(200).filter(([tag]) => tag.includes(cleanTag));
  return { users, videos, hashtags };
}

function renderDiscoverScreen() {
  root.innerHTML = `
    <div class="back-row">
      <button class="profile-back-btn" id="discoverBackBtn">←</button>

/* Re-renders only the results portion (default trending view, or live search results/tabs)
   so the search <input> above is never destroyed and never loses focus/keyboard mid-typing. */
function renderDiscoverResultsOnly() {
  const box = document.getElementById("discoverResults");
  if (!box) return;
  const q = state.discoverQuery;
  const myUid = state.user ? state.user.uid : null;

  if (!q.trim()) {
    const recent = getRecentSearches();
    const trendingTags = computeTrendingHashtags(10);
    const trendingCreators = computeTrendingCreators(8);
    box.innerHTML = `
      ${recent.length ? `
        <div class="discover-section-title">Recent searches<button id="clearRecentBtn">Clear</button></div>
        <div class="discover-chip-row">${recent.map(r => `<button class="discover-chip" data-q="${escapeHtml(r)}">${escapeHtml(r)}</button>`).join("")}</div>
      ` : ""}
      <div class="discover-section-title">Trending hashtags</div>
      ${trendingTags.length ? trendingTags.map(([tag, count]) => `
        <div class="discover-hashtag-card" data-tag="${escapeHtml(tag)}">
          <span class="tag">#${escapeHtml(tag)}</span>
          <span class="count">${count} post${count === 1 ? "" : "s"}</span>
        </div>
      `).join("") : `<div class="discover-empty">No hashtags yet — be the first to post with one!</div>`}
      <div class="discover-section-title">Trending creators</div>
      <div class="user-list">${trendingCreators.length ? trendingCreators.map(u => renderUserRow(u, myUid, (state.myUserDoc && state.myUserDoc.pinnedFriends) || [])).join("") : `<div class="discover-empty">No creators yet</div>`}</div>
    `;
    document.querySelectorAll(".discover-chip").forEach(chip => {
      chip.onclick = () => { state.discoverQuery = chip.dataset.q; renderDiscoverResultsOnly(); const inp = document.getElementById("discoverSearchInput"); if (inp) inp.value = chip.dataset.q; };
    });
    document.querySelectorAll(".discover-hashtag-card").forEach(card => {
      card.onclick = () => openHashtagFeed(card.dataset.tag);
    });
    wireFriendsRowHandlers(trendingCreators);
    const clearBtn = document.getElementById("clearRecentBtn");
    if (clearBtn) clearBtn.onclick = clearRecentSearches;
    return;
  }

  const { users, videos, hashtags } = discoverSearch(q);
  const tab = state.discoverTab;
  const tabCounts = { top: users.length + videos.length + hashtags.length, users: users.length, videos: videos.length, hashtags: hashtags.length };

  let bodyHtml = "";
  if (tab === "users" || (tab === "top" && users.length)) {
    bodyHtml += `<div class="discover-section-title">Users</div><div class="user-list">${
      (tab === "top" ? users.slice(0, 4) : users).map(u => renderUserRow(u, myUid, (state.myUserDoc && state.myUserDoc.pinnedFriends) || [])).join("") || `<div class="discover-empty">No users found</div>`
    }</div>`;
  }
  if (tab === "hashtags" || (tab === "top" && hashtags.length)) {
    bodyHtml += `<div class="discover-section-title">Hashtags</div>${
      (tab === "top" ? hashtags.slice(0, 4) : hashtags).map(([tag, count]) => `
        <div class="discover-hashtag-card" data-tag="${escapeHtml(tag)}">
          <span class="tag">#${escapeHtml(tag)}</span>
          <span class="count">${count} post${count === 1 ? "" : "s"}</span>
        </div>
      `).join("") || `<div class="discover-empty">No hashtags found</div>`
    }`;
  }
  if (tab === "videos" || (tab === "top" && videos.length)) {
    const list = tab === "top" ? videos.slice(0, 9) : videos;
    bodyHtml += `<div class="discover-section-title">Videos & posts</div><div class="profile-grid">${
      list.map(p => `
        <div class="profile-grid-item ${!p.media ? "text-only" : ""}" id="discovervid-${p.id}">
          ${p.media
            ? (p.mediaType === "video" ? `<video src="${p.media}" ${p.cover ? `poster="${p.cover}"` : ""} muted></video><span class="grid-video-badge">▶</span>` : `<img src="${p.media}" />`)
            : escapeHtml((p.text || "").slice(0, 80))}
        </div>
      `).join("")
    }</div>`;
  }
  if (!users.length && !videos.length && !hashtags.length) {
    bodyHtml = `<div class="discover-empty">No results for "${escapeHtml(q)}"</div>`;
  }

  box.innerHTML = `
    <div class="discover-tabs">
      <button class="discover-tab-btn ${tab === "top" ? "active" : ""}" data-tab="top">Top</button>
      <button class="discover-tab-btn ${tab === "users" ? "active" : ""}" data-tab="users">Users (${tabCounts.users})</button>
      <button class="discover-tab-btn ${tab === "videos" ? "active" : ""}" data-tab="videos">Videos (${tabCounts.videos})</button>
      <button class="discover-tab-btn ${tab === "hashtags" ? "active" : ""}" data-tab="hashtags">Hashtags (${tabCounts.hashtags})</button>
    </div>
    ${bodyHtml}
  `;
  document.querySelectorAll(".discover-tab-btn").forEach(btn => {
    btn.onclick = () => setState({ discoverTab: btn.dataset.tab });
  });
  document.querySelectorAll(".discover-hashtag-card").forEach(card => {
    card.onclick = () => openHashtagFeed(card.dataset.tag);
  });
  (tab === "top" ? videos.slice(0, 9) : videos).forEach(p => {
    const el = document.getElementById(`discovervid-${p.id}`);
    if (el) el.onclick = () => { addRecentSearch(q); openPostViewer(p.id); };
  });
  wireFriendsRowHandlers(tab === "top" ? users.slice(0, 4) : users);
}

/* Follow / unfollow / request. Public accounts: tapping Follow immediately adds you to
   their followers, no approval step. Private accounts: tapping Follow instead adds you to
   their followRequests (pending) — nothing changes until they Accept. Tapping again while
   pending cancels the request. "Friend" is simply the case where the follow is mutual. */
function toggleFollowFromList(targetUid) {
  const myUid = state.user.uid;
  const target = state.allUsers.find(u => u.uid === targetUid) || (state.profileUserDoc && state.profileUserDoc.uid === targetUid ? state.profileUserDoc : null);
  if (!target) return;
  const amFollowing = (target.followers || []).includes(myUid);
  const isRequested = !amFollowing && (target.followRequests || []).includes(myUid);
  const targetRef = db.collection("users").doc(targetUid);
  const myRef = db.collection("users").doc(myUid);
  const batch = db.batch();

  if (amFollowing) {
    batch.update(targetRef, { followers: firebase.firestore.FieldValue.arrayRemove(myUid) });
    batch.update(myRef, { following: firebase.firestore.FieldValue.arrayRemove(targetUid) });
  } else if (isRequested) {
    batch.update(targetRef, { followRequests: firebase.firestore.FieldValue.arrayRemove(myUid) });
  } else if (target.private) {
    batch.update(targetRef, { followRequests: firebase.firestore.FieldValue.arrayUnion(myUid) });
  } else {
    batch.update(targetRef, { followers: firebase.firestore.FieldValue.arrayUnion(myUid) });
    batch.update(myRef, { following: firebase.firestore.FieldValue.arrayUnion(targetUid) });
  }

  batch.commit().then(() => {
    const updated = state.allUsers.map(u => {
      if (u.uid !== targetUid) return u;
      const followers = new Set(u.followers || []);
      const followRequests = new Set(u.followRequests || []);
      if (amFollowing) {
        followers.delete(myUid);
      } else if (isRequested) {
        followRequests.delete(myUid);
      } else if (target.private) {
        followRequests.add(myUid);
      } else {
        followers.add(myUid);
      }
      return { ...u, followers: Array.from(followers), followRequests: Array.from(followRequests) };
    });
    setState({ allUsers: updated });
    if (!amFollowing && !isRequested) {
      if (target.private) {
        logActivity(targetUid, "follow_request", `${state.user.name} requested to follow you`);
      } else {
        logActivity(targetUid, "follow", `${state.user.name} started following you`);
      }
    }
  }).catch((err) => {
    console.error(err);
    showToast("Couldn't update follow status — check your connection or try again");
  });
}

/* Accept a pending follow request: moves the requester into my followers/their following,
   clears the request, and lets them know it was accepted. */
function acceptFollowRequest(fromUid) {
  const myUid = state.user.uid;
  const myRef = db.collection("users").doc(myUid);
  const fromRef = db.collection("users").doc(fromUid);
  const batch = db.batch();
  batch.update(myRef, {
    followRequests: firebase.firestore.FieldValue.arrayRemove(fromUid),
    followers: firebase.firestore.FieldValue.arrayUnion(fromUid)
  });
  batch.update(fromRef, { following: firebase.firestore.FieldValue.arrayUnion(myUid) });
  batch.commit().then(() => {
    logActivity(fromUid, "follow_accept", `${state.user.name} accepted your follow request`);
    showToast("Request accepted");
  }).catch((err) => {
    console.error(err);
    showToast("Couldn't accept request");
  });
}

/* Decline a pending follow request: just removes it, no notification sent. */
function declineFollowRequest(fromUid) {
  const myUid = state.user.uid;
  db.collection("users").doc(myUid).update({
    followRequests: firebase.firestore.FieldValue.arrayRemove(fromUid)
  }).catch((err) => {
    console.error(err);
    showToast("Couldn't decline request");
  });
}

/* ---------------- Inbox / threads ---------------- */
function threadIdFor(uidA, uidB) {
  return [uidA, uidB].sort().join("_");
}

let unsubscribeThreads = null;
let prevThreadUnreadRef = {}; // threadId -> last-seen unread count, used to detect real-time new messages for notifications
function listenToThreads() {
  if (unsubscribeThreads) unsubscribeThreads();
  const myUid = state.user.uid;
  unsubscribeThreads = db.collection("threads")
    .where("participants", "array-contains", myUid)
    .onSnapshot((snap) => {
      const threads = snap.docs.map(d => ({ id: d.id, ...d.data() }))
        .sort((a, b) => (b.lastMessageAt?.toMillis?.() || 0) - (a.lastMessageAt?.toMillis?.() || 0));

      threads.forEach(t => {
        const unread = (t.unread && t.unread[myUid]) || 0;
        const prev = prevThreadUnreadRef[t.id] || 0;
        const otherUid = (t.participants || []).find(p => p !== myUid);
        const isViewingThisChat = state.view === "chat" && state.chatUid === otherUid;
        if (unread > prev && !isViewingThisChat && window.Notification && Notification.permission === "granted") {
          const otherInfo = (t.participantInfo && t.participantInfo[otherUid]) || { name: "Someone" };
          try {
            new Notification(otherInfo.name, { body: t.lastMessage || "New message", tag: t.id });
          } catch (e) { /* notification not supported in this context */ }
        }
        prevThreadUnreadRef[t.id] = unread;
      });

      setState({ threads });
    }, (err) => {
      console.error(err);
      showToast("Couldn't load inbox");
    });
}

}

/* Real-time notifications: one unified sub-collection per user (users/{uid}/notifications) holds
   every "follow" / "like" / "comment" / "message" event aimed at me, newest first. Each of the
   Inbox rows (New followers / Activity / Message requests) is just this same list filtered by type —
   so all three update live the instant something happens, with no polling or manual refresh. */
let unsubscribeActivity = null;
function listenToNotifications() {
  if (unsubscribeActivity) unsubscribeActivity();
  const myUid = state.user.uid;
  unsubscribeActivity = db.collection("users").doc(myUid).collection("notifications")
    .orderBy("createdAt", "desc").limit(60)
    .onSnapshot((snap) => {
      const items = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      setState({ activity: items, activityLoaded: true });
    }, (err) => console.error(err));
}

/* Records a real-time notification for a target user. type: "follow" | "like" | "comment" | "message" */
function logActivity(targetUid, type, text, extra) {
  if (!targetUid || targetUid === state.user.uid) return; // never notify yourself
  db.collection("users").doc(targetUid).collection("notifications").add({
    type, text, fromUid: state.user.uid, fromName: state.user.name,
    createdAt: firebase.firestore.FieldValue.serverTimestamp(), read: false, ...(extra || {})
  }).catch((err) => console.error(err));
}

/* Marks every notification of a given type as read (called when its Inbox section is opened) */
function markNotificationsRead(type) {
  const myUid = state.user.uid;
  const toMark = state.activity.filter(a => (!type || a.type === type) && !a.read);
  if (!toMark.length) return;
  const batch = db.batch();
  toMark.forEach(a => batch.update(db.collection("users").doc(myUid).collection("notifications").doc(a.id), { read: true }));
  batch.commit().catch((err) => console.error(err));
}

/* System notifications: a single global collection the app owner can broadcast into. Every user
   listens to it in real time, so a new notice appears instantly for everyone. */
let unsubscribeSystemNotices = null;
function listenToSystemNotices() {
  if (unsubscribeSystemNotices) unsubscribeSystemNotices();
  unsubscribeSystemNotices = db.collection("systemNotices").orderBy("createdAt", "desc").limit(20)
    .onSnapshot((snap) => {
      setState({ systemNotices: snap.docs.map(d => ({ id: d.id, ...d.data() })) });
    }, (err) => console.error(err));
}

function isOwnerAccount() {
  return !!(state.user && state.user.email && state.user.email.toLowerCase() === OWNER_EMAIL.toLowerCase());
}

function sendSystemNotice() {
  const text = (state.ownerNoticeText || "").trim();
  if (!text) return;
  db.collection("systemNotices").add({
    text, fromName: state.user.name, createdAt: firebase.firestore.FieldValue.serverTimestamp()
  }).then(() => {
    setState({ ownerNoticeText: "" });
    showToast("Notice sent to everyone");
  }).catch((err) => { console.error(err); showToast("Couldn't send notice"); });
}

  document.getElementById("secActivity").onclick = () => { markNotificationsRead("like"); markNotificationsRead("comment"); markNotificationsRead("follow_accept"); setState({ inboxSection: "activity" }); };
  document.getElementById("secRequests").onclick = () => { markNotificationsRead("message"); setState({ inboxSection: "requests" }); };
  document.getElementById("secSystem").onclick = () => setState({ inboxSection: "system" });

  suggested.forEach(u => {
    const av = document.getElementById(`sugavatar-${u.uid}`);
    const info = document.getElementById(`suginfo-${u.uid}`);
    const followBtn = document.getElementById(`sugfollow-${u.uid}`);
    const removeBtn = document.getElementById(`sugremove-${u.uid}`);
    if (av) av.onclick = () => openProfile(u.uid);
    if (info) info.onclick = () => openProfile(u.uid);
    if (followBtn) followBtn.onclick = () => toggleFollowFromList(u.uid);
    if (removeBtn) removeBtn.onclick = () => setState({ allUsers: state.allUsers.filter(x => x.uid !== u.uid) });
  });

  activeThreads.forEach(t => {
    const row = document.getElementById(`thread-${t.id}`);
    const otherUid = (t.participants || []).find(p => p !== myUid);
    if (row) row.onclick = (e) => { if (e.target.closest(".thread-row-actions")) return; openChat(otherUid); };
    const pinBtn = document.getElementById(`pinthread-${t.id}`);
    if (pinBtn) pinBtn.onclick = () => togglePinFriend(otherUid);
  });

  wireBottomNav();
}

/* Sub-screens for each Inbox section (New followers / Activity / Message requests / System) */
function renderInboxSubScreen() {
  const myUid = state.user.uid;
  const section = state.inboxSection;
  let title = "";
  let bodyHtml = "";

  const followerRow = (a) => {
    const u = state.allUsers.find(x => x.uid === a.fromUid);
    const name = (u && u.name) || a.fromName || "User";
    const avatar = u && u.avatar;
    const amFollowingBack = u ? (u.followers || []).includes(myUid) : false;
    const mutuals = a.fromUid ? mutualFriendsWith(a.fromUid) : [];
    let subLine = "";
    if (mutuals.length > 0) {
      const shown = mutuals.slice(0, 3);
      const extra = mutuals.length - shown.length;
      subLine = `
        <div class="notif-mutual-line">
          <span>Friends with</span>
          <span class="notif-mutual-avatars">${shown.map(m => `<span>${m.avatar ? `<img src="${m.avatar}" />` : ""}</span>`).join("")}</span>
          ${extra > 0 ? `<span>+${extra}</span>` : ""}
        </div>`;
    } else if (!amFollowingBack) {
      subLine = `<div class="notif-suggest-tag">👥 People you may know</div>`;
    }
    return `
      <div class="inbox-section-row" data-uid="${a.fromUid || ""}" style="cursor:pointer;">
        <div class="notif-row-avatar">${avatar ? `<img src="${avatar}" />` : initials(name)}</div>
        <div class="inbox-section-info">
          <div class="notif-row-name">${escapeHtml(name)}</div>
          ${subLine}
          <div class="notif-row-sub">${a.type === "follow_accept" ? "accepted your follow request" : "started following you"} · ${timeAgoShort(a.createdAt)}</div>
        </div>
        ${a.fromUid ? (amFollowingBack
          ? `<button class="wave-btn" data-wave="${a.fromUid}">Send a 👋</button>`
          : `<button class="followback-btn" data-followback="${a.fromUid}">Follow back</button>`) : ""}
      </div>
    `;
  };

  const activityRow = (a) => {
    const u = state.allUsers.find(x => x.uid === a.fromUid);
    const name = (u && u.name) || a.fromName || "User";
    const avatar = u && u.avatar;
    return `
      <div class="inbox-section-row" data-uid="${a.fromUid || ""}" style="cursor:pointer;">
        <div class="notif-row-avatar">${avatar ? `<img src="${avatar}" />` : initials(name)}</div>
        <div class="inbox-section-info">
          <div class="is-title">${escapeHtml(a.text)}</div>
          <div class="notif-row-sub">${timeAgoShort(a.createdAt)}</div>

        <div class="inbox-section-icon" style="width:30px;height:30px;font-size:14px;background:${a.type === "like" ? "var(--tiktok-red)" : "#5352ed"}">${a.type === "like" ? "❤️" : "💬"}</div>
      </div>
    `;
  };

  if (section === "followRequests") {
    title = "Follow requests";
    const pendingUids = (state.myUserDoc && state.myUserDoc.followRequests) || [];
    const requesters = pendingUids.map(uid => state.allUsers.find(u => u.uid === uid)).filter(Boolean);
    bodyHtml = requesters.length
      ? `<div class="thread-list">${requesters.map(u => {
          const mutuals = mutualFriendsWith(u.uid);
          let subLine = "";
          if (mutuals.length > 0) {
            const shown = mutuals.slice(0, 3);
            const extra = mutuals.length - shown.length;
            subLine = `
              <div class="notif-mutual-line">
                <span>Friends with</span>
                <span class="notif-mutual-avatars">${shown.map(m => `<span>${m.avatar ? `<img src="${m.avatar}" />` : ""}</span>`).join("")}</span>
                ${extra > 0 ? `<span>+${extra}</span>` : ""}
              </div>`;
          }
          return `
          <div class="inbox-section-row" data-uid="${u.uid}">
            <div class="notif-row-avatar" style="cursor:pointer;" data-open="${u.uid}">${u.avatar ? `<img src="${u.avatar}" />` : initials(u.name || "User")}</div>
            <div class="inbox-section-info" style="cursor:pointer;" data-open="${u.uid}">
              <div class="notif-row-name">${escapeHtml(u.name || "User")}</div>
              ${subLine}
              <div class="notif-row-sub">wants to follow you</div>
            </div>
            <div class="user-row-actions" style="flex-direction:column; gap:6px;">
              <button class="pill-btn" data-accept="${u.uid}">Accept</button>
              <button class="pill-btn ghost" data-decline="${u.uid}">Decline</button>
            </div>
          </div>
        `;

      : `<div class="empty-nav-tab"><div class="big">🔒</div><div class="line1">No pending requests</div><div class="line2">Requests to follow your private account show up here.</div></div>`;
  } else if (section === "followers") {
    title = "New followers";
    const list = state.activity.filter(a => a.type === "follow");
    bodyHtml = list.length
      ? `<div class="thread-list">${list.map(followerRow).join("")}</div>`
      : `<div class="empty-nav-tab"><div class="big">👥</div><div class="line1">No followers yet</div><div class="line2">People who follow you show up here.</div></div>`;
  } else if (section === "activity") {
    title = "Activity";
    const filter = state.activityFilter || "all";
    const likeCount = state.activity.filter(a => a.type === "like").length;
    const commentCount = state.activity.filter(a => a.type === "comment").length;
    // "follow_accept" (someone approved a request you sent) shows only under All, matching
    // TikTok: request approvals land in Activity, but new-follower notices stay in their own section.
    const filterList = filter === "like" ? state.activity.filter(a => a.type === "like")
      : filter === "comment" ? state.activity.filter(a => a.type === "comment")
      : state.activity.filter(a => a.type === "like" || a.type === "comment" || a.type === "follow_accept");
    const chipsHtml = `
      <div class="friends-sub-tabs">

      </div>

    const emptyText = filter === "like" ? { big: "❤️", l1: "No likes yet", l2: "Likes on your posts show up here." }
      : filter === "comment" ? { big: "💬", l1: "No comments yet", l2: "Comments and replies on your posts show up here." }
      : { big: "🔔", l1: "No activity yet", l2: "Likes, comments and approved follow requests show up here." };
    bodyHtml = chipsHtml + (filterList.length
      ? `<div class="thread-list">${filterList.map(a => a.type === "follow_accept" ? followerRow(a) : activityRow(a)).join("")}</div>`

  } else if (section === "requests") {

    bodyHtml = list.length
      ? `<div class="thread-list">${list.map(a => `
          <div class="inbox-section-row" id="msgnotif-${a.id}" style="cursor:pointer;">
            <div class="inbox-section-icon" style="background:#5352ed">💬</div>

        `).join("")}</div>`
      : `<div class="empty-nav-tab"><div class="big">💬</div><div class="line1">No new messages</div><div class="line2">New chats started with you show up here.</div></div>`;
  } else if (section === "system") {
    title = "System notifications";
    const notices = state.systemNotices;
    const composerHtml = isOwnerAccount() ? `
      <div style="padding:14px;">
        <textarea id="ownerNoticeInput" rows="3" placeholder="Write a notice to send to everyone..." style="width:100%; padding:12px 14px; border:1px solid var(--line); border-radius:10px; font-size:14px; font-family:inherit; background:var(--card); color:var(--ink); resize:vertical;">${escapeHtml(state.ownerNoticeText)}</textarea>
        <button class="btn-primary" id="sendOwnerNoticeBtn" style="margin-top:8px;">Send to everyone</button>
      </div>
    ` : "";
    bodyHtml = `
      ${composerHtml}
      <div class="thread-list">
        <div class="inbox-section-row">
          <div class="inbox-section-icon" style="background:#1e1e2e">📥</div>
          <div class="inbox-section-info">
            <div class="is-title">Welcome to Milon</div>
            <div class="is-sub">Thanks for joining — explore Friends and Inbox to connect with people.</div>
          </div>
        </div>
        ${notices.map(n => `
          <div class="inbox-section-row">
            <div class="inbox-section-icon" style="background:#1e1e2e">📥</div>
            <div class="inbox-section-info">
              <div class="is-title">${escapeHtml(n.text)}</div>
              <div class="is-sub">${timeAgo(n.createdAt)}</div>
            </div>
          </div>
        `).join("")}
      </div>
    `;
  }

  const sectionTypeMap = {
    followers: ["follow"],
    activity: ["like", "comment", "follow_accept"],
    requests: ["message"],
    followRequests: [],
    system: []
  };
  const sectionMarkTypes = sectionTypeMap[section] || [];
  const sectionUnread = state.activity.filter(a => sectionMarkTypes.includes(a.type) && !a.read).length;

  root.innerHTML = `
    <div class="back-row">
      <button class="profile-back-btn" id="inboxSubBackBtn">←</button>
      <div class="back-title">${title}</div>
      ${sectionUnread > 0 ? `<button class="mark-all-read-btn" id="markSectionReadBtn">Mark all read</button>` : ""}
    </div>
    ${bodyHtml}
    ${renderBottomNav("inbox")}
  `;
  document.getElementById("inboxSubBackBtn").onclick = () => setState({ inboxSection: null });
  const markSectionBtn = document.getElementById("markSectionReadBtn");
  if (markSectionBtn) markSectionBtn.onclick = () => sectionMarkTypes.forEach(t => markNotificationsRead(t));

  if (section === "followRequests") {
    document.querySelectorAll("[data-accept]").forEach(btn => {

    document.querySelectorAll("[data-decline]").forEach(btn => {

    if (sendBtn) sendBtn.onclick = sendSystemNotice;

  wireBottomNav();
}

function renderThreadRow(t, myUid, myPinned) {
  const otherUid = (t.participants || []).find(p => p !== myUid);
  const otherInfo = (t.participantInfo && t.participantInfo[otherUid]) || { name: "User", avatar: null };
  const unread = (t.unread && t.unread[myUid]) || 0;
  const isPinned = (myPinned || []).includes(otherUid);
  const online = isUserOnline(otherUid);
  return `
    <div class="thread-row ${unread > 0 ? "unread" : ""}" id="thread-${t.id}">
      <div class="avatar">${otherInfo.avatar ? `<img src="${otherInfo.avatar}" />` : initials(otherInfo.name)}${online ? `<span class="presence-dot"></span>` : ""}</div>
      <div class="thread-info">
        <div class="t-name">${escapeHtml(otherInfo.name)} ${isPinned ? `<span class="pin-flag">📌</span>` : ""}</div>
        <div class="t-preview">${escapeHtml(t.lastMessage || "")}</div>
      </div>
      ${unread > 0 ? `<div class="thread-unread-dot"></div>` : ""}
      <div class="thread-row-actions">
        <button class="pin-icon-btn ${isPinned ? "pinned" : ""}" id="pinthread-${t.id}" title="Pin">📌</button>
      </div>
      <div class="thread-time">${timeAgo(t.lastMessageAt)}</div>
    </div>
  `;
}

/* ---------------- Chat screen ---------------- */
let unsubscribeChat = null;
let unsubscribeChatPresence = null;
function openChat(otherUid) {
  if (!otherUid) return;
  if (isBlockedEitherWay(otherUid)) { showToast("You can't message this account"); return; }
  const myUid = state.user.uid;
  const threadId = threadIdFor(myUid, otherUid);

  db.collection("users").doc(otherUid).get().then((doc) => {
    const chatProfile = doc.exists ? doc.data() : { name: "User", avatar: null };
    setState({ view: "chat", chatUid: otherUid, chatProfile, chatMessages: [], chatText: "", chatMedia: null });

    // Mark this thread read for me now that I've opened it
    db.collection("threads").doc(threadId).set({
      [`unread.${myUid}`]: 0
    }, { merge: true }).catch((err) => console.error(err));

    if (unsubscribeChat) unsubscribeChat();
    unsubscribeChat = db.collection("threads").doc(threadId).collection("messages")
      .orderBy("createdAt", "asc")
      .limit(200)
      .onSnapshot((snap) => {
        state.chatMessages = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        render();
        const box = document.getElementById("chatMessagesBox");
        if (box) box.scrollTop = box.scrollHeight;
        // Mark any of the other person's messages as seen by me
        markMessagesSeen(threadId, myUid);
      }, (err) => console.error(err));

    if (unsubscribeChatPresence) unsubscribeChatPresence();
    unsubscribeChatPresence = db.collection("presence").doc(otherUid).onSnapshot((doc) => {
      state.chatOtherPresence = doc.exists ? doc.data() : null;
      render();
    }, (err) => console.error(err));
  }).catch((err) => {
    console.error(err);
    showToast("Couldn't open chat");
  });
}

/* Marks all of the other participant's messages in this thread as seen by me, in real time */
function markMessagesSeen(threadId, myUid) {
  const unseen = state.chatMessages.filter(m => m.senderUid !== myUid && !m.seenBy);
  unseen.forEach(m => {
    db.collection("threads").doc(threadId).collection("messages").doc(m.id).update({ seenBy: myUid }).catch(() => {});
  });
}

const CHAT_QUICK_REACTIONS = ["❤️", "😂", "👍", "👉", "🐾"]; // last one stands in for a "Streak Pet" style reaction

function chatPresenceLabel() {
  const p = state.chatOtherPresence;
  if (p && p.online) return "Active now";
  if (p && p.lastSeenAt && p.lastSeenAt.toDate) return `Active ${timeAgo(p.lastSeenAt)}`;
  return "";
}

function renderChatScreen() {
  const myUid = state.user.uid;
  const other = state.chatProfile || {};
  const lastMineIdx = (() => {
    for (let i = state.chatMessages.length - 1; i >= 0; i--) {
      if (state.chatMessages[i].senderUid === myUid) return i;
    }
    return -1;
  })();

  const bubblesHtml = state.chatMessages.map((m, idx) => {
    const isReactionOnly = m.reaction && !m.text && !m.image && !m.video && !m.audio;
    const showSeen = idx === lastMineIdx && m.senderUid === myUid && m.seenBy === state.chatUid;
    return `
    <div class="chat-bubble ${isReactionOnly ? "reaction-only" : ""} ${m.senderUid === myUid ? "mine" : "theirs"}">
      ${m.image ? `<img src="${m.image}" />` : ""}
      ${m.video ? `<video src="${m.video}" controls></video>` : ""}
      ${m.audio ? `<audio src="${m.audio}" controls></audio>` : ""}
      ${m.text ? `<div class="${(m.image || m.video) ? "bubble-text-with-image" : ""}">${escapeHtml(m.text)}</div>` : ""}
    </div>
    ${showSeen ? `<div class="chat-seen-label">Seen</div>` : ""}
  `;
  }).join("");

  const presenceLabel = chatPresenceLabel();
  const hasContent = !!(state.chatText.trim() || state.chatMedia);

  root.innerHTML = `
    <div class="chat-header">
      <button class="profile-back-btn" id="chatBackBtn">←</button>
      <div class="avatar" id="chatHeaderAvatar">${other.avatar ? `<img src="${other.avatar}" />` : initials(other.name || "User")}${state.chatOtherPresence && state.chatOtherPresence.online ? `<span class="presence-dot"></span>` : ""}</div>
      <div class="chat-header-info">
        <div class="c-name" id="chatHeaderName">${escapeHtml(other.name || "User")}</div>
        ${presenceLabel ? `<div class="c-status">${escapeHtml(presenceLabel)}</div>` : ""}
      </div>
    </div>
    <div class="chat-messages" id="chatMessagesBox">${bubblesHtml}</div>
    <div class="chat-input-bar">
      ${!hasContent ? `
      <div class="chat-reaction-row">
        ${CHAT_QUICK_REACTIONS.map(r => `<button class="chat-reaction-btn" data-r="${r}">${r}</button>`).join("")}
      </div>` : ""}
      ${(state.chatStickerPanelOpen && !hasContent) ? `
        <div class="chat-sticker-panel">
          ${["🎉","🔥","😍","👏","😢","😮","🙌","💯"].map(s => `<button data-s="${s}">${s}</button>`).join("")}
        </div>
      ` : ""}
      ${state.chatMedia ? `
        <div class="chat-media-preview">
          ${state.chatMediaType === "video" ? `<video src="${state.chatMedia}" style="width:54px;height:54px;object-fit:cover;border-radius:8px;"></video>` : `<img src="${state.chatMedia}" />`}
          <button class="chat-media-remove" id="removeChatMediaBtn">✕</button>
        </div>` : ""}
      <div class="chat-input-row">
        ${!hasContent ? `
        <label class="chat-image-btn" title="Photo/video from gallery">
          🖼️
          <input type="file" accept="image/*,video/*" id="chatGalleryInput" style="display:none" />
        </label>` : ""}
        <input id="chatInput" type="text" placeholder="Message..." value="${escapeHtml(state.chatText)}" />
        ${!hasContent ? `<button class="chat-image-btn" id="chatStickerBtn" title="Stickers">😊</button>` : ""}
        ${!hasContent ? `<button class="chat-image-btn chat-mic-btn ${state.chatRecordingVoice ? "recording" : ""}" id="chatMicBtn" title="Voice message">${state.chatRecordingVoice ? "⏹" : "🎤"}</button>` : ""}
        ${hasContent ? `<button class="chat-send-btn" id="chatSendBtn">➤</button>` : ""}
      </div>
    </div>
  `;

  document.getElementById("chatHeaderAvatar").onclick = () => openProfile(state.chatUid);
  document.getElementById("chatHeaderName").onclick = () => openProfile(state.chatUid);
  document.getElementById("chatBackBtn").onclick = () => {
    if (unsubscribeChat) unsubscribeChat();
    if (unsubscribeChatPresence) unsubscribeChatPresence();
    setState({ view: "inbox", chatStickerPanelOpen: false });
  };
  const input = document.getElementById("chatInput");
  input.oninput = (e) => {
    const prevHasContent = !!(state.chatText.trim() || state.chatMedia);
    state.chatText = e.target.value;
    const nowHasContent = !!(state.chatText.trim() || state.chatMedia);
    if (prevHasContent !== nowHasContent) {
      // Layout changes (icons <-> send button) only at this boundary, so re-render here
      // and restore focus/cursor — re-rendering on every keystroke would steal focus.
      const caretPos = e.target.selectionStart;
      render();
      const newInput = document.getElementById("chatInput");
      if (newInput) {
        newInput.focus();
        newInput.setSelectionRange(caretPos, caretPos);
      }
    } else {
      const sendBtn = document.getElementById("chatSendBtn");
      if (sendBtn) sendBtn.disabled = !nowHasContent;
    }
  };
  input.onkeydown = (e) => { if (e.key === "Enter") sendChatMessage(); };
  const sendBtn = document.getElementById("chatSendBtn");
  if (sendBtn) sendBtn.onclick = sendChatMessage;
  const galleryInput = document.getElementById("chatGalleryInput");
  if (galleryInput) galleryInput.onchange = handleChatMediaSelect;
  const stickerBtn = document.getElementById("chatStickerBtn");
  if (stickerBtn) stickerBtn.onclick = () => setState({ chatStickerPanelOpen: !state.chatStickerPanelOpen });
  const micBtn = document.getElementById("chatMicBtn");
  if (micBtn) micBtn.onclick = () => {
    if (state.chatRecordingVoice) stopVoiceRecording();
    else startVoiceRecording();
  };

  document.querySelectorAll(".chat-reaction-btn").forEach(btn => {
    btn.onclick = () => sendReactionMessage(btn.dataset.r);
  });
  document.querySelectorAll(".chat-sticker-panel button").forEach(btn => {
    btn.onclick = () => sendReactionMessage(btn.dataset.s);
  });

  const removeChatMediaBtn = document.getElementById("removeChatMediaBtn");
  if (removeChatMediaBtn) removeChatMediaBtn.onclick = () => setState({ chatMedia: null, chatMediaType: null });

  const box = document.getElementById("chatMessagesBox");
  if (box) box.scrollTop = box.scrollHeight;
}

function handleChatMediaSelect(e) {
  const file = e.target.files[0];
  if (!file) return;
  if (!isAllowedMediaFile(file)) {
    showToast("That file type isn't supported");
    e.target.value = "";
    return;
  }
  const isVideo = file.type.startsWith("video/");
  if (isVideo) {
    fileToDataUrl(file, (dataUrl) => setState({ chatMedia: dataUrl, chatMediaType: "video" }));
  } else {
    compressImageToDataUrl(file, { maxDim: 700, quality: 0.65 }, (compressed) => setState({ chatMedia: compressed, chatMediaType: "image" }));
  }
}

/* Quick emoji reaction (heart/laugh/thumbs-up/point/Streak Pet, or a sticker) sent as its own message */

/* Voice message recording via the mic button */
let voiceRecorderRef = null;
let voiceChunksRef = [];
let voiceTimerRef = null;
function startVoiceRecording() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    showToast("Microphone isn't available on this device/browser");
    return;
  }
  navigator.mediaDevices.getUserMedia({ audio: true }).then((stream) => {
    voiceChunksRef = [];
    voiceRecorderRef = new MediaRecorder(stream);
    voiceRecorderRef.ondataavailable = (e) => { if (e.data && e.data.size > 0) voiceChunksRef.push(e.data); };
    voiceRecorderRef.onstop = () => {
      stream.getTracks().forEach(t => t.stop());
      const blob = new Blob(voiceChunksRef, { type: "audio/webm" });
      const reader = new FileReader();
      reader.onload = () => sendVoiceMessage(reader.result);
      reader.readAsDataURL(blob);
    };
    voiceRecorderRef.start();
    state.chatRecordingVoice = true;
    state.chatVoiceSeconds = 0;
    render();
    voiceTimerRef = setInterval(() => {
      state.chatVoiceSeconds += 1;
      if (state.chatVoiceSeconds >= 60) stopVoiceRecording(); // 60s cap per voice note
    }, 1000);
  }).catch((err) => {
    console.error(err);
    showToast("Couldn't access the microphone");
  });
}

function stopVoiceRecording() {
  if (voiceRecorderRef && voiceRecorderRef.state !== "inactive") voiceRecorderRef.stop();
  if (voiceTimerRef) { clearInterval(voiceTimerRef); voiceTimerRef = null; }
  state.chatRecordingVoice = false;
  render();
}

function sendVoiceMessage(audioDataUrl) {
  if (!state.chatUid) return;
  const myUid = state.user.uid;
  const otherUid = state.chatUid;
  const threadId = threadIdFor(myUid, otherUid);
  const threadRef = db.collection("threads").doc(threadId);
  threadRef.set({
    participants: [myUid, otherUid],
    participantInfo: {
      [myUid]: { name: state.user.name, avatar: (state.profile && state.profile.avatar) || null },
      [otherUid]: { name: (state.chatProfile && state.chatProfile.name) || "User", avatar: (state.chatProfile && state.chatProfile.avatar) || null }
    },
    lastMessage: "🎤 Voice message",
    lastMessageAt: firebase.firestore.FieldValue.serverTimestamp(),
    [`unread.${otherUid}`]: firebase.firestore.FieldValue.increment(1),
    [`unread.${myUid}`]: 0
  }, { merge: true }).then(() => {
    return threadRef.collection("messages").add({
      senderUid: myUid,
      audio: audioDataUrl,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
  }).catch((err) => {
    console.error(err);
    showToast("Couldn't send the voice message");
  });
}

function sendChatMessage() {
  const text = state.chatText.trim();
  const media = state.chatMedia;
  const mediaType = state.chatMediaType;
  if (!text && !media) return;
  if (!state.chatUid) return;
  if (isBlockedEitherWay(state.chatUid)) { showToast("You can't message this account"); return; }
  const myUid = state.user.uid;
  const otherUid = state.chatUid;
  const threadId = threadIdFor(myUid, otherUid);
  const threadRef = db.collection("threads").doc(threadId);

  state.chatText = "";
  state.chatMedia = null;
  state.chatMediaType = null;
  render();

  threadRef.get().then((threadDoc) => {
    const isNewThread = !threadDoc.exists;
    // Create/update the thread doc FIRST (with participants set), then write the message.
    // If Firestore rules check the thread's participants before allowing a message write,
    // doing it in this order means a brand-new conversation's first message won't be blocked.
    return threadRef.set({
      participants: [myUid, otherUid],
      participantInfo: {
        [myUid]: { name: state.user.name, avatar: (state.profile && state.profile.avatar) || null },
        [otherUid]: { name: (state.chatProfile && state.chatProfile.name) || "User", avatar: (state.chatProfile && state.chatProfile.avatar) || null }
      },
      lastMessage: text || (mediaType === "video" ? "🎬 Video" : "📷 Photo"),
      lastMessageAt: firebase.firestore.FieldValue.serverTimestamp(),
      [`unread.${otherUid}`]: firebase.firestore.FieldValue.increment(1),
      [`unread.${myUid}`]: 0
    }, { merge: true }).then(() => {
      return threadRef.collection("messages").add({
        senderUid: myUid,
        text: text,
        image: mediaType === "image" ? media : null,
        video: mediaType === "video" ? media : null,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
    }).then(() => {
      if (isNewThread) logActivity(otherUid, "message", `${state.user.name} started a conversation with you`);
    });
  }).catch((err) => {
    console.error(err);
    showToast("Couldn't send message");
  });
}

/* ================= Profile screen ================= */
function openProfile(targetUid) {
  const uid = targetUid || state.user.uid;
  const isOwn = uid === state.user.uid;
  const ref = db.collection("users").doc(uid);

  ref.get().then((doc) => {
    const data = doc.exists ? doc.data() : { name: isOwn ? state.user.name : "User", handle: slugifyHandle(isOwn ? state.user.name : "user"), bio: "", avatar: null, followers: [], following: [], followRequests: [], private: false, pinnedPosts: [] };

    if (isOwn) {
      setState({ view: "profile", viewingUid: null, profile: { uid, ...data }, profileTab: "posts" });
      listenToProfileUser(uid);
      return;
    }

    // Viewing someone else's profile: fetch only their public posts
    db.collection("posts").where("authorUid", "==", uid).get().then((snap) => {
      const posts = snap.docs
        .map(d => ({ id: d.id, ...d.data() }))
        .filter(p => (!p.privacy || p.privacy === "public") && !p.hidden)
        .sort((a, b) => (b.createdAt?.toMillis?.() || 0) - (a.createdAt?.toMillis?.() || 0));
      setState({ view: "profile", viewingUid: uid, profile: { uid, ...data }, profileTab: "posts", viewingPosts: posts });
      listenToProfileUser(uid);
    }).catch((err) => {
      console.error(err);
      setState({ view: "profile", viewingUid: uid, profile: { uid, ...data }, profileTab: "posts", viewingPosts: [] });
      listenToProfileUser(uid);
    });
  }).catch((err) => {
    console.error(err);
    showToast("Couldn't load profile");
  });
}

/* Follow / unfollow / request from the profile screen's follow button — same
   private-account-aware model as toggleFollowFromList. */
function toggleFollow(targetUid) {
  const myUid = state.user.uid;
  const profile = state.profile || {};
  const amFollowing = (profile.followers || []).includes(myUid);
  const isRequested = !amFollowing && (profile.followRequests || []).includes(myUid);
  const targetRef = db.collection("users").doc(targetUid);
  const myRef = db.collection("users").doc(myUid);
  const batch = db.batch();

  if (amFollowing) {
    batch.update(targetRef, { followers: firebase.firestore.FieldValue.arrayRemove(myUid) });
    batch.update(myRef, { following: firebase.firestore.FieldValue.arrayRemove(targetUid) });
  } else if (isRequested) {
    batch.update(targetRef, { followRequests: firebase.firestore.FieldValue.arrayRemove(myUid) });
  } else if (profile.private) {
    batch.update(targetRef, { followRequests: firebase.firestore.FieldValue.arrayUnion(myUid) });
  } else {
    batch.update(targetRef, { followers: firebase.firestore.FieldValue.arrayUnion(myUid) });
    batch.update(myRef, { following: firebase.firestore.FieldValue.arrayUnion(targetUid) });
  }

  batch.commit().then(() => {
    if (!amFollowing && !isRequested) {
      if (profile.private) {
        logActivity(targetUid, "follow_request", `${state.user.name} requested to follow you`);
      } else {
        logActivity(targetUid, "follow", `${state.user.name} started following you`);
      }
    }
    // No need to manually reload — listenToProfileUser's real-time listener will refresh state.profile
  }).catch((err) => {
    console.error(err);
    showToast("Couldn't update follow status — check your connection or try again");
  });
}

      ${profile.facebookLink ? `<a class="profile-link-chip" href="${escapeHtml(profile.facebookLink)}" target="_blank" rel="noopener">f Facebook</a>` : ""}

function togglePinPost(postId) {

}

function openFollowList(targetUid, kind) {

/* Computes the three tab lists (Following / Followers / Friends) for whichever profile
   this screen is open on. "Friends" = mutual: people that profile follows AND who follow
   that profile back. */
function computeFollowListData() {
  const targetUid = state.followListUid;
  const isOwn = targetUid === state.user.uid;
  const profile = isOwn ? state.profile : (state.profileUserDoc && state.profileUserDoc.uid === targetUid ? state.profileUserDoc : (state.allUsers.find(u => u.uid === targetUid) || {}));
  const followingIds = profile.following || [];
  const followerIds = profile.followers || [];
  const friendIds = followingIds.filter(id => followerIds.includes(id));
  const idsForKind = { following: followingIds, followers: followerIds, friends: friendIds };
  const kind = idsForKind[state.followListKind] ? state.followListKind : "following";

  const q = (state.followListSearch || "").trim().toLowerCase();
  let list = state.allUsers.filter(u => (idsForKind[kind] || []).includes(u.uid));
  if (q) {
    list = list.filter(u => (u.name || "").toLowerCase().includes(q) || (u.handle || "").toLowerCase().includes(q));
  }
  return { profile, kind, list, isSearching: !!q, counts: { following: followingIds.length, followers: followerIds.length, friends: friendIds.length } };
}

/* Row renderer used only on this Following/Followers/Friends screen. Unlike the Friends
   tab's renderUserRow, there's no pin icon or Message button here — tapping the avatar or
   name opens the profile (where Message lives instead), and on your own list a "⋯" menu
   offers Remove.
   Button has 4 states from the two directions of the relationship:
     I follow them + they follow me   -> "Friends"     (gray)
     I follow them + they don't       -> "Following"   (gray)
     I don't follow + they follow me  -> "Follow back" (red)
     neither follows the other        -> "Follow"      (red) */
function renderFollowListUserRow(u, myUid, isOwn) {
  const amFollowing = (u.followers || []).includes(myUid);
  const theyFollowMe = (u.following || []).includes(myUid);
  const isRequested = !amFollowing && (u.followRequests || []).includes(myUid);
  const label = amFollowing ? (theyFollowMe ? "Friends" : "Following") : (isRequested ? "Requested" : (theyFollowMe ? "Follow back" : "Follow"));
  const cls = amFollowing ? "following" : (isRequested ? "requested" : "");
  const online = isUserOnline(u.uid);
  return `
    <div class="user-row">
      <div class="avatar" id="useravatar-${u.uid}">${u.avatar ? `<img src="${u.avatar}" />` : initials(u.name || "User")}${online ? `<span class="presence-dot"></span>` : ""}</div>
      <div class="user-row-info" id="userinfo-${u.uid}">
        <div class="u-name">${escapeHtml(u.name || "User")}</div>
        <div class="u-handle">@${escapeHtml(u.handle || slugifyHandle(u.name || "user"))}</div>
      </div>
      <div class="user-row-actions">
        <button class="pill-btn ${cls}" id="followbtn-${u.uid}">${label}</button>
        ${isOwn ? `<button class="kebab-btn" id="kebabbtn-${u.uid}" title="More">⋯</button>` : ""}
      </div>
    </div>
  `;
}

function wireFollowListRowHandlers(list) {
  list.forEach(u => {
    const rowAvatar = document.getElementById(`useravatar-${u.uid}`);
    const rowInfo = document.getElementById(`userinfo-${u.uid}`);
    const followBtn = document.getElementById(`followbtn-${u.uid}`);
    const kebabBtn = document.getElementById(`kebabbtn-${u.uid}`);
    if (rowAvatar) rowAvatar.onclick = () => openProfile(u.uid);
    if (rowInfo) rowInfo.onclick = () => openProfile(u.uid);
    if (followBtn) followBtn.onclick = () => toggleFollowFromList(u.uid);
    if (kebabBtn) kebabBtn.onclick = () => openRemoveConnMenu(u.uid);
  });
}

function followListRowsHtml(list, isSearching, myUid, isOwn) {
  return list.length
    ? list.map(u => renderFollowListUserRow(u, myUid, isOwn)).join("")
    : (isSearching
        ? `<div class="empty-nav-tab"><div class="big">🔍</div><div class="line1">No one found</div><div class="line2">Try a different search.</div></div>`
        : `<div class="empty-nav-tab"><div class="big">👥</div><div class="line1">Nobody here yet</div><div class="line2"></div></div>`);
}

function renderFollowListScreen() {
  const myUid = state.user.uid;
  const isOwn = state.followListUid === myUid;
  const { profile, kind, list, isSearching, counts } = computeFollowListData();
  const amFollowing = !isOwn && (profile.followers || []).includes(myUid);
  const isLockedForMe = !isOwn && profile.private && !amFollowing;
  const rowsHtml = isLockedForMe ? "" : followListRowsHtml(list, isSearching, myUid, isOwn);

  root.innerHTML = `
    <div class="back-row">
      <button class="profile-back-btn" id="followListBackBtn">←</button>
      <div class="back-title">Connections</div>
    </div>
    ${isLockedForMe ? `
    <div class="empty-state"><div class="big">🔒</div><div>This account is private</div><div style="font-size:13px; margin-top:6px;">Follow ${escapeHtml(profile.name || "this account")} to see their connections.</div></div>
    ` : `
    <div class="friends-sub-tabs">
      <button class="simple-tab ${kind === "following" ? "active" : ""}" id="followListTabFollowing">Following (${counts.following})</button>
      <button class="simple-tab ${kind === "followers" ? "active" : ""}" id="followListTabFollowers">Followers (${counts.followers})</button>
      <button class="simple-tab ${kind === "friends" ? "active" : ""}" id="followListTabFriends">Friends (${counts.friends})</button>
    </div>
    <div class="friends-search-wrap">
      <input id="followListSearchInput" type="text" placeholder="Search people by name or @handle" value="${escapeHtml(state.followListSearch || "")}" />
    </div>
    <div class="user-list">${rowsHtml}</div>
    `}
    ${isOwn ? `
    <div class="sheet-overlay" id="removeConnOverlay"></div>
    <div class="bottom-sheet" id="removeConnSheet">
      <div class="sheet-handle"></div>
      <button class="menu-list-item danger" id="removeConnBtn">🚫 Remove</button>
    </div>` : ""}
  `;
  document.getElementById("followListBackBtn").onclick = () => setState({ view: "profile" });

  if (isLockedForMe) return;

  document.getElementById("followListTabFollowing").onclick = () => setState({ followListKind: "following", followListSearch: "" });
  document.getElementById("followListTabFollowers").onclick = () => setState({ followListKind: "followers", followListSearch: "" });
  document.getElementById("followListTabFriends").onclick = () => setState({ followListKind: "friends", followListSearch: "" });

  // Same focus-preserving pattern as the Friends screen search box: update state and
  // re-render only the list, never the input itself, so typing doesn't lose focus/keyboard.
  const searchInput = document.getElementById("followListSearchInput");
  searchInput.oninput = (e) => { state.followListSearch = e.target.value; renderFollowListOnly(); };

  if (isOwn) {
    document.getElementById("removeConnOverlay").onclick = closeSheets;
    document.getElementById("removeConnBtn").onclick = doRemoveConnection;
  }

  wireFollowListRowHandlers(list);
}

function renderFollowListOnly() {
  const myUid = state.user.uid;
  const isOwn = state.followListUid === myUid;
  const { list, isSearching } = computeFollowListData();
  const listEl = document.querySelector(".user-list");
  if (!listEl) return;
  listEl.innerHTML = followListRowsHtml(list, isSearching, myUid, isOwn);
  wireFollowListRowHandlers(list);
}

/* "Remove" from the ⋯ menu on your own Following/Followers/Friends screen. On the
   Followers tab this removes them as your follower without touching who you follow; on
   the Following/Friends tabs it unfollows them — same effect as tapping "Following". */
function openRemoveConnMenu(uid) {
  activeFollowListRemoveUid = uid;
  const overlay = document.getElementById("removeConnOverlay");
  const sheet = document.getElementById("removeConnSheet");
  if (overlay) overlay.classList.add("open");
  if (sheet) sheet.classList.add("open");
}

function doRemoveConnection() {
  const uid = activeFollowListRemoveUid;
  const kind = state.followListKind;
  closeSheets();
  if (!uid) return;
  const myUid = state.user.uid;
  const targetRef = db.collection("users").doc(uid);
  const myRef = db.collection("users").doc(myUid);
  const batch = db.batch();
  if (kind === "followers") {
    batch.update(myRef, { followers: firebase.firestore.FieldValue.arrayRemove(uid) });
    batch.update(targetRef, { following: firebase.firestore.FieldValue.arrayRemove(myUid) });
  } else {
    batch.update(myRef, { following: firebase.firestore.FieldValue.arrayRemove(uid) });
    batch.update(targetRef, { followers: firebase.firestore.FieldValue.arrayRemove(myUid) });
  }
  batch.commit().then(() => {
    const updated = state.allUsers.map(u => {
      if (u.uid !== uid) return u;
      const followers = new Set(u.followers || []);
      const following = new Set(u.following || []);
      if (kind === "followers") following.delete(myUid); else followers.delete(myUid);
      return { ...u, followers: Array.from(followers), following: Array.from(following) };
    });
    setState({ allUsers: updated });
    showToast(kind === "followers" ? "Removed" : "Unfollowed");
  }).catch((err) => {
    console.error(err);
    showToast("Couldn't remove — check your connection or try again");
  });
}

function handleChangePassword() {
  const { pwCurrent, pwNew, pwConfirm } = state;
  if (!pwCurrent || !pwNew || !pwConfirm) { setState({ pwError: "Fill in all three fields." }); return; }
  if (pwNew.length < 6) { setState({ pwError: "New password must be at least 6 characters." }); return; }
  if (pwNew !== pwConfirm) { setState({ pwError: "New passwords don't match." }); return; }

  setState({ pwError: "", pwSaving: true });
  const user = auth.currentUser;
  const credential = firebase.auth.EmailAuthProvider.credential(user.email, pwCurrent);
  user.reauthenticateWithCredential(credential)
    .then(() => user.updatePassword(pwNew))
    .then(() => {
      setState({ pwSaving: false, pwCurrent: "", pwNew: "", pwConfirm: "", view: "settingsSecurity" });
      showToast("Password updated");
    })
    .catch((err) => {
      console.error(err);
      setState({ pwSaving: false, pwError: translateAuthError(err.code) });
    });
}

function handleDeleteAccount() {
  if (!state.delPassword) { setState({ delError: "Enter your password to confirm." }); return; }
  if (!confirm("This will permanently delete your account. Continue?")) return;

  setState({ delError: "", delSaving: true });
  const user = auth.currentUser;
  const uid = user.uid;
  const credential = firebase.auth.EmailAuthProvider.credential(user.email, state.delPassword);
  user.reauthenticateWithCredential(credential)
    .then(() => db.collection("users").doc(uid).delete())
    .then(() => user.delete())
    .then(() => {
      showToast("Account deleted");
      // auth.onAuthStateChanged() handles resetting local state once the sign-out fires.
    })
    .catch((err) => {
      console.error(err);
      setState({ delSaving: false, delError: translateAuthError(err.code) });
    });
}

/* Send a post directly into a chat thread with a friend, as a shared-post message */
function doSendPostToFriend(uid) {
  if (!uid || !activePostId) return;
  const post = state.posts.find(p => p.id === activePostId);
  if (!post) return;
  const myUid = state.user.uid;
  const threadId = threadIdFor(myUid, uid);
  const threadRef = db.collection("threads").doc(threadId);
  threadRef.set({
    participants: [myUid, uid],
    lastMessage: "Shared a post",
    lastMessageAt: firebase.firestore.FieldValue.serverTimestamp(),
    [`unread.${uid}`]: firebase.firestore.FieldValue.increment(1)
  }, { merge: true }).then(() => {
    return threadRef.collection("messages").add({
      senderUid: myUid,
      text: `Shared a post: "${(post.text || "").slice(0, 60)}"`,
      image: post.media && post.mediaType !== "video" ? post.media : null,
      sharedPostId: post.id,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
  }).then(() => {
    showToast("Sent!");
    closeSheets();
  }).catch((err) => { console.error(err); showToast("Couldn't send"); });
}

function doRepostFromSheet() {
  const post = state.posts.find(p => p.id === activePostId);
  if (post) toggleRepost(post);
  closeSheets();
}

/* Report a post; once a post collects 5+ distinct reports it is auto-hidden from public feeds
   (still visible to its own author, who sees it flagged) — a simple, real, working moderation layer. */
function doReportFromSheet() {
  if (!activePostId) return;
  const myUid = state.user.uid;
  const ref = db.collection("posts").doc(activePostId);
  db.runTransaction((tx) => {
    return tx.get(ref).then((doc) => {
      if (!doc.exists) return;
      const data = doc.data();
      const reports = data.reports || [];
      if (reports.includes(myUid)) return;
      const newReports = [...reports, myUid];
      tx.update(ref, { reports: newReports, hidden: newReports.length >= 5 ? true : (data.hidden || false) });
    });
  }).then(() => {
    showToast("Thanks — this post has been reported");
    closeSheets();
  }).catch((err) => { console.error(err); showToast("Couldn't submit report"); });
}

/* Real, detailed analytics for one of the user's own posts — shown as a proper bottom sheet

function openAnalyticsSheet(postId) {
  const post = state.posts.find(p => p.id === postId);
  if (!post) return;
  document.getElementById("qrOverlay")?.remove();
  document.getElementById("qrSheetEl")?.remove();
  document.getElementById("analyticsOverlay")?.remove();
  document.getElementById("analyticsSheetEl")?.remove();

  const likes = (post.likes || []).length;
  const comments = post.commentCount || 0;
  const reposts = (post.reposts || []).length;
  const saves = (post.savedBy || []).length;
  const views = post.views || 0;

  const overlay = document.createElement("div");
  overlay.className = "sheet-overlay open";
  overlay.id = "analyticsOverlay";

  const sheetEl = document.createElement("div");
  sheetEl.className = "bottom-sheet open";
  sheetEl.id = "analyticsSheetEl";
  sheetEl.innerHTML = `
    <div class="sheet-handle"></div>
    <div class="sheet-title">Post insights</div>
    <div class="analytics-row"><span>▶ Views</span><b>${views.toLocaleString()}</b></div>
    <div class="analytics-row"><span>❤️ Likes</span><b>${likes.toLocaleString()}</b></div>
    <div class="analytics-row"><span>💬 Comments</span><b>${comments.toLocaleString()}</b></div>
    <div class="analytics-row"><span>↻ Reposts</span><b>${reposts.toLocaleString()}</b></div>
    <div class="analytics-row"><span>🔖 Saves</span><b>${saves.toLocaleString()}</b></div>
  `;

  const closeAnalytics = () => { overlay.remove(); sheetEl.remove(); };
  overlay.onclick = closeAnalytics;

  document.body.appendChild(overlay);
  document.body.appendChild(sheetEl);
}

function doDownloadFromSheet() {
